            + '<div class="re"><span class="hero-badge '+(HERO_FACTION_CLS[res.hero.f]||'b-han')+'" style="width:56px;height:56px;font-size:28px;border-radius:14px;">'+esc(res.hero.s)+'</span></div>'
            + '<div class="rn">'+esc(res.hero.n)+'</div>'
            + '<div class="rt">'+res.hero.f+' · 等级 '+res.hero.g+' · 已在麾下</div>'
            + (seen>=2?('<div class="rc" style="color:#B8860B;font-weight:800;letter-spacing:2px;">'+starTxt+'</div>'):'')
            + '<div class="rc">折算为 ⭐'+res.merit+' 军功</div></div>';
          extra = seen>=5
            ? '<div class="quote" style="margin-top:12px;">满星了 —— '+esc(res.hero.n)+' 与你格外有缘。这 '+res.merit+' 军功也是实打实的。</div>'
            : '<div class="quote" style="margin-top:12px;">旧将重逢，也是缘分 —— '+esc(res.hero.n)+' 升至 '+starTxt+'。军功已入账。</div>';
          if(res.forced) extra = '<div class="quote" style="margin-top:12px;">🎯 保底触发！虽是旧将重逢，但这 '+res.merit+' 军功是实打实的。</div>' + extra;
        }else{
          const p=res.prize;
          const T=TIERS[p.tier]||TIERS.common;
          confetti(p&&p.tier==="legend"?130:70);
          box='<div class="result-box '+T.cls+'">'
            + '<div class="re">'+(p?p.emoji:"🎁")+'</div>'
            + '<div class="rn">'+(p?esc(p.name):"空榜")+'</div>'
            + '<div class="rt">'+(p?T.name:"再来一次吧")+'</div>'
            + (p?'<div class="rc">存入锦囊匣 · 攒够 ⭐'+p.merit+' 军功可开</div>':'')+'</div>';
        }
        $("#drawResult",sheet).innerHTML = box + extra
          + '<div class="grid2" style="margin-top:12px;">'
          + '<button class="btn ghost" onclick="closeSheet();">收好</button>'
          + '<button class="btn" onclick="closeSheet();openDraw();">再揭一次 🎟️'+(ticketsAvail())+'</button>'
          + '</div>';
        // 集齐奖励：攒满一个阵营 / 集齐全套，当场给反馈
        const done=res.collection||[];
        if(done.length){
          save();
          done.forEach((d,i)=>{
            setTimeout(()=>{
              confetti(d.type==="all"?220:150);
              if(d.type==="faction"){
                toast("🏁 「"+d.f+"」名将 "+d.tot+" 位尽入麾下！军功 +"+d.merit, 4200);
              }else{
                toast("👑 160 位名将尽入麾下 · 获称号「"+ALL_DONE_TITLE+"」！军功 +"+d.merit, 5200);
              }
            }, 3600 + i*1200);
          });
        }
        db.style.display="none";
        $("#ds",sheet).style.display="none";
        render();
      },800);
    };
  });
}

/* =====================================================================
   视图：一周
   ===================================================================== */
function viewWeek(){
  const base=weekStart(VIEW_DATE);
  const days=weekDates(base);
  let h='<div class="card">';
  h+='<div class="card-head"><h3>一周军令</h3><span class="hint">'+fmtMD(days[0])+' — '+fmtMD(days[6])+'</span></div>';
  h+='<div class="weeknav">'
   + '<button class="btn ghost sm" onclick="shiftWeek(-1)">← 上一周</button>'
   + '<span class="wk">'+(base===weekStart(TODAY())?"本周":fmtMD(days[0])+" 那周")+'</span>'
   + '<button class="btn ghost sm" onclick="shiftWeek(1)">下一周 →</button>'
   + '</div>';
  h+='<div class="scroll-x"><div class="wgrid">';
  for(const d of days){
    const wd=parseD(d).getDay();
    const list=dayExpected(d);
    h+='<div class="wcol'+(d===TODAY()?" today":"")+'">'
     + '<div class="wh">'+WDX[wd]+'<br><span style="font-size:10px;color:var(--ink-3);font-weight:600">'+parseD(d).getDate()+'</span></div>';
    if(!list.length){
      h+='<div class="wrest">🍵 休整</div>';
    }else{
      for(const t of list){
        const r=rec(d,t.id);
        const S=SUBJECTS[t.subject]||SUBJECTS.other;
        const done=r&&r.level>=0.5;
        const lc = !r?"·":(r.type==="full"?"⭐":(r.type==="skip"?"🏳️":"◑"));
        h+='<div class="wchip'+(done?" done":"")+'" style="border-left-color:'+S.color+'" onclick="openCheck(\''+t.id+'\',\''+d+'\')" title="'+esc(t.name)+'">'
         + esc(t.name.slice(0,4))+'<span class="lc"> '+lc+'</span></div>';
      }
      for(const t of holidayTasks(d)) h+='<div class="wchip done" style="border-left-color:#B7D8C4;opacity:.75;">'+esc(t.name.slice(0,4))+'<span class="lc"> ✓</span></div>';
    }
    h+='</div>';
  }
  h+='</div></div>';
  let tot=0,done=0;
  for(const d of days){
    if(d>TODAY()) continue;
    const list=dayExpected(d); tot+=list.length;
    done+=list.filter(t=>{const r=rec(d,t.id);return r&&r.level>=0.5;}).length;
  }
  const pct=tot?Math.round(done/tot*100):0;
  h+='<div class="divider"></div>'
   + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px;">'
   + '<span>本周军令达成</span><span>'+pct+'%</span></div>'
   + '<div class="prog"><i style="width:'+pct+'%"></i></div>'
   + '<button class="btn jade" style="width:100%;margin-top:14px;" onclick="goReport()">去看本周军报 →</button>';
  h+='</div>';
  return h;
}
function shiftWeek(n){ VIEW_DATE=addD(weekStart(VIEW_DATE),n*7); render(); }
function goReport(){ VIEW="report"; VIEW_DATE=TODAY(); render(); }

/* =====================================================================
   视图：武将（图鉴 + 锦囊匣）
   ===================================================================== */
function viewHeroes(){
  const owned=heroOwnedCount(), tot=heroTotal();
  const av=availMerit(), tk=ticketsAvail();

  }else{
    for(const v of un){
      const T=TIERS[v.tier]||TIERS.common;
      const bad=!validPrizeCost(v.merit);          // 旧数据门槛坏了：只禁用这一张，不影响整匣

       + '<span class="oe">'+v.emoji+'</span>'
       + '<span class="ob"><span class="ot">'+esc(v.name)+'</span>'
       + '<span class="od">'+T.name+' · '+(v.from==="boss"?"破敌所得":(v.from==="prize"?"破敌所得":"招贤所得"))+' · '+v.gotAt+'</span></span>'
       + '<span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">'
       + '<span class="os">'+(bad?"门槛异常":"⭐"+v.merit)+'</span>'
       + '<button class="btn '+(can?"gold":"ghost")+' sm" '+(can?'onclick="redeem(\''+v.uid+'\')"':"disabled")+'>'+(bad?"需核查":(can?"开启":"还差 "+(v.merit-av)))+'</button>'
       + '</span>'
       + '<button class="wishbtn'+(v.wish?" on":"")+'" title="最想要这个" onclick="markWish(\''+v.uid+'\')">'+(v.wish?"❤️":"🤍")+'</button>'
       + '<button class="wishbtn" title="调整或删除" onclick="openVaultEdit(\''+v.uid+'\')">⋯</button>'
       + '</div>';
    }

      h+='<button class="btn ghost" style="width:100%;margin-top:6px;" onclick="openSwap()">🔁 同等军功的锦囊可互换</button>';
    }

  if(re.length){
    h+='<div class="divider"></div><div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px;">已开启 '+re.length+' 件</div>';
    for(const v of re) h+='<div class="prize-row" style="opacity:.5;"><span class="pe">'+v.emoji+'</span><span class="pn">'+esc(v.name)+'</span><span class="pc">已开启</span></div>';
  }
  h+='</div>';

  // ===== 兑现台：开了锦囊不等于拿到手 =====
  const pend=couponsPending(), doneC=couponsDone(), rate=couponRate();
  h+='<div class="card"><div class="card-head"><h3>兑现台</h3>'
   + '<span class="hint">'+(pend.length?pend.length+" 张待兑现":"都兑现了")+'</span></div>';
  if(rate!==null){
    const tone = rate>=90 ? "var(--ok)" : (rate>=60 ? "var(--gold)" : "var(--zhu)");
    h+='<div class="ratebar"><span class="rv" style="color:'+tone+'">'+rate+'%</span>'
     + '<span class="rt">兑现率 · 已兑现 '+doneC.length+' / 共 '+(ST.coupons||[]).length+' 张<br>'
     + (rate>=90 ? "说到做到，这套系统的信用很稳"
        : rate>=60 ? "多数兑现了，还有几张在等"
        : "攒了很久的军功换来一句「下次吧」，孩子会算这笔账")+'</span></div>';
  }
  if(!(ST.coupons||[]).length){
    h+='<div class="empty"><span class="ee">🎫</span>还没有兑现券<br>'
     + '<span style="font-size:12px;">开启锦囊时会自动发一张，<br>大人点「已兑现」之后才算真的到手。</span></div>';
  }else{
    for(const c of pend){
      const late=couponDays(c)>=7;
      h+='<div class="coupon'+(late?" overdue":"")+'">'
       + '<span class="no">No.'+String(c.id).slice(-4).toUpperCase()+'</span>'
       + '<span class="ce">'+c.emoji+'</span>'
       + '<span class="cb"><span class="ct">'+esc(c.name)+'</span>'
       + '<span class="cd">'+couponDaysText(c)+'</span></span>'
       + '<button class="btn jade sm" onclick="openCouponSettle(\''+c.id+'\')">已兑现</button>'
       + '</div>';
    }
    for(const c of doneC.slice(-4).reverse()){
      h+='<div class="coupon done">'
       + '<span class="ce">'+c.emoji+'</span>'
       + '<span class="cb"><span class="ct">'+esc(c.name)+'</span>'
       + '<span class="cd">'+couponDaysText(c)+'</span></span>'
       + '<span style="font-size:15px;color:var(--ok);font-weight:700;">✓</span>'
       + '</div>';
    }

  h+='</div>';

  // 武将图鉴
  h+='<div class="card"><div class="card-head"><h3>武将图鉴</h3>'
   + '<span class="hint">已招募 '+heroOwnedCount()+' / '+heroTotal()+(ST.allDone?(' · '+ALL_DONE_TITLE):'')+'</span></div>';
  for(const fac of FACTION_ORDER){
    const list=HEROES_BY_FACTION[fac]||[];
    if(!list.length) continue;
    const got=list.filter(x=>heroOwned(x.n)).length;
    const full = got>=list.length;
    h+='<div class="hero-tier-title">'+fac+'<span class="cnt"'
     + (full?' style="color:var(--ok);font-weight:800;"':'')+'>'
     + (full ? '✓ 尽入麾下' : (got+' / '+list.length))+'</span></div>';
    h+='<div class="heroes">';
    for(const x of list){
      const on=heroOwned(x.n);
      const met=!on && x.c>0 && chapter>=x.c;      // 读到过这一回：剪影变灰卡，但还没入麾下
      const seen=on?(ST.heroCount[x.n]||1):0;
      const stars=seen>=2?('<span class="tag-stars">'+'★'.repeat(Math.min(seen,5))+'</span>'):'';
      const cls="hero-card "+HERO_TIER_CLS[x.tier]+(on?"":(met?" met":" locked"))+(seen>=5?" maxed":"");
      const badge = on
        ? '<div class="hero-badge '+(HERO_FACTION_CLS[x.f]||'b-han')+'">'+esc(x.s)+'</div>'
        : (met?'<div class="hero-badge '+(HERO_FACTION_CLS[x.f]||'b-han')+'" style="opacity:.45">'+esc(x.s)+'</div>'

      h+='<div class="'+cls+'" '+((on||met)?'onclick="showHero(\''+esc(x.n).replace(/'/g,"")+'\')"':'')+'>'
       + '<span class="tag-r">'+x.g+'</span>'+stars
       + badge
       + '<div class="hn">'+(on||met?esc(x.n):"未识得")+'</div>'
       + '<div class="hd">'+(on?esc(x.d):(met?("第"+x.c+"回 · 已识得"):esc(riddleOf(x))))+'</div>'
       + '</div>';
    }
    h+='</div>';
  }
  h+='</div>';

  // 锦囊概率说明
  h+='<div class="card"><div class="card-head"><h3>奖励一览</h3><span class="hint">抽中锦囊时的概率</span></div>';
  for(const tk2 of ["common","rare","legend"]){
    const list=ST.prizes.filter(p=>p.tier===tk2);
    if(!list.length) continue;
    const wsum=list.reduce((a,b)=>a+(b.weight||0),0);
    h+='<div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin:10px 0 6px;">'+TIERS[tk2].name+'（权重合计 '+wsum+'）</div>';
    for(const p of list) h+='<div class="prize-row"><span class="pe">'+(p.emoji||"🎁")+'</span><span class="pn">'+esc(p.name)+'</span><span class="pc">⭐'+p.merit+' · '+p.weight+'</span></div>';
  }
  h+='</div>';
  return h;
}

/* ---- 锦囊匣：已抽到但还没开启的奖励，家长可以改或删 ---- */
function openVaultEdit(uidv){
  const v=ST.vault.find(x=>x.uid===uidv); if(!v) return;
  if(v.redeemed){ toast("已经开启的锦囊不能改，账目已经结过"); return; }
  let h='<h3>调整这张锦囊</h3><div class="sh-sub">改的是孩子手里这一张，不影响「锦囊设置」里的模板。</div>';
  h+='<div class="field"><label>奖励名</label><input type="text" id="vName" maxlength="20" value="'+esc(v.name)+'"></div>';
  h+='<div class="grid2"><div class="field"><label>图标</label><input type="text" id="vEmoji" value="'+esc(v.emoji||"🎁")+'"></div>'
   + '<div class="field"><label>开启需军功</label><input type="number" id="vMerit" min="1" value="'+(v.merit||50)+'"></div></div>';
  h+='<div class="grid2" style="margin-top:6px;"><button class="btn danger" id="vDel">删除</button><button class="btn" id="vOk">保存</button></div>';
  h+='<button class="btn ghost" style="width:100%;margin-top:8px;" onclick="closeSheet()">取消</button>';
  openSheet(h,(sheet)=>{
    $("#vOk",sheet).onclick=()=>{
      if(saveVaultItem(uidv, ($("#vName",sheet).value||"").trim(), ($("#vEmoji",sheet).value||"").trim(), $("#vMerit",sheet).value)){
        closeSheet(); refreshTop(); render(); toast("已保存 ✓");
      }
    };
    $("#vDel",sheet).onclick=()=>{
      if(!confirm("从锦囊匣里删掉「"+v.name+"」？没有消耗过军功，删除不影响星星。")) return;
      if(deleteVaultItem(uidv)){ closeSheet(); refreshTop(); render(); toast("已删除"); }
    };
  });
}
function saveVaultItem(uidv,name,emoji,merit){
  const v=ST.vault.find(x=>x.uid===uidv); if(!v) return false;
  if(v.redeemed){ toast("已经开启的锦囊不能改"); return false; }
  const cost=moneyNumber(merit);
  if(!name){ toast("先给它起个名字"); return false; }
  if(!validPrizeCost(cost)){ toast("开启门槛必须是大于0的有效军功数"); return false; }
  v.name=name; v.emoji=emoji||"🎁"; v.merit=cost; delete v.meritInvalid;
  return !!save();
}
function deleteVaultItem(uidv){
  const v=ST.vault.find(x=>x.uid===uidv); if(!v) return false;
  if(v.redeemed){ toast("已经开启的锦囊不能删，账目已经结过"); return false; }
  ST.vault=ST.vault.filter(x=>x.uid!==uidv);
  return !!save();
}

function redeem(u){
  const v=ST.vault.find(x=>x.uid===u); if(!v) return;
  // 纵深防御：界面已经把「已开启」分到另一区了，这里再挡一道。
  // 否则万一有别的路径调到这里，会重复扣军功、重复发兑现券。
  if(v.redeemed){ toast("这个锦囊已经开启了"); return; }
  if(!validPrizeCost(v.merit)){ toast("这个锦囊的军功门槛异常，未扣星星，请先核查奖励设置",4200); return; }
  const cost=moneyNumber(v.merit), av=availMerit();
  if(!Number.isFinite(av) || av<cost){ toast("还差 "+round1(cost-av)+" 军功"); return; }
  const c=commitEconomy(()=>{
    v.redeemed=true; v.redeemedAt=TODAY();
    v.paidMerit=cost;                 // 记录当时实付，模板改价不能追溯改写支出
    return couponFor(v);
  });
  if(!c) return;
  refreshTop(); render(); confetti(90);
  openSheet(
    '<div class="ceremony-hero"><span class="ce">'+c.emoji+'</span>'
    + '<div class="cn">'+esc(c.name)+'</div></div>'
    + '<div class="sh-sub" style="text-align:center;margin-top:8px;">锦囊已开 · 兑现券 No.'+String(c.id).slice(-4).toUpperCase()+'</div>'

function openSwap(){
  const un=ST.vault.filter(v=>!v.redeemed);
  const costs=[...new Set(un.map(v=>v.merit))];
  if(costs.length<2){ toast("目前锦囊都在同一档，无需互换"); return; }
  let h='<h3>🔁 互换锦囊</h3><div class="sh-sub">只有相同军功门槛的锦囊之间可以互换</div>';
  const groups={};
  for(const v of un){ (groups[v.merit]=groups[v.merit]||[]).push(v); }
  h+='<div class="field"><label>要换出去的</label><select id="swFrom">';
  for(const c of costs) for(const v of groups[c]) h+='<option value="'+v.uid+'">'+v.emoji+' '+esc(v.name)+'（⭐'+c+'）</option>';
  h+='</select></div>';
  h+='<div class="field"><label>换成（同门槛）</label><select id="swTo"></select></div>';
  h+='<div class="grid2"><button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" id="swOk">确认互换</button></div>';
  openSheet(h,(sheet)=>{
    const from=$("#swFrom",sheet), to=$("#swTo",sheet);
    const sync=()=>{
      const v=ST.vault.find(x=>x.uid===from.value);
      to.innerHTML = groups[v.merit].filter(x=>x.uid!==from.value)
        .map(x=>'<option value="'+x.uid+'">'+x.emoji+' '+esc(x.name)+'</option>').join("") || '<option value="">（同门槛没有别的锦囊了）</option>';
    };
    from.onchange=sync; sync();
    $("#swOk",sheet).onclick=()=>{
      const a=ST.vault.find(x=>x.uid===from.value);
      const b=ST.vault.find(x=>x.uid===to.value);
      if(!a||!b){ toast("同门槛没有可换的锦囊"); return; }
      const tmp={name:a.name,emoji:a.emoji,tier:a.tier,merit:a.merit,from:a.from};
      a.name=b.name; a.emoji=b.emoji; a.tier=b.tier; a.merit=b.merit; a.from=b.from;
      b.name=tmp.name; b.emoji=tmp.emoji; b.tier=tmp.tier; b.merit=tmp.merit; b.from=tmp.from;
      save(); closeSheet(); render(); toast("已互换 ✓");
    };
  });
}

function viewReport(){
  const base=weekStart(VIEW_DATE);
  const days=weekDates(base);
  let tot=0,done=0,full=0,half=0,poor=0,miss=0,minutes=0;
  let restDays=0;
  for(const d of days){
    if(d>TODAY()) continue;
    if(isRestDay(d)){ restDays++; continue; }      // 休整日不算进分母
    const list=dayExpected(d); tot+=list.length;
    for(const t of list){
      const r=rec(d,t.id);
      if(r&&r.level>=0.5) done++;
      if(r){
        if(r.type==="full") full++;
        else if(r.type==="half") half++;
        else if(r.type==="poor") poor++;
        else if(r.type==="miss") miss++;
        minutes+=r.minutes||0;
      }
    }
  }
  let ws=0; for(const d of days) ws+=dayMerit(d);
  const pct=tot?Math.round(done/tot*100):0;

  let h='<div class="card">';
  h+='<div class="card-head"><h3>本周军报</h3><span class="hint">'+(base===weekStart(TODAY())?"本周":fmtMD(days[0]))+'</span></div>';
  h+='<div class="weeknav">'
   + '<button class="btn ghost sm" onclick="shiftWeek(-1)">← 上一周</button>'
   + '<span class="wk">'+fmtMD(days[0])+' — '+fmtMD(days[6])+'</span>'
   + '<button class="btn ghost sm" onclick="shiftWeek(1)">下一周 →</button></div>';
  if(restDays) h+='<div class="holiday-row">🍵 本周有 '+restDays+' 天在休整，已从统计里剔除</div>';
  h+='<div class="report-stat">'
   + '<div class="rs-box"><div class="v">'+pct+'%</div><div class="l">军令达成</div></div>'
   + '<div class="rs-box"><div class="v">'+round1(ws)+'</div><div class="l">所得军功</div></div>'
   + '<div class="rs-box"><div class="v">'+full+'</div><div class="l">完胜</div></div>'
   + '<div class="rs-box"><div class="v">'+(half+poor)+'</div><div class="l">苦战/惨胜</div></div>'
   + '<div class="rs-box"><div class="v">'+minutes+'</div><div class="l">用功分钟</div></div>'
   + '<div class="rs-box"><div class="v">'+done+'/'+tot+'</div><div class="l">完成/总项</div></div>'
   + '</div>';

  // ===== 主动性：这套系统真正该看的数字 =====
  (function(){
    const sig=signalsBetween(days[0], days[6]);
    h+='<div class="divider"></div>';
    h+='<div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px;">'
     + '<span style="font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ok);line-height:1;">'+sig.length+'</span>'
     + '<span style="font-size:12.5px;font-weight:700;color:var(--ink-2);">本周孩子主动做的事</span></div>';
    if(!sig.length){
      h+='<div style="font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.75;">'
       + '这一周还没有。完成率可以靠推，主动推不出来 ——<br>'
       + '所以这个数字比上面那个百分比更值得留意。</div>';
    }else{
      h+='<div class="actlist">';
      for(const s of sig.slice(-12).reverse()){
        const icon = s.kind==="extra" ? "✋" : s.kind==="add_task" ? "➕" : s.kind==="too_hard" ? "🤔" : "❤️";
        h+='<div class="actrow"><span class="ae">'+icon+'</span>'
         + '<span class="an">'+esc(SIGNAL_NAME[s.kind]||"主动")+(s.detail?('：'+esc(s.detail)):'')+'</span>'
         + '<span class="ad">'+s.date.slice(5)+'</span></div>';
      }
      h+='</div>';
    }
  })();

  // ===== 调整建议：只有「推」没有「退」，孩子会一直在失败里泡着 =====
  if(base===weekStart(TODAY())){
    const hints=difficultyHints();
    if(hints.length){
      h+='<div class="divider"></div>';
      h+='<div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;">⚖️ 调整建议</div>';
      for(const x of hints){
        h+='<div class="hintcard '+x.tone+'">'
         + '<span class="hi">'+(x.tone==="warn"?"⚠️":"⏱")+'</span>'
         + '<span class="hb"><span class="ht">'+esc(x.title)+'</span>'
         + '<span class="hd">'+esc(x.body)+'</span>'
         + '<span class="ha"><button class="btn ghost sm" onclick="applyHint(\''+x.taskId+'\',\''+x.kind+'\')">'+esc(x.action)+'</button></span>'
         + '</span></div>';

      h+='<div style="font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.7;margin-top:4px;">'
       + '任务做不完，多数时候是任务的问题，不是孩子的问题。</div>';
    }
  }

  const rows=[];
  for(const t of ST.tasks){
    if(t.archived) continue;
    let target=0,dn=0;
    if(t.type==="flex"){ target=Math.max(1,t.weekTarget||1); dn=Math.min(weekDone(t.id,base),target); }
    else{
      for(const d of days){
        if(d>TODAY()) continue;
        if(isRestDay(d)) continue;                     // 休整日不算
        const appear = t.type==="daily" || (t.weekdays||[]).includes(parseD(d).getDay());
        if(!appear) continue;
        target++; if((rec(d,t.id)||{level:0}).level>=0.5) dn++;
      }
    }
    if(!target) continue;
    rows.push({name:t.name,emoji:t.emoji||SUBJECTS[t.subject].icon,target,dn,color:SUBJECTS[t.subject].color});
  }
  if(rows.length){
    h+='<div class="divider"></div><div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;">各项军令达成情况</div>';
    for(const r of rows){
      const p=Math.round(r.dn/r.target*100);
      const ok=p>=100;
      h+='<div style="margin-bottom:10px;">'
       + '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;">'
       + '<span>'+r.emoji+' '+esc(r.name)+'</span><span style="color:'+(ok?"var(--ok)":"var(--ink-3)")+'">'+r.dn+'/'+r.target+(ok?" ✓":"")+'</span></div>'
       + '<div class="prog mini"><i style="width:'+p+'%;background:'+r.color+'"></i></div></div>';
    }
  }

  const rep = ST.reports[base]||{good:"",improve:"",plan:""};
  h+='<div class="divider"></div>';
  h+='<div class="quote" style="margin-bottom:12px;">复盘之要，在少说教、多听孩子说。改进目标写一句他听得懂、够得着的短句就够了。</div>';
  h+='<div class="field"><label>🏅 这周做得好的地方</label><textarea id="rGood" placeholder="例：英语阅读提前两天完成，自己发现的">'+esc(rep.good)+'</textarea></div>';
  h+='<div class="field"><label>🔧 需要改进之处</label><textarea id="rImprove" placeholder="例：磨耳朵容易拖延">'+esc(rep.improve)+'</textarea></div>';
  h+='<div class="field"><label>🎯 下周方略</label><textarea id="rPlan" placeholder="例：磨耳朵的功夫用在平时">'+esc(rep.plan)+'</textarea></div>';
  h+='<button class="btn jade" style="width:100%;" onclick="saveReport(\''+base+'\')">存下这份军报</button>';
  h+='</div>';

  const keys=Object.keys(ST.reports).sort().reverse();
  if(keys.length){
    h+='<div class="card"><div class="card-head"><h3>往期军报</h3><span class="hint">'+keys.length+' 份</span></div>';
    for(const k of keys.slice(0,26)){
      const r=ST.reports[k];
      h+='<div class="hist-item"><div class="hh"><span>'+fmtMD(k)+' 那周</span><span style="color:var(--ink-3);font-weight:600;">'+((r.pct!=null)?r.pct+"%":"")+'</span></div>';
      if(r.good) h+='<div class="hl">🏅 '+esc(r.good)+'</div>';
      if(r.improve) h+='<div class="hl">🔧 '+esc(r.improve)+'</div>';
      if(r.plan) h+='<div class="hl">🎯 '+esc(r.plan)+'</div>';
      h+='</div>';
    }
    h+='</div>';
  }
  return h;
}
function saveReport(base){
  const g=$("#rGood").value.trim(), i=$("#rImprove").value.trim(), p=$("#rPlan").value.trim();
  const days=weekDates(base);
  let tot=0,done=0;
  for(const d of days){
    if(d>TODAY()) continue;
    const list=dayExpected(d); tot+=list.length;
    done+=list.filter(t=>{const r=rec(d,t.id);return r&&r.level>=0.5;}).length;
  }
  ST.reports[base]={good:g,improve:i,plan:p,savedAt:TODAY(),pct:tot?Math.round(done/tot*100):0};
  calcAchievements(); save(); render(); toast("军报已存 ✓");
}

function delTask(id){
  const t=ST.tasks.find(x=>x.id===id); if(!t) return;
  if(!confirm("删除「"+t.name+"」？会同时清掉它的历史点卯记录（已结算的历史军功不受影响）。")) return;
  settleLedger();   // 先冻结历史，已发的奖励不会被带走
  ST.tasks=ST.tasks.filter(x=>x.id!==id);
  for(const d in ST.records){ delete ST.records[d][id]; if(!Object.keys(ST.records[d]).length) delete ST.records[d]; }
  save(); closeSheet(); refreshTop(); render(); toast("已删除");
}

      save(); closeSheet(); render(); toast(isNew?"锦囊已入榜 🎁":"已保存 ✓");
    };

function exportRawBackup(){
  const raw=localStorage.getItem(KEY);
  if(!raw){ toast("没有原始存档可导出"); return; }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([raw],{type:"application/json"}));
  a.download="少年主公原始存档_"+TODAY()+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportData(){
  const json=JSON.stringify(ST,null,2);
  const fname="少年主公备份_"+TODAY()+".json";
  const done = msg => { ST.lastBackup=TODAY(); save(); toast(msg); };
  // iPad 上优先唤起系统分享面板：可以直接存 iCloud、隔空投送或发微信，
  // 不用先落到「文件」App 再自己找。
  try{
    if(navigator.share && typeof File==="function"){
      const f=new File([json],fname,{type:"application/json"});
      if(!navigator.canShare || navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:"少年主公备份"}).then(()=>{
          done("已分享备份 📤");
        }).catch(err=>{
          // 用户自己点「取消」就什么都别做；分享失败则必须退回下载，
          // 否则「导出备份」按下去会毫无反应 —— 备份按钮不能有静默失败。
          if(err && err.name==="AbortError") return;
          downloadBackup(json,fname) ? done("已导出备份 📤") : toast("备份没能导出，请换用 Safari 打开后再试",4200);
        });
        return;
      }
    }
  }catch(e){}
  if(downloadBackup(json,fname)) done("已导出备份 📤");
  else toast("备份没能导出，请换用 Safari 打开后再试",4200);
}
function downloadBackup(json,fname){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    a.download=fname;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    return true;
  }catch(e){ return false; }
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      const next=prepareState(o); // 先在独立对象里校验并迁移，失败不动当前存档
      if(!confirm("导入会覆盖当前全部数据，确定吗？会先保留当前本地快照。")) return;
      const current=localStorage.getItem(KEY);
      localStorage.setItem(KEY+"_before_import",current||JSON.stringify(ST));
      const previous=ST, expected=STORAGE_LAST_RAW;
      ST=next;
      if(!save()){ ST=previous; STORAGE_LAST_RAW=expected; return; }
      refreshTop(); render(); toast("导入成功 ✓");
    }catch(e){ alert("导入失败：" + e.message); }
    input.value="";
  };
  fr.readAsText(f);
}

/* =====================================================================
   弹窗 & 渲染
   ===================================================================== */
function openSheet(html, after){
  closeSheet();
  const mask=document.createElement("div");
  mask.className="mask";
  mask.innerHTML='<div class="sheet">'+html+'</div>';
  mask.addEventListener("click",e=>{ if(e.target===mask) closeSheet(); });
  document.body.appendChild(mask);
  document.body.style.overflow="hidden";
  if(after) after($(".sheet",mask));
}
function closeSheet(){
  const m=$(".mask"); if(m) m.remove();
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* ---- 点卯飘字：让反馈有实体感 ---- */
function floatUp(text, x, y, gold){
  try{
    const el=document.createElement("div");
    el.className="float-up"+(gold?" gold":"");
    el.textContent=text;
    el.style.left=(x||window.innerWidth/2)+"px";
    el.style.top=(y||window.innerHeight*0.4)+"px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1250);
  }catch(e){}
}
// 从被点击的卡片位置飘出来
function floatFromEl(el,text,gold){
  if(!el) return floatUp(text,null,null,gold);
  const r=el.getBoundingClientRect();
  floatUp(text, r.left+r.width/2, r.top+Math.min(40,r.height/2), gold);
}

(function init(){
  ST=load();
  if(!ST && LOAD_ERROR){
    // 旧存档异常时不能默默恢复出厂并覆盖；留下载原文件的恢复出口。
    $("#main").innerHTML='<div class="card"><h3>存档需要核查，已暂停写入</h3><p>'+esc(LOAD_ERROR)+'</p><p>原数据没有清空。请导出原始存档后再处理。</p><button class="btn" onclick="exportRawBackup()">导出原始存档</button></div>';
    return;
  }
  if(!ST){ ST=defaultState(); save(); }
  applySkin();
  // 存不住的话，先把话说清楚
  checkStorage();
  // 图鉴升级的补偿提示，看过一次就不再提
  if(ST.heroMigrateNote){ toast(ST.heroMigrateNote, 6000); delete ST.heroMigrateNote; save(); }
  // 能申请就申请持久化存储，别让浏览器在磁盘紧张时把孩子的记录回收掉
  requestPersistentStorage().then(function(){
    if(VIEW==="settings") render();      // 设置页正开着的话，把结果刷出来
  });
  // 先把历史上还没结算的日子冻住，之后改任务都不会再改写它们
  const settled=settleLedger();
  if(calcAchievements()||settled) save();
  VIEW_DATE=TODAY();
  $("#tabs").addEventListener("click",e=>{
    const b=e.target.closest("button[data-view]"); if(!b) return;
    VIEW=b.dataset.view;
    if(VIEW==="week"||VIEW==="report"||VIEW==="stats") VIEW_DATE=TODAY();
    render();
  });
  $("#btnDraw").addEventListener("click",openDraw);
  render();
  window.render=render; window.setTab=setTab; window.gotoDate=gotoDate;
  window.openCheck=openCheck; window.clearRec=clearRec;
  window.attackBoss=attackBoss; window.shiftWeek=shiftWeek; window.goReport=goReport;
  window.openDraw=openDraw; window.showHero=showHero;
  window.redeem=redeem; window.openSwap=openSwap; window.saveReport=saveReport;
  window.saveBasic=saveBasic;
  window.openTaskEdit=openTaskEdit; window.delTask=delTask;
  window.openPrizeEdit=openPrizeEdit; window.delPrize=delPrize;

  // 离线：只有通过 http(s) 打开时才注册（file:// 不支持 service worker，静默跳过）
  try{
    if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
      navigator.serviceWorker.register("sw.js").catch(()=>{});

  // 每日首次打开：先看有没有任务毕业，再给一张今日仪式卡

})();
