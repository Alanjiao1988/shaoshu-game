<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>少年主公 · 学习军令台</title>
<!-- iPad / iPhone：加到主屏幕后全屏运行，像原生 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="少年主公">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B93A32">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<!-- 主屏图标：iOS 只认 apple-touch-icon（不支持 data URI，必须是真实图片文件） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- manifest 也在同一个目录里；本地单文件打开时它取不到，只是控制台一句 404，不影响使用 -->
<link rel="manifest" href="manifest.json">
<style>
/* ============ 基础 & 主题（宣纸 · 朱砂 · 墨） ============ */
:root{
  --c-cn:#3F8F72;      /* 军师营 · 竹青 */
  --c-math:#C08A1E;    /* 粮草营 · 麦金 */
  --c-en:#41639E;      /* 鸿胪寺 · 黛蓝 */
  --c-other:#B4453C;   /* 演武场 · 朱砂 */
  --ink:#2E2A26; --ink-2:#6B6259; --ink-3:#A69C8E;
  --card:#FFFDF8; --line:#EBE0CE; --line-2:#F3EBDB;
  --bg1:#FBF6EC; --bg2:#F5EDDD; --bg3:#EDE1CD;
  --zhu:#B93A32; --zhu-2:#D4665C; --gold:#B8912A;
  --ok:#3F8F72; --warn:#C0872A; --bad:#B4483F;
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --sh:0 2px 9px rgba(96,74,44,.09);
  --sh-lg:0 8px 26px rgba(96,74,44,.16);
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
}
html[data-skin="spring"]{--bg1:#FDEDE4;--bg2:#FBE3D8;--bg3:#F6D8CE;--zhu:#C0352B;}
html[data-skin="dragon"]{--bg1:#EDF6EC;--bg2:#E2F0E4;--bg3:#D6E8DC;--zhu:#2F7A55;--zhu-2:#4F9C74;}
html[data-skin="midautumn"]{--bg1:#EFF3FA;--bg2:#E7ECF6;--bg3:#DDE4F0;--zhu:#3A5A96;--zhu-2:#5B79B4;}
html[data-skin="national"]{--bg1:#FDECEA;--bg2:#FBE2DD;--bg3:#F6D6D0;--zhu:#C0352B;}
html[data-skin="kids"]{--bg1:#FBF4E2;--bg2:#F7EEDA;--bg3:#F0E4CC;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{
  /* 防止横屏时 iOS 自作主张放大字号 */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(166deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%) fixed;
  min-height:100vh; font-size:15px; line-height:1.55;
  padding-bottom:40px; overflow-x:hidden;
  /* 刘海屏 / iPad 圆角安全区 */
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
/* 触屏设备：去掉双击缩放的 300ms 延迟 */
button,.btn,.opt,.task-card,.daybar button,.tabs button,.hero-card,.wchip,.rank{
  touch-action:manipulation;
}
.btn,.tabs button,.daybar button,.opt{
  -webkit-user-select:none; user-select:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;}
button{border:none;background:none;cursor:pointer;}
h1,h2,h3,h4{margin:0;font-weight:700;}

/* ============ 顶栏 ============ */
.app{max-width:1020px;margin:0 auto;padding:14px 14px 0;}
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(255,253,248,.86);backdrop-filter:blur(12px);
  border-radius:var(--r-lg);padding:12px 16px;box-shadow:var(--sh);
  border:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:190px;}
.seal-logo{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(140deg,#C0392B,#96302A);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:-1px;
  line-height:1;padding-top:2px;box-shadow:0 3px 9px rgba(150,50,40,.34);
}
.brand h1{font-family:var(--serif);font-size:20px;letter-spacing:3px;font-weight:700;}
.brand .sub{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;letter-spacing:.3px;}
.wallet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.coin{
  display:flex;align-items:center;gap:5px;background:#fff;border-radius:var(--r-sm);
  padding:6px 12px;box-shadow:var(--sh);font-weight:700;font-size:13.5px;
  border:1px solid var(--line);
}
.coin span{font-size:14px;}
.coin b{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:15px;}
.coin.mg b{color:var(--gold);}
.coin.lg b{color:var(--zhu);}
.btn{
  border-radius:var(--r-sm);padding:9px 16px;font-weight:700;font-size:13.5px;min-height:40px;
  background:linear-gradient(140deg,#C6473D,#A8332C);color:#fff;
  box-shadow:0 3px 11px rgba(160,50,40,.3);transition:.15s;
  display:inline-flex;align-items:center;gap:5px;justify-content:center;
}
.btn:active{transform:scale(.96);}
.btn.ghost{background:#fff;color:var(--ink-2);box-shadow:var(--sh);border:1px solid var(--line);}
.btn.jade{background:linear-gradient(140deg,#4A9E80,#37795F);box-shadow:0 3px 11px rgba(60,130,100,.3);}
.btn.gold{background:linear-gradient(140deg,#D0A63A,#B08A1E);box-shadow:0 3px 11px rgba(180,140,40,.34);color:#fff;}
.btn.danger{background:#FDF0EE;color:#A83A32;box-shadow:none;border:1px solid #F2D8D3;}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:32px;}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;}

/* ============ 标签页 ============ */
.tabs{
  display:flex;gap:4px;margin:12px 0;background:rgba(255,253,248,.78);
  border-radius:var(--r-md);padding:5px;box-shadow:var(--sh);border:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{
  flex:1;min-width:58px;border-radius:var(--r-sm);padding:10px 8px;font-weight:700;font-size:13.5px;
  color:var(--ink-3);transition:.18s;white-space:nowrap;
}
.tabs button.active{background:var(--ink);color:#FBF6EC;box-shadow:0 3px 10px rgba(46,42,38,.26);}

/* ============ 卡片 ============ */
.card{
  background:var(--card);border-radius:var(--r-lg);padding:16px;
  box-shadow:var(--sh);margin-bottom:13px;border:1px solid var(--line);
}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.card-head h3{font-size:15px;flex:1;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-head h3::before{content:"";display:inline-block;width:3px;height:14px;background:var(--zhu);border-radius:2px;flex-shrink:0;}
.card-head .hint{font-size:12px;color:var(--ink-3);font-weight:600;}

/* ============ 7天选择栏 ============ */
.daybar{display:flex;gap:6px;margin-bottom:13px;}
.daybar button{
  flex:1;background:rgba(255,253,248,.92);border-radius:var(--r-md);padding:9px 3px;
  box-shadow:var(--sh);transition:.18s;border:1.5px solid var(--line);position:relative;
}
.daybar button .dw{font-size:11px;color:var(--ink-3);font-weight:700;}
.daybar button .dd{font-size:16px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums;font-family:var(--serif);}
.daybar button .mark{font-size:11px;height:14px;line-height:14px;}
.daybar button.active{background:var(--ink);border-color:var(--ink);}
.daybar button.active .dw,.daybar button.active .dd{color:#FBF6EC;}
.daybar button.today{border-color:var(--zhu-2);}
.daybar button.future{opacity:.5;}

/* ============ 任务卡 ============ */
.task-card{
  display:flex;align-items:center;gap:11px;background:#FDFBF6;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:9px;border:1px solid var(--line);transition:.16s;
  cursor:pointer;position:relative;overflow:hidden;
}
.task-card:active{transform:scale(.988);}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,#ddd);}
.task-card.s-cn{--sc:var(--c-cn);} .task-card.s-math{--sc:var(--c-math);}
.task-card.s-en{--sc:var(--c-en);} .task-card.s-other{--sc:var(--c-other);}
.task-card.done{background:#F6FBF7;border-color:#DBEBE2;}
.task-card.done .tc-title{text-decoration:line-through;text-decoration-color:#A8CFBB;text-decoration-thickness:1.5px;color:#7C9E8C;}
.task-card.boss{background:linear-gradient(100deg,#FEF6F4,#FDFAF4);border-color:#EFD9D1;}
.tc-emoji{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
.tc-body{flex:1;min-width:0;}
.tc-title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tc-title .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px;background:#F4EFE4;color:var(--ink-2);}
.tc-title .tag.boss{background:#FBE7E3;color:#A83A32;}
.tc-meta{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;}
.tc-meta .rem{color:var(--zhu);font-weight:700;}
.tc-right{flex-shrink:0;text-align:right;}
.star-badge{
  display:inline-flex;align-items:center;gap:3px;background:#FBEED0;
  color:#8A6710;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:var(--r-sm);
  border:1px solid #F0DCA6;
}
.star-badge.half{background:#EEF3F8;color:#4A6488;border-color:#D5E0EC;}
.star-badge.poor{background:#FBF0E4;color:#A06A2C;border-color:#EFDDC4;}
.star-badge.zero{background:#F7F3EC;color:#B5AC9E;border:none;}
.star-badge.boss-win{background:#FBE3E0;color:#A8342C;border-color:#F0C9C4;}
.dot-empty{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px dashed #DCD2BE;}

/* ============ 进度条 ============ */
.prog{height:9px;border-radius:999px;background:#F1EADB;overflow:hidden;}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--zhu-2),var(--zhu));transition:width .5s cubic-bezier(.3,1.3,.5,1);}
.prog.mini{height:6px;}

/* ============ 剧情卡（卷轴） ============ */
.story-card{
  background:linear-gradient(140deg,#4A3E33,#6B5844 55%,#8A7057);
  color:#FBF3E4;border-radius:var(--r-lg);padding:16px 17px;
  box-shadow:var(--sh-lg);margin-bottom:13px;position:relative;overflow:hidden;
}
.story-card::after{
  content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,240,210,.06);
}
.story-card .sc-top{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.5px;}
.story-card .sc-no{
  font-family:var(--serif);font-size:13px;letter-spacing:2px;opacity:.9;
  margin:9px 0 3px;color:#E8C98E;
}
.story-card .sc-title{
  font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.5;
  letter-spacing:1px;margin-bottom:12px;
}
.story-card .sc-bar{height:6px;border-radius:999px;background:rgba(255,240,210,.2);overflow:hidden;}
.story-card .sc-bar i{display:block;height:100%;background:linear-gradient(90deg,#E8C98E,#C9A227);border-radius:999px;transition:width .6s;}
.story-card .sc-foot{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.82;margin-top:7px;}
.story-card .chap-no{
  position:absolute;right:15px;top:13px;font-family:var(--serif);
  font-size:34px;opacity:.16;font-weight:700;
}

/* ============ 四军营地 ============ */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;}
.zone{background:#FDFBF6;border-radius:var(--r-md);padding:11px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);}
.zone .zt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;}
.zone .zt .zz{flex:1;}
.zone .zv{font-size:10.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.zone .zbar{height:7px;border-radius:999px;background:#F1EADB;overflow:hidden;}
.zone .zbar i{display:block;height:100%;border-radius:999px;transition:width .5s;}

/* ============ 破敌（BOSS） ============ */
.boss-card{
  background:linear-gradient(140deg,#33291F,#4C3A2B);color:#FBF3E4;
  border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-lg);margin-bottom:13px;position:relative;overflow:hidden;
}
.boss-card.beaten{background:linear-gradient(140deg,#25382F,#33513F);}
.boss-top{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.boss-face{font-size:34px;line-height:1;flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
.boss-face.dead{filter:grayscale(1) brightness(.65);}
.boss-info{flex:1;min-width:0;}
.boss-name{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1.5px;}
.boss-place{font-size:11px;color:#E8C98E;font-weight:600;letter-spacing:1px;margin-top:1px;}
.boss-sub{font-size:11.5px;opacity:.76;font-weight:600;margin-top:4px;line-height:1.5;}
.hp-wrap{height:16px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden;position:relative;border:1px solid rgba(255,240,210,.18);}
.hp-wrap i{display:block;height:100%;background:linear-gradient(90deg,#C6473D,#E0993F);transition:width .6s cubic-bezier(.3,1.3,.5,1);}
.hp-wrap b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.55);}
.boss-foot{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap;}

/* ============ 一周网格 ============ */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
@media(max-width:760px){ .wgrid{min-width:620px;} }
.wcol{background:#FDFBF6;border-radius:var(--r-md);padding:8px 6px;min-height:150px;border:1px solid var(--line);}
.wcol .wh{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.wcol.today{background:#FDF6F4;border-color:#EFCFC9;}
.wchip{font-size:10.5px;font-weight:600;border-radius:5px;padding:4px 5px;margin-bottom:4px;line-height:1.35;word-break:break-word;overflow-wrap:anywhere;border-left:3px solid var(--sc,#ccc);background:#fff;cursor:pointer;}
.wchip.done{background:#F3FAF6;color:#5C8F76;}
.wchip .lc{font-size:9.5px;opacity:.75;}
.wrest{text-align:center;font-size:11px;color:var(--ink-3);padding:14px 0;font-weight:600;}

/* ============ 数据页 ============ */
.stage-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.stage-svg{width:190px;height:195px;flex-shrink:0;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;}
.stat{background:#FDFBF6;border-radius:var(--r-md);padding:11px;text-align:center;border:1px solid var(--line);}
.stat .sv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif);}
.stat .sl{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px;}
.barcmp{display:flex;flex-direction:column;gap:9px;}
.barcmp .row{display:flex;align-items:center;gap:9px;font-size:12px;}
.barcmp .row .nm{width:92px;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barcmp .row .bars{flex:1;display:flex;flex-direction:column;gap:3px;}
.barcmp .row .b1,.barcmp .row .b2{height:8px;border-radius:999px;}
.barcmp .row .b1{background:#CFE0EE;}
.barcmp .row .b2{background:var(--zhu-2);}
.barcmp .row .vv{width:74px;text-align:right;font-size:11px;color:var(--ink-3);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums;}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:9px;}
.legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:4px;vertical-align:middle;}

/* ============ 徽章 ============ */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;}
.badge{background:#FDFBF6;border-radius:var(--r-md);padding:11px 6px;text-align:center;opacity:.38;filter:grayscale(.9);transition:.25s;border:1px solid var(--line);}
.badge.on{opacity:1;filter:none;background:linear-gradient(150deg,#FDF6E4,#F8EDD2);border-color:#EEDCB4;}
.badge .bi{font-size:23px;}
.badge .bn{font-size:10.5px;font-weight:700;margin-top:4px;line-height:1.3;}
.badge .bd{font-size:9.5px;color:var(--ink-3);font-weight:600;margin-top:2px;line-height:1.35;}

/* 官职轨 */
.ranktrack{display:flex;gap:5px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
.ranktrack::-webkit-scrollbar{display:none;}
.rank{flex-shrink:0;text-align:center;padding:9px 12px;border-radius:var(--r-md);background:#FDFBF6;min-width:80px;transition:.2s;border:1px solid var(--line);}
.rank.on{background:linear-gradient(150deg,#FDF4E2,#F7E9CC);border-color:#EBD8AC;}
.rank .re{font-size:20px;}
.rank .rn{font-size:10.5px;font-weight:700;margin-top:3px;font-family:var(--serif);}
.rank .rs{font-size:9.5px;color:var(--ink-3);font-weight:600;}

/* ============ 武将图鉴 ============ */
.hero-tier-title{
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  color:var(--ink-2);margin:14px 0 9px;letter-spacing:.5px;
}
.hero-tier-title .cnt{font-weight:600;color:var(--ink-3);font-size:11.5px;}
.hero-tier-title::after{content:"";flex:1;height:1px;background:var(--line);}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;}
.hero-card{
  border-radius:var(--r-md);padding:10px 5px 9px;text-align:center;position:relative;
  border:1px solid var(--line);background:#FDFBF6;transition:.2s;cursor:pointer;
}
.hero-card.locked{opacity:.42;filter:grayscale(1);cursor:default;background:#FAF6EE;}
.hero-card .he{font-size:25px;line-height:1.1;}
.hero-card .hn{font-size:12px;font-weight:700;margin-top:4px;font-family:var(--serif);letter-spacing:1px;}
.hero-card .hd{font-size:9.5px;color:var(--ink-3);font-weight:600;margin-top:2px;line-height:1.35;min-height:26px;padding:0 2px;}
.hero-card.t-legend{background:linear-gradient(155deg,#FDF3D6,#F8E5B0);border-color:#E8CE8E;}
.hero-card.t-rare{background:linear-gradient(155deg,#F3F1FA,#E7E3F3);border-color:#D6CFE8;}
.hero-card.t-common{background:#FDFBF6;}
/* 重复抽到的成长：星级。1 张时不显示，2 张起亮星，满 5 张换金边 */
.hero-card .tag-stars{position:absolute;top:6px;left:5px;font-size:8.5px;font-weight:800;
  color:#C9922B;letter-spacing:0;line-height:1;text-shadow:0 0 3px rgba(255,235,180,.9);}
.hero-card.locked .tag-stars{display:none;}
.hero-card.maxed{border-color:#D9A93C;box-shadow:inset 0 0 0 1px #E8CE8E, 0 2px 10px rgba(200,160,60,.22);}
.hero-card.met{border-style:dashed;background:#FBF8F1;}
/* 阵营纹章：姓氏大字 + 阵营色。替代原来重复率极高的 emoji */
.hero-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:0;line-height:1;margin:1px auto 4px;}
.hero-badge.b-han{background:#E7E2F1;color:#4B3F70;}
.hero-badge.b-wei{background:#DAE6F3;color:#2E4E6E;}
.hero-badge.b-shu{background:#F7E7C9;color:#7A5610;}
.hero-badge.b-wu {background:#DDEAE0;color:#396B14;}
.hero-badge.b-locked{background:#EFEBE0;color:#B4AE9C;}
.hero-card .tag-r{
  position:absolute;top:5px;right:5px;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:3px;letter-spacing:.5px;
}
.hero-card.t-legend .tag-r{background:#D9A93C;color:#fff;}
.hero-card.t-rare .tag-r{background:#8A7CB8;color:#fff;}
.hero-card.t-common .tag-r{background:#D9D2C2;color:#fff;}

/* ============ 抽卡结果 ============ */
.draw-stage{text-align:center;padding:12px 0 6px;}
.draw-roll{font-size:76px;display:inline-block;animation:shake .5s ease-in-out infinite;}
@keyframes shake{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
.draw-roll.opened{animation:none;transform:scale(1.28);}
.result-box{border-radius:var(--r-lg);padding:20px 16px;text-align:center;margin-top:10px;animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
.result-box .re{font-size:54px;line-height:1;}
.result-box .rn{font-size:19px;font-weight:700;margin-top:8px;font-family:var(--serif);letter-spacing:2px;}
.result-box .rt{font-size:12px;font-weight:600;margin-top:5px;opacity:.85;}
.result-box .rc{font-size:13px;font-weight:700;margin-top:10px;background:rgba(255,255,255,.62);border-radius:var(--r-sm);padding:6px 14px;display:inline-block;border:1px solid rgba(255,255,255,.5);}
.t-normal{background:linear-gradient(150deg,#F5F1E6,#EBE4D3);color:#5C5343;}
.t-rare{background:linear-gradient(150deg,#F1EEF9,#E2DCEF);color:#5A4B84;}
.t-legend{background:linear-gradient(150deg,#FDF1CC,#F5DF95);color:#7A5610;box-shadow:0 8px 24px rgba(200,160,60,.34);}

/* ============ 军报 ============ */
.report-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-bottom:13px;}
.rs-box{background:linear-gradient(150deg,#FBF7EE,#F5EFE1);border-radius:var(--r-md);padding:11px 8px;text-align:center;border:1px solid var(--line);}
.rs-box .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif);}
.rs-box .l{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-top:2px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px;}
textarea,input[type=text],input[type=number],select{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;
  background:#FDFBF6;font-size:13.5px;font-weight:600;transition:.15s;resize:vertical;
}
textarea:focus,input:focus,select:focus{border-color:#D3BFA0;background:#fff;box-shadow:0 0 0 3px rgba(190,160,110,.13);}
textarea{min-height:66px;line-height:1.6;}
.weeknav{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.weeknav .wk{flex:1;text-align:center;font-weight:700;font-size:14px;font-family:var(--serif);letter-spacing:1px;}
.hist-item{background:#FDFBF6;border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px;font-size:12.5px;border:1px solid var(--line);}
.hist-item .hh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px;}
.hist-item .hl{color:var(--ink-2);font-weight:600;margin-bottom:3px;line-height:1.55;}

/* ============ 设置 ============ */
.setrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line-2);}
.setrow:last-child{border-bottom:none;}
.setrow .si{font-size:17px;width:24px;text-align:center;flex-shrink:0;}
.setrow .sn{flex:1;font-size:13.5px;font-weight:700;min-width:0;line-height:1.45;}
.setrow .sn small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.chipsel{display:flex;gap:5px;flex-wrap:wrap;}
.chipsel button{
  border-radius:var(--r-sm);padding:7px 13px;font-size:12.5px;font-weight:700;
  background:#F7F2E7;color:var(--ink-3);border:1px solid var(--line);min-height:34px;transition:.15s;
}
.chipsel button.on{background:var(--ink);color:#FBF6EC;border-color:var(--ink);}
.prize-row{display:flex;align-items:center;gap:9px;background:#FDFBF6;border-radius:var(--r-md);padding:9px 12px;margin-bottom:7px;border:1px solid var(--line);}
.prize-row .pe{font-size:19px;}
.prize-row .pn{flex:1;font-size:13px;font-weight:700;line-height:1.4;min-width:0;}
.prize-row .pn small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:1px;}
.prize-row .pc{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap;}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;background:rgba(46,38,28,.46);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s;}
@media(min-width:640px){.mask{align-items:center;padding:20px;}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:480px;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:slideup .26s cubic-bezier(.2,1.1,.4,1);box-shadow:0 -8px 34px rgba(60,45,25,.28);
  border:1px solid var(--line);
}
@media(min-width:640px){.sheet{border-radius:var(--r-lg);animation:pop .24s cubic-bezier(.2,1.2,.4,1);}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.sheet h3{font-size:17px;margin-bottom:4px;font-family:var(--serif);letter-spacing:1px;}
.sheet .sh-sub{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:14px;line-height:1.55;}
.opt{
  display:flex;align-items:center;gap:11px;background:#FDFBF6;border-radius:var(--r-md);
  padding:13px;margin-bottom:9px;border:1px solid var(--line);transition:.15s;width:100%;text-align:left;min-height:56px;
}
.opt:active{transform:scale(.98);}
.opt.sel{border-color:#D3BFA0;background:#FCF7EE;box-shadow:0 0 0 2px rgba(190,160,110,.15);}
.opt .oe{font-size:23px;flex-shrink:0;}
.opt .ob{flex:1;min-width:0;}
.opt .ot{font-weight:700;font-size:14.5px;}
.opt .od{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;line-height:1.5;}
.opt .os{font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0;}

/* ============ 撒花（喜庆红金） ============ */
.confetti{position:fixed;top:-14px;width:9px;height:13px;z-index:900;pointer-events:none;border-radius:1px;animation:fall 2.7s linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}

/* ============ 提示 ============ */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:1000;
  background:rgba(46,38,28,.94);color:#FBF3E4;padding:11px 22px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.28);
  animation:tin .25s;max-width:86vw;text-align:center;line-height:1.5;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============ 其他 ============ */
.empty{text-align:center;padding:26px 14px;color:var(--ink-3);font-weight:600;font-size:13px;line-height:1.75;}
.empty .ee{font-size:34px;display:block;margin-bottom:8px;opacity:.7;}
.holiday-row{display:flex;align-items:center;gap:8px;background:#F5FAF6;border-radius:var(--r-md);padding:9px 12px;margin-bottom:7px;font-size:12.5px;font-weight:600;color:#4A8065;border:1px solid #DDEDE2;}
.footnote{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600;padding:16px 0 8px;line-height:1.8;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.scroll-x{overflow-x:auto;scrollbar-width:none;}
.scroll-x::-webkit-scrollbar{display:none;}
.quote{
  font-family:var(--serif);font-size:12.5px;color:var(--ink-2);line-height:1.8;
  background:#FAF5EA;border-left:3px solid #E0D2B6;border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:9px 12px;letter-spacing:.5px;
}
/* ============ 孩子的口子 ============ */
.addrow{
  width:100%;border:1.5px dashed var(--line);border-radius:var(--r-md);
  padding:12px;margin-top:9px;font-size:13px;font-weight:700;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;background:transparent;
}
.addrow:active{transform:scale(.985);border-color:#D3BFA0;color:var(--ink-2);}
.wishbtn{
  border:none;background:transparent;font-size:17px;line-height:1;
  padding:4px 6px;border-radius:var(--r-sm);flex-shrink:0;
}
.wishbtn.on{background:#FBE7E3;}

/* ============ 兑现台 ============ */
.coupon{
  display:flex;align-items:center;gap:11px;background:#FDFBF6;border:1px solid var(--line);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px;position:relative;overflow:hidden;
}
.coupon.overdue{background:#FDF4F2;border-color:#EFCFC9;}
.coupon.done{opacity:.5;background:#F7FBF8;border-color:#DBEBE2;}
.coupon .no{
  position:absolute;right:9px;top:6px;font-size:9.5px;font-weight:700;
  color:var(--ink-3);letter-spacing:.5px;font-family:var(--serif);
}
.coupon .ce{font-size:23px;flex-shrink:0;}
.coupon .cb{flex:1;min-width:0;}
.coupon .ct{font-size:13.5px;font-weight:700;}
.coupon .cd{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:3px;line-height:1.5;}
.coupon .cd .late{color:var(--zhu);font-weight:700;}
.ratebar{display:flex;align-items:center;gap:12px;background:#FAF5EA;border-radius:var(--r-md);padding:11px 13px;margin-bottom:12px;}
.ratebar .rv{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1;flex-shrink:0;}
.ratebar .rt{flex:1;font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.65;}

/* ============ 调整建议 ============ */
.hintcard{
  display:flex;gap:11px;background:#FDFBF6;border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 13px;margin-bottom:9px;
}
.hintcard.warn{background:#FDF7EC;border-color:#EEDFC0;}
.hintcard.info{background:#F3F7FA;border-color:#DCE6EE;}
.hintcard .hi{font-size:20px;flex-shrink:0;line-height:1.3;}
.hintcard .hb{flex:1;min-width:0;}
.hintcard .ht{font-size:13px;font-weight:700;line-height:1.45;}
.hintcard .hd{font-size:11.5px;color:var(--ink-2);font-weight:600;line-height:1.7;margin-top:4px;}
.hintcard .ha{margin-top:9px;}

/* ============ 主动性 ============ */
.actlist{display:flex;flex-direction:column;gap:7px;}
.actrow{display:flex;align-items:center;gap:9px;background:#F6FBF7;border:1px solid #DBEBE2;border-radius:var(--r-md);padding:9px 12px;font-size:12.5px;font-weight:600;}
.actrow .ae{font-size:16px;flex-shrink:0;}
.actrow .an{flex:1;min-width:0;}
.actrow .ad{font-size:11px;color:var(--ink-3);font-weight:600;flex-shrink:0;}

/* ============ 休整期 ============ */
.breakrow{display:flex;align-items:center;gap:9px;background:#FDFBF6;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:7px;}
.breakrow.on{background:#F3F7F4;border-color:#D5E5D9;}
.breakrow .bn{flex:1;font-size:13px;font-weight:700;line-height:1.45;min-width:0;}
.breakrow .bn small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px;}

/* ============ 版本号 ============ */
.verline{text-align:center;font-size:11px;color:var(--ink-3);font-weight:600;padding:4px 0 2px;letter-spacing:.5px;font-family:var(--serif);}

/* ============ 存储告警 ============ */
.storage-warn{
  display:none;background:linear-gradient(120deg,#FCEBE6,#F8DCD4);border:1px solid #EFC8BC;
  border-radius:var(--r-lg);padding:14px 16px;margin-bottom:13px;font-size:12.5px;
  font-weight:600;line-height:1.8;color:#8A3A32;
}
.storage-warn.show{display:block;}
.storage-warn b{display:block;font-size:14px;margin-bottom:4px;}

/* ============ 下一步提示条 ============ */
.nextbar{
  display:flex;align-items:center;gap:12px;border-radius:var(--r-lg);padding:13px 16px;
  margin-bottom:13px;box-shadow:var(--sh);border:1px solid var(--line);position:relative;overflow:hidden;
}
.nextbar.push{background:linear-gradient(120deg,#FDF4E4,#FBEBD2);border-color:#EFDCB6;}
.nextbar.hot{background:linear-gradient(120deg,#FCEBE6,#F8DCD4);border-color:#EFC8BC;}
.nextbar.calm{background:linear-gradient(120deg,#F3F7F4,#E9F1EB);border-color:#D5E5D9;}
.nextbar .ni{font-size:30px;flex-shrink:0;line-height:1;}
.nextbar .nt{flex:1;min-width:0;}
.nextbar .n1{font-size:15px;font-weight:700;letter-spacing:.3px;}
.nextbar .n2{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:3px;line-height:1.5;}
.nextbar .nstreak{
  font-size:11.5px;font-weight:700;color:#fff;background:var(--zhu);
  border-radius:var(--r-sm);padding:5px 9px;flex-shrink:0;white-space:nowrap;
}

/* ============ 点卯飘字 ============ */
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,6px) scale(.7);}
  22%{opacity:1;transform:translate(-50%,-10px) scale(1.15);}
  70%{opacity:1;transform:translate(-50%,-34px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-58px) scale(.9);}
}
.float-up{
  position:fixed;z-index:860;pointer-events:none;font-weight:700;font-size:20px;
  color:var(--zhu);text-shadow:0 2px 8px rgba(255,248,235,.95),0 0 2px #fff;
  animation:floatUp 1.15s cubic-bezier(.2,.9,.3,1) forwards;
}
.float-up.gold{color:#B8912A;}

/* ============ 保底进度 ============ */
.pity{margin-top:12px;}
.pity .pt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;}
.pity .pt .pl{color:var(--zhu);}

/* ============ 荣誉墙（已养成） ============ */
.honor{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;}
.honor-card{
  background:linear-gradient(155deg,#F6FBF7,#EAF5EE);border:1px solid #D3E7DB;
  border-radius:var(--r-md);padding:13px 10px;text-align:center;position:relative;
}
.honor-card .hc-badge{
  position:absolute;top:-7px;right:-5px;font-size:17px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.16));
}
.honor-card .he{font-size:26px;line-height:1.1;filter:grayscale(.15);}
.honor-card .hn{font-size:12.5px;font-weight:700;margin-top:5px;font-family:var(--serif);letter-spacing:1px;}
.honor-card .hd{font-size:10px;color:var(--ink-3);font-weight:600;margin-top:3px;line-height:1.4;}
.honor-card .hb{margin-top:8px;}
.ceremony-hero{text-align:center;padding:6px 0 2px;}
.ceremony-hero .ce{font-size:62px;line-height:1;display:inline-block;}
.ceremony-hero .cn{
  font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:3px;margin-top:10px;
}

/* ============ 仪式卡 ============ */
.ritual-list{margin:14px 0 4px;}
.ritual-row{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-md);
  background:#FDFBF6;border:1px solid var(--line);margin-bottom:7px;font-size:13px;font-weight:600;
}
.ritual-row .re{font-size:17px;flex-shrink:0;}
.ritual-row .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ritual-row .rp{font-size:11.5px;color:var(--ink-3);flex-shrink:0;}

@media(max-width:520px){ .grid2{grid-template-columns:1fr;} .stage-svg{width:150px;height:155px;} .brand h1{font-size:18px;letter-spacing:2px;} .nextbar .ni{font-size:26px;} }

/* ============================================================
   触屏 / iPad 专项覆盖
   必须放在样式表最后 —— 这里的选择器和组件层同优先级，
   写在前面会被后面的 .btn{min-height:40px} 之类直接盖掉。
   ============================================================ */
@media (pointer:coarse){
  /* Apple 触控建议最小 44pt；小按钮给到 36 */
  .btn{min-height:44px;}
  .btn.sm{min-height:36px;padding:8px 13px;}
  .opt{min-height:60px;}
  .daybar button{padding:11px 3px;}
  .tabs button{padding:12px 8px;}
  /* iOS 对字号小于 16px 的输入框会自动放大整页，必须提到 16px */
  textarea,input[type=text],input[type=number],select{font-size:16px;}
  /* 手指点按给更明显的回馈 */
  .task-card:active{transform:scale(.982);}
  .btn:active{transform:scale(.94);}
  /* 列表项松一点，减少误触 */
  .task-card{padding:13px 13px;}
  .setrow{padding:12px 0;}
}
</style>

<body>
<div class="app">
  <div class="storage-warn" id="storageWarn">
    <b>⚠️ 这个浏览器把本地存储关掉了</b>
    用「文件」App 打开、或者地址栏是 <code>file://</code> 开头时，iPadOS 会禁止网页保存数据——
    点卯记录、军功、武将图鉴都存不下来，关掉页面就全部消失。<br>
    请改用 <b>网址</b> 打开（在 Safari 里打开链接后点「分享 → 添加到主屏幕」，就能全屏使用，和 App 一样）。
  </div>

        <h1>少年主公</h1>

      </div>

  <main id="main"></main>
  <div class="footnote">数据全部存在本机浏览器 · 换设备请到「设置」导出备份</div>
</div>

<script>
"use strict";
/* =====================================================================
   少年主公 · 学习军令台
   把学习任务翻译成治国安邦：点卯得军功，军功招名将，名将录图鉴
   ===================================================================== */

/* ---------------------- 常量 ---------------------- */
const KEY = "shaozhu_v1";
// 软件版本（显示给用户看，也用于命名 service worker 缓存）
const APP_VERSION = "2.1.2";
// 数据结构版本。每次往 ST 里加字段就 +1，并在 migrate() 里补一条升级规则。
const SCHEMA = 8;
// 最近几天（含今天）的账还没冻结，可以补录点卯。
// 更早的日子一经结算就只读 —— 否则改任务会一直改写历史。
const BACKFILL_DAYS = 3;

const SUBJECTS = {
  cn:    { name:"语文", icon:"📜", place:"军师营", color:"#3F8F72", role:"谋略出于见识" },
  math:  { name:"数学", icon:"🌾", place:"粮草营", color:"#C08A1E", role:"兵马未动，粮草先行" },
  en:    { name:"英语", icon:"🌏", place:"鸿胪寺", color:"#41639E", role:"出使四方，通译往来" },
  other: { name:"其他", icon:"🏹", place:"演武场", color:"#B4453C", role:"习武修身，各成一艺" }
};
const SUBJ_ORDER = ["cn","math","en","other"];

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const pad = n => String(n).padStart(2,"0");
const ds  = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = () => ds(new Date());
function parseD(s){ const a=String(s).split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return ds(d); }
function weekStart(s){ const d=parseD(s); const w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return ds(d); }
function weekDates(s){ const m=weekStart(s); return Array.from({length:7},(_,i)=>addD(m,i)); }
function fmtMD(s){ const d=parseD(s); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function round1(n){ return Math.round(n*10)/10; }
// 金额先转成有限数再运算，禁止字符串拼接、负金额与非数值进入余额。
function moneyNumber(v){
  if(typeof v!=="number" && !(typeof v==="string" && v.trim()!=="")) return NaN;
  const n=Number(v);
  return Number.isFinite(n) && n>=0 && n<=Number.MAX_SAFE_INTEGER/100 ? round1(n) : NaN;
}
function money(v){ const n=moneyNumber(v); return Number.isFinite(n)?n:0; }
function recordLevel(v){ const n=Number(v); return n===1?1:n===0.5?0.5:0; }
function validPrizeCost(v){ const n=moneyNumber(v); return Number.isFinite(n) && n>0; }
function normalizeMoneyState(s){
  const fix=(obj,key,optional)=>{
    if(obj[key]==null && optional){ obj[key]=0; return; }
    const n=moneyNumber(obj[key]);
    if(!Number.isFinite(n)) throw new Error("存档金额异常："+key+"。原数据已保留，请先导出备份核查");
    obj[key]=n;
  };
  fix(s,"bonusMerit",true); fix(s,"peakMerit",true);
  if(s.meritSrc) for(const k of ["dup","collect","migrate"]) fix(s.meritSrc,k,true);
  // 锦囊门槛坏了不能拖垮整个存档：标记后归零，既不扣费也不参与统计，
  // 孩子只会看到这一张「门槛异常」，而不是整个 App 打不开。
  for(const v of (s.vault||[])){
    const n=moneyNumber(v.merit);
    if(Number.isFinite(n) && n>0){ v.merit=n; delete v.meritInvalid; }
    else { v.meritInvalid=v.merit==null?"":String(v.merit); v.merit=0; }
    if(v.paidMerit!=null){
      const p=moneyNumber(v.paidMerit);
      v.paidMerit=Number.isFinite(p)?p:0;
    }
  }
  for(const d of Object.keys(s.ledger||{})) fix(s.ledger[d],"merit",true);
  if(s.draws!=null && (!Number.isSafeInteger(Number(s.draws)) || Number(s.draws)<0)) throw new Error("招贤令消费记录异常");
  s.draws=Number(s.draws)||0;
  return s;
}
function cnNum(n){
  const a=["零","一","二","三","四","五","六","七","八","九"];
  n = Math.floor(n);
  if(n<=0) return "零";
  if(n<10) return a[n];
  if(n<20) return "十"+(n>10?a[n-10]:"");
  if(n<100){
    const t=Math.floor(n/10), o=n%10;
    return a[t]+"十"+(o?a[o]:"");
  }
  if(n<1000){
    const h=Math.floor(n/100), rest=n%100;
    let s=a[h]+"百";
    if(rest===0) return s;
    if(rest<10) return s+"零"+a[rest];
    if(rest<20) return s+"一十"+(rest>10?a[rest-10]:"");
    const t2=Math.floor(rest/10), o2=rest%10;
    return s+a[t2]+"十"+(o2?a[o2]:"");
  }
  return String(n);
}

function toast(msg,ms){
  const old=$(".toast"); if(old) old.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),320); }, ms||2000);
}

function confetti(n){
  const colors=["#B93A32","#D4A03C","#C9A227","#4A9E80","#8A5A3C","#E0C070"];
  for(let i=0;i<(n||70);i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.style.left=(Math.random()*100)+"vw";
    el.style.background=colors[i%colors.length];
    el.style.animationDelay=(Math.random()*0.7)+"s";
    el.style.width=(6+Math.random()*6)+"px";
    el.style.height=(9+Math.random()*8)+"px";
    if(Math.random()>.65) el.style.borderRadius="50%";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3600);
  }
}

};
function festivalOf(dateStr){
  const d=parseD(dateStr), m=d.getMonth()+1, day=d.getDate();
  for(const k of LUNAR.spring)    if(dateStr>=addD(k,-4) && dateStr<=addD(k,6)) return "spring";
  for(const k of LUNAR.dragon)    if(dateStr>=addD(k,-1) && dateStr<=addD(k,2)) return "dragon";
  for(const k of LUNAR.midautumn) if(dateStr>=addD(k,-1) && dateStr<=addD(k,2)) return "midautumn";
  if(m===10 && day>=1 && day<=7) return "national";
  if(m===6  && day===1)          return "kids";
  return null;
}

// 按 schema 版本逐级升级老数据。以后加字段，只在这里补一条规则。
function migrate(s){
  if(!s || typeof s!=="object") return s;
  if(typeof s.schema!=="number") s.schema = 1;   // 1.5.0 之前的数据没有这个字段
  // 必须在迁移读取字段之前补齐；导入和启动走同一条链。
  if(!s.heroes || typeof s.heroes!=="object") s.heroes={};
  if(!s.heroCount || typeof s.heroCount!=="object") s.heroCount={};
  if(!s.story || typeof s.story!=="object") s.story=defaultState().story;
  if(!Array.isArray(s.vault)) s.vault=[];
  if(!s.ledger || typeof s.ledger!=="object") s.ledger={};
  normalizeMoneyState(s);

  if(s.schema < 2){
    // v1 → v2：新增兑现台、休整期、自愿开工、主动性记录
    if(!Array.isArray(s.coupons)) s.coupons=[];
    if(!Array.isArray(s.breaks)) s.breaks=[];
    if(!s.extraDays || typeof s.extraDays!=="object") s.extraDays={};
    if(!Array.isArray(s.signals)) s.signals=[];
    s.schema = 2;
  }
  if(s.schema < 3){
    // v2 → v3：引入补录窗口。把还落在窗口里的日子从账本里放开，
    // 让「昨天忘了点卯」当场就能补，而更早的历史照旧冻着。
    const floor = addD(TODAY(), -(BACKFILL_DAYS-1));
    if(s.ledger && typeof s.ledger==="object"){
      for(const d in s.ledger){ if(d >= floor) delete s.ledger[d]; }
    }
    s.schema = 3;
  }
  if(s.schema < 4){
    // v3 → v4：武将库从 36 位换成「怀沙实体卡」160 位。
    // 其中 27 位旧武将保留；另外 9 位（黄忠、姜维、魏延、庞统、张苞、马岱、王平、马良、严颜）
    // 实体卡里没有，若已招募则折算成军功补偿 —— 不让孩子的收集凭空消失。
    const removed=["黄忠","姜维","魏延","庞统","张苞","马岱","王平","马良","严颜"];
    const gone = removed.filter(n=>!!s.heroes[n]);
    if(gone.length){
      addMerit(s, gone.length * REMOVED_HERO_MERIT, "migrate", "migrate:heroes160", gone.join("、"));
      for(const n of gone) delete s.heroes[n];
      for(const n of gone) delete s.heroCount[n];
      s.heroMigrateNote = gone.length + " 位旧武将不在新图鉴里（" + gone.join("、") + "），已各补 ⭐" + REMOVED_HERO_MERIT + " 军功";
    }
    s.schema = 4;
  }
  if(s.schema < 5){
    // v4 → v5：主线书目固定为《三国演义》，不再支持换书。
    // 之前若家长选过别的书，这里归位（故事是装饰性的，不影响任何记录）。
    if(s.story.book !== SANGUO_BOOK_NAME
       || !Array.isArray(s.story.chapters)
       || s.story.chapters.length !== SANGUO.length){
      s.story.book = SANGUO_BOOK_NAME;
      s.story.chapters = SANGUO.slice();
    }
    s.schema = 5;
  }
  if(s.schema < 6){
    // v5 → v6：剧情从「按周自动推进」改成「靠努力推进」。
    // 把旧系统已经推进到的回数折算成「已攒全勤天数」，不让进度倒退。
    const total = Array.isArray(s.story.chapters) ? s.story.chapters.length : 0;
    let oldChap = 0;
    if(s.story.startWeek && total){
      const wk = Math.max(0, Math.floor((parseD(weekStart(TODAY())) - parseD(s.story.startWeek)) / 604800000));
      oldChap = wk % total;
    }
    s.story.baseDays = oldChap * CHAPTER_PER_DONE_DAYS;
    s.story.startDay = TODAY();
    delete s.story.startWeek;
    s.schema = 6;
  }
  if(s.schema < 7){
    // v6 → v7：新增集齐奖励。升级前就已经集满的阵营/全套在这里补记，
    // 不弹提示（迁移时连弹好几条会让人以为出错了）。
    checkCollection(s);
    s.schema = 7;
  }
  if(s.schema < 8){
    // v7 → v8：只补流水和实付快照，历史余额保持原值，不臆造旧流水。
    if(!Array.isArray(s.meritEvents)) s.meritEvents=[];
    for(const v of s.vault) if(v.redeemed && v.paidMerit==null) v.paidMerit=money(v.merit);
    s.schema=8;
  }
  if(!s.hintApplied || typeof s.hintApplied!=="object") s.hintApplied={};
  if(!Array.isArray(s.meritEvents)) s.meritEvents=[];

  // 无论版本，这些字段的类型兜底都要保证
  if(!s.heroes || typeof s.heroes!=="object") s.heroes={};
  if(!s.heroCount || typeof s.heroCount!=="object") s.heroCount={};
  if(typeof s.bonusMerit!=="number") s.bonusMerit=0;
  if(!s.ledger || typeof s.ledger!=="object") s.ledger={};
  if(typeof s.peakMerit!=="number") s.peakMerit=0;
  if(!s.pity || typeof s.pity!=="object") s.pity={ sinceLegend:0 };
  if(typeof s.pity.sinceLegend!=="number") s.pity.sinceLegend=0;
  if(!s.graduated || typeof s.graduated!=="object") s.graduated={};
  if(typeof s.lastOpen!=="string") s.lastOpen="";
  if(!Array.isArray(s.tasks)||!s.tasks.length) s.tasks=defaultTasks();
  if(!Array.isArray(s.prizes)||!s.prizes.length) s.prizes=defaultPrizes();
  if(!Array.isArray(s.vault)) s.vault=[];
  if(!s.records || typeof s.records!=="object") s.records={};
  if(!s.bossDefeats || typeof s.bossDefeats!=="object") s.bossDefeats={};
  if(!s.reports || typeof s.reports!=="object") s.reports={};
  if(!s.achievements || typeof s.achievements!=="object") s.achievements={};
  if(!s.season || typeof s.season!=="object") s.season=defaultState().season;
  if(!s.story || typeof s.story!=="object") s.story=defaultState().story;
  if(!Array.isArray(s.story.chapters)||!s.story.chapters.length) s.story.chapters=SANGUO.slice();
  // 老数据里已经开掉的锦囊补一张「已兑现」的券，让兑现率算得准
  backfillCoupons(s);
  s.appVersion = APP_VERSION;
  return s;
}
let ST = null;
let STORAGE_LAST_RAW; // 最近一次读写的原文，防止旧窗口覆盖新账本
let LOAD_ERROR="";
// 持久化存储的申请结果："granted" / "denied" / "unsupported" / "unknown"
let STORAGE_PERSIST = "unknown";
// localStorage 在 file:// 协议下会被 WebKit 直接禁用（iPad/iPhone 尤其严格），
// 这时整个应用会变成「用完即忘」，必须明确告诉用户，不能让它悄悄失败。
function storageAvailable(){
  try{
    const k="__sz_probe__";
    localStorage.setItem(k,"1");
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function checkStorage(){
  const ok = storageAvailable();
  const w=$("#storageWarn");
  if(w) w.classList.toggle("show", !ok);
  return ok;
}
/* ---- 存储保护 ----
   iOS 上「添加到主屏幕」已经豁免了 Safari 的 7 天清理；
   安卓 / 鸿蒙上还要再申请一次「持久化存储」—— 否则磁盘紧张时浏览器可能自动回收。 */
function requestPersistentStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist){
      STORAGE_PERSIST="unsupported"; return Promise.resolve("unsupported");
    }
    var done = function(v){ STORAGE_PERSIST = v; return v; };
    return (navigator.storage.persisted
      ? navigator.storage.persisted().then(function(already){
          if(already) return done("granted");
          return navigator.storage.persist().then(function(ok){ return done(ok?"granted":"denied"); });
        })
      : navigator.storage.persist().then(function(ok){ return done(ok?"granted":"denied"); })
    ).catch(function(){ return done("unknown"); });
  }catch(e){ STORAGE_PERSIST="unknown"; return Promise.resolve("unknown"); }
}
function save(){
  try{
    const raw=JSON.stringify(ST);
    if(STORAGE_LAST_RAW!==undefined && localStorage.getItem(KEY)!==STORAGE_LAST_RAW) throw new Error("另一窗口已修改存档，请刷新后重试");
    localStorage.setItem(KEY, raw);
    STORAGE_LAST_RAW=raw;
    return true;
  }
  catch(e){
    const w=$("#storageWarn");
    if(w) w.classList.add("show");
    toast("数据没有保存，请勿继续操作："+(e.message||"本地存储不可用"),4200);
    return false;
  }
}
// 对抽卡和开启锦囊，保存成功才算完成；写入失败恢复操作前状态。
function commitEconomy(action){
  const before=JSON.stringify(ST);
  try{
    const result=action();
    if(save()) return result;
  }catch(e){ toast("本次操作未完成，星星未变："+e.message,4200); }
  ST=JSON.parse(before);
  return null;
}
function prepareState(o){
  if(!o || typeof o!=="object" || Array.isArray(o) || !Array.isArray(o.tasks)) throw new Error("存档格式不对");
  if(Number(o.schema)>SCHEMA) throw new Error("这是更新版本的存档，请先更新应用");
  const d=defaultState();
  const merged=Object.assign({},d,o);
  // 不能用默认的最新schema覆盖「没有schema」的老存档，否则升级规则全部被跳过。
  merged.schema=typeof o.schema==="number"?o.schema:1;
  merged.story=Object.assign({},d.story,o.story||{});
  merged.season=Object.assign({},d.season,o.season||{});
  return migrate(merged);
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    STORAGE_LAST_RAW=raw;
    LOAD_ERROR="";
    if(!raw) return null;
    const original=JSON.parse(raw), prepared=prepareState(original);
    // 升级前先保留旧原文。写不下（配额满）时只警告，绝不因此让 App 起不来。
    if(original.appVersion!==APP_VERSION || original.schema!==SCHEMA){
      try{ localStorage.setItem(KEY+"_before_upgrade",raw); }
      catch(e){ console.warn("升级前快照没存下（空间不足），继续使用新版本"); }
    }
    return prepared;
  }catch(e){ LOAD_ERROR=e.message||"存档无法读取"; return null; }
}

/* =====================================================================
   核心逻辑
   ===================================================================== */
function rec(dateStr,taskId){
  const day=ST.records[dateStr];
  return day ? day[taskId] : null;
}
function setRec(dateStr,taskId,level,type,minutes){
  if(!ST.records[dateStr]) ST.records[dateStr]={};
  if(level===null && type===null){
    delete ST.records[dateStr][taskId];
    if(!Object.keys(ST.records[dateStr]).length) delete ST.records[dateStr];
    return;
  }
  ST.records[dateStr][taskId]={ level:recordLevel(level), type:type||"miss", minutes:Math.max(0,Number(minutes)||0), at:Date.now() };
}
function weekDone(taskId,dateStr){
  let n=0;
  for(const d of weekDates(dateStr)){ const r=rec(d,taskId); if(r && r.level>=0.5) n++; }
  return n;
}
/* ---- 账目冻结与补录窗口 ----
   规则只有一条：最近 BACKFILL_DAYS 天（含今天）是「活的」，可以补录点卯；
   更早的日子一经结算就冻成石头，改任务、删军令都动不了它。 */
function backfillFloor(){ return addD(TODAY(), -(BACKFILL_DAYS-1)); }
function isFrozen(dateStr){ return dateStr < backfillFloor(); }
function canBackfill(dateStr){ return !isFrozen(dateStr) && dateStr <= TODAY(); }

/* ---- 休整期：生病、假期、考试周，工具要承认这些节律 ---- */
function activeBreak(dateStr){
  return (ST.breaks||[]).find(b => dateStr >= b.from && dateStr <= b.to) || null;
}
// 休整日 = 落在某个休整区间内，且孩子没有主动说「今天想做一点」
function isRestDay(dateStr){
  if((ST.extraDays||{})[dateStr]) return false;
  return !!activeBreak(dateStr);
}
function restReason(dateStr){
  const b=activeBreak(dateStr);
  return b ? (b.reason||"休整") : "";
}
// 休整期内孩子自愿开工
function markExtraDay(dateStr){
  if(!ST.extraDays) ST.extraDays={};
  ST.extraDays[dateStr]=true;
  logSignal("extra", "休整期里主动做了一天");
}

// 某天应当出现的军令
// 已经结算过的历史日子直接返回账本里冻结的快照，改任务不再影响它的样子
function tasksForDate(dateStr){
  const L=ST.ledger[dateStr];
  if(isFrozen(dateStr) && L && L.settled) return (L.tasks||[]).slice();
  if(isRestDay(dateStr)) return [];               // 休整日不派军令
  const dow=parseD(dateStr).getDay();
  const out=[];
  for(const t of ST.tasks){
    if(t.archived) continue;
    if(t.type==="daily"){ out.push(t); continue; }
    if(t.type==="fixed"){ if((t.weekdays||[]).includes(dow)) out.push(t); continue; }
    const r=rec(dateStr,t.id);
    if(r && r.type==="skip") continue;              // 挂了免战牌 → 顺延
    if(r && r.level>0){ out.push(t); continue; }
    const target=Math.max(1,t.weekTarget||1);
    if(weekDone(t.id,dateStr)>=target) continue;     // 本周已达成 → 撤下
    out.push(t);
  }
  return out;
}
function holidayTasks(dateStr){
  const L=ST.ledger[dateStr];
  if(isFrozen(dateStr) && L && L.settled) return [];   // 历史已冻结，不再补挂「休整」
  if(isRestDay(dateStr)) return [];
  return ST.tasks.filter(t=>{
    if(t.archived||t.type!=="flex") return false;
    if(rec(dateStr,t.id)) return false;
    return weekDone(t.id,dateStr) >= Math.max(1,t.weekTarget||1);
  });
}
function dayExpected(dateStr){ return tasksForDate(dateStr); }
function dayIsComplete(dateStr){
  const list=dayExpected(dateStr);
  if(!list.length) return false;
  return list.every(t=>{ const r=rec(dateStr,t.id); return r && r.level>=0.5; });
}
function dayRatio(dateStr){
  const list=dayExpected(dateStr);
  if(!list.length) return 1;
  const done=list.filter(t=>{ const r=rec(dateStr,t.id); return r && r.level>=0.5; }).length;
  return done/list.length;
}
function dayStars(dateStr){
  const day=ST.records[dateStr]; if(!day) return 0;
  let s=0; for(const k of Object.keys(day)) s+=recordLevel(day[k] && day[k].level); return round1(s);
}
function allDatesWithRecords(){
  const set=new Set(Object.keys(ST.records));
  set.add(TODAY());
  return Array.from(set).sort();
}
// 军功 = 已冻结的历史账本 + 今天的实时 + 重复名将折算
// 判断某天是否完成：已冻结的看账本，窗口内的实时算
function isCompleteOn(dateStr){
  const L=ST.ledger[dateStr];
  if(isFrozen(dateStr) && L && L.settled) return !!L.complete;
  return dayIsComplete(dateStr);
}

/* ---- 主线推进：靠努力换，不靠时间 ----
   累计「军令齐备」的天数（休整日跳过），全勤一天推进一回。
   只用累加，所以进度永远不会倒退。 */
const CHAPTER_PER_DONE_DAYS = 1;
function storyDoneDays(){
  const st = ST.story || {};
  let n = st.baseDays || 0;                       // 迁移时折算过来的旧进度
  const from = st.startDay || ST.createdAt || TODAY();
  let d = from, guard = 0;
  while(d <= TODAY() && guard++ < 4000){
    if(!isRestDay(d) && isCompleteOn(d)) n++;
    d = addD(d, 1);
  }
  return Math.max(0, n);
}
function storyChapterRaw(){ return Math.floor(storyDoneDays() / CHAPTER_PER_DONE_DAYS); }
// 再攒几天全勤能推进下一回
function storyNextIn(){
  const r = storyDoneDays() % CHAPTER_PER_DONE_DAYS;
  return CHAPTER_PER_DONE_DAYS - r;
}
// 从 dateStr 往前数，连续多少天军令齐备
// 休整日直接跳过：既不算一天，也不打断连击 —— 孩子病了三天回来，连击不该断
function streakEndingAt(dateStr){
  let n=0, d=dateStr, guard=0;
  while(guard++<1200){
    if(isRestDay(d)){ d=addD(d,-1); continue; }
    if(!isCompleteOn(d)) break;
    n++; d=addD(d,-1);
  }
  return n;
}
function streakMult(n){
  for(const t of STREAK_TIERS) if(n>=t.n) return t.m;
  return 1;
}
function streakName(n){
  for(const t of STREAK_TIERS) if(n>=t.n) return t.name;
  return "";
}
function currentStreak(){ return streakEndingAt(TODAY()); }

// 结算一天的账：把当天的应做清单、完成情况、所得军功、发放的招贤令固定下来
function buildDaySheet(dateStr){
  const rest = isRestDay(dateStr);
  const list=tasksForDate(dateStr);
  const total=list.length;
  const done=list.filter(t=>{ const r=rec(dateStr,t.id); return r && r.level>=0.5; }).length;
  const base=dayStars(dateStr);
  const st=total ? streakEndingAt(dateStr) : 0;
  const mult=total ? streakMult(st) : 1;
  const complete = total>0 && done>=total;
  return {
    // 存快照而不是 id：即使日后这项军令被改了名或删掉，历史照原样呈现
    tasks:list.map(t=>({
      id:t.id, name:t.name, emoji:t.emoji||"", subject:t.subject,
      type:t.type, boss:!!t.boss, planMin:t.planMin||0,
      timeSlot:t.timeSlot||"any", weekTarget:t.weekTarget||1
    })),
    done, total, complete, rest,
    base:round1(base), mult, merit:round1(base*mult), streak:st,
    ticket: complete?1:0, settled:true, at:Date.now()
  };
}
// 把所有「已经过了补录窗口、尚未结算」的日子按时间顺序冻结。结算后永不再重算。
// 注意：不能只遍历有打卡记录的日子 —— 那些「当天没打开、一个字没记」的日子
// 同样要冻结，否则它的应做清单还是实时的，改周目标仍会改写历史。
function settleLedger(){
  const cutoff=backfillFloor();          // 补录窗口内的日子留活口
  let start=cutoff;
  if(ST.createdAt && ST.createdAt<cutoff) start=ST.createdAt;
  for(const d of Object.keys(ST.records)) if(d<start) start=d;
  if(start>=cutoff) return false;
  let changed=false, d=start, guard=0;
  while(d<cutoff && guard++<4000){
    const L=ST.ledger[d];
    if(!(L && L.settled)){ ST.ledger[d]=buildDaySheet(d); changed=true; }
    d=addD(d,1);
  }
  return changed;
}
function ledgerMerit(){
  let s=0; for(const d of Object.keys(ST.ledger)) if(d<=TODAY() && ST.ledger[d].settled) s+=money(ST.ledger[d].merit);
  return round1(s);
}
// 某天的军功（冻结的走账本，窗口内的实时算，都含连击倍率）
function dayMerit(dateStr){
  const L=ST.ledger[dateStr];
  if(L && L.settled) return money(L.merit);
  return round1(dayStars(dateStr) * streakMult(streakEndingAt(dateStr)));
}
// 补录窗口里那些还没结算的日子，得实时算进来，不然刚补录的点卯不认账
function liveWindowDates(){
  const t=TODAY(), floor=backfillFloor();
  const set=new Set(Object.keys(ST.records));
  set.add(t);
  return Array.from(set).filter(d => d>=floor && d<=t && !(ST.ledger[d] && ST.ledger[d].settled));
}
function earnedMerit(){
  // 页面跨午夜一直开着时，也先结算刚离开补录窗口的那一天，不能让星星凭空消失。
  settleLedger();
  let s=ledgerMerit();
  for(const d of liveWindowDates()) s += dayMerit(d);
  return round1(s);
}
function totalMerit(){ return round1(earnedMerit() + money(ST.bonusMerit)); }
function spentMerit(){ return round1(ST.vault.filter(v=>v.redeemed).reduce((a,b)=>a+money(b.paidMerit==null?b.merit:b.paidMerit),0)); }
// 可用军功：不再用 Math.max(0,...) 把亏空悄悄吞掉
function availMerit(){ return round1(totalMerit()-spentMerit()); }
// 官职用历史最高军功，只升不降
function rankMerit(){
  const m=totalMerit();
  if(m > (ST.peakMerit||0)) ST.peakMerit=m;
  return Math.max(m, ST.peakMerit||0);
}

function ticketsEarned(){
  let n=0;
  const t=TODAY();
  settleLedger();
  for(const d of Object.keys(ST.ledger)){ if(d<=t && ST.ledger[d].settled) n += ST.ledger[d].ticket===1?1:0; }
  // 补录窗口里还没结算的日子实时算，别让刚补的点卯白点
  for(const d of liveWindowDates()) if(dayIsComplete(d)) n += 1;
  n += 2*Object.keys(ST.bossDefeats).length;
  return n;
}
function ticketsAvail(){ return Math.max(0, ticketsEarned()-ST.draws); }
function bossBeaten(dateStr){ return !!ST.bossDefeats[dateStr]; }

/* ---- 主动性记录 ----
   这套系统真正的成功指标不是完成率，是「孩子自己想做」。
   完成率可以靠推，主动推不出来，所以必须单独记一笔。 */

/* ---- 兑现台 ----
   军功换来的东西如果没人兑现，整套激励的信用就崩了。
   开锦囊时发一张券，家长点了「已兑现」才算闭环。 */
function couponFor(vaultItem){
  if(!Array.isArray(ST.coupons)) ST.coupons=[];

  };

  return c;
}
function couponDays(c){
  if(!c || !c.openedAt) return 0;
  return Math.max(0, Math.round((parseD(TODAY()) - parseD(c.openedAt))/86400000));
}
function couponsPending(){ return (ST.coupons||[]).filter(c=>c.status!=="done"); }
function couponsDone(){ return (ST.coupons||[]).filter(c=>c.status==="done"); }
function couponOverdue(days){ return couponsPending().filter(c=>couponDays(c) >= (days||7)); }
// 兑现率：给家长看的一面镜子
function couponRate(){
  const all=(ST.coupons||[]);
  if(!all.length) return null;
  return Math.round(all.filter(c=>c.status==="done").length / all.length * 100);
}
function settleCoupon(id, note){

// 有些锦囊在兑现台功能上线之前就已经开掉了，迁移时补一张「已兑现」的券，不然兑现率对不上
function backfillCoupons(s){
  s = s || ST;
  if(!Array.isArray(s.coupons)) s.coupons=[];
  const have=new Set(s.coupons.map(c=>c.name+"|"+c.openedAt));
  for(const v of (s.vault||[])){
    if(!v.redeemed) continue;
    const at=v.redeemedAt||v.gotAt||TODAY();
    if(have.has(v.name+"|"+at)) continue;
    s.coupons.push({ id:uid(), name:v.name, emoji:v.emoji||"🎁", tier:v.tier,
      merit:v.merit||0, openedAt:at, status:"done", doneAt:at, note:"", migrated:true });
    have.add(v.name+"|"+at);
  }
  return s;
}

/* ---- 难度下调建议 ----
   只有「推」没有「退」，孩子就会一直在失败里泡着。 */
function taskWeekStat(task, weekMonday){
  const days=weekDates(weekMonday);
  if(days[6] >= TODAY()) return null;              // 只有整周过去的才算
  if(isRestDay(days[0]) && days.every(isRestDay)) return null;  // 整周都在休整
  let target=0, done=0, full=0, half=0;
  if(task.type==="flex"){
    target=Math.max(1,task.weekTarget||1);
    for(const d of days){ const r=rec(d,task.id); if(r&&r.level>=0.5){ done++; if(r.type==="full") full++; else half++; } }
  }else{
    for(const d of days){
      if(isRestDay(d)) continue;
      const appear = task.type==="daily" || (task.weekdays||[]).includes(parseD(d).getDay());
      if(!appear) continue;
      target++;
      const r=rec(d,task.id);
      if(r&&r.level>=0.5){ done++; if(r.type==="full") full++; else half++; }
    }
  }
  if(!target) return null;
  return { pct:Math.min(1, done/target), target, done, full, half };
}
function difficultyHints(){
  const out=[];
  const thisMon=weekStart(TODAY());
  for(const t of ST.tasks){
    if(t.archived) continue;
    if(hintCooling(t.id)) continue;                 // 刚改过的先观察，别追着改
    const s1=taskWeekStat(t, addD(thisMon,-7));
    const s2=taskWeekStat(t, addD(thisMon,-14));
    const ps=[s1,s2].filter(Boolean);
    if(!ps.length) continue;
    const avg=ps.reduce((a,b)=>a+b.pct,0)/ps.length;
    const pctTxt=Math.round(avg*100)+"%";

    // 连续两周都做不完 → 任务本身有问题，不是孩子有问题
    if(avg < 0.4){
      if(t.type==="flex" && (t.weekTarget||1) > 1){
        out.push({ taskId:t.id, kind:"lower", tone:"warn",
          title:t.name+" 连续两周只有 "+pctTxt,
          body:"周目标可能定高了。降到 "+(t.weekTarget-1)+" 次试试，先把节奏跑起来。",
          action:"降到 "+(t.weekTarget-1)+" 次" });
      }else{
        out.push({ taskId:t.id, kind:"switch", tone:"warn",
          title:t.name+" 连续两周只有 "+pctTxt,
          body:"这项可能和当前的时间安排冲突。换个时间段，或者先暂停两周。",
          action:"先暂停这项" });
      }
      continue;
    }
    // 每次都做完，但大半是半星 → 在赶时间，不是不用心
    const halfAll=ps.reduce((a,b)=>a+b.half,0), doneAll=ps.reduce((a,b)=>a+b.done,0);
    if(avg >= 1 && doneAll >= 4 && halfAll/doneAll > 0.7){
      out.push({ taskId:t.id, kind:"retime", tone:"info",
        title:t.name+" 都做完了，但多半是苦战/惨胜",
        body:"说明是在赶时间。把计划用时从 "+t.planMin+" 分钟放宽一点，或者换个更从容的时间段。",
        action:"放宽到 "+(t.planMin+10)+" 分钟" });
    }
  }
  return out;
}
// 刚调整过就再提建议，会变成唠叨。给一个观察期。
const HINT_COOLDOWN_DAYS = 14;
function hintCooling(taskId){
  const at=(ST.hintApplied||{})[taskId];
  if(!at) return false;
  return Math.round((parseD(TODAY()) - parseD(at))/86400000) < HINT_COOLDOWN_DAYS;
}
function applyHint(taskId, kind){
  const t=ST.tasks.find(x=>x.id===taskId); if(!t) return;
  settleLedger();                       // 改配置前先冻结历史
  if(kind==="lower") t.weekTarget=Math.max(1,(t.weekTarget||1)-1);
  else if(kind==="retime") t.planMin=(t.planMin||15)+10;
  else if(kind==="switch") t.archived=true;
  if(!ST.hintApplied) ST.hintApplied={};
  ST.hintApplied[taskId]=TODAY();
  save(); render();
  toast("已调整：「"+t.name+"」按新节奏走，两周后如果还不合适再谈");
}

/* ---- 武将图鉴 ---- */
function heroOwned(name){ return !!ST.heroes[name]; }
function heroTotal(){ return HEROES_ALL.length; }
function heroOwnedCount(){ return Object.keys(ST.heroes).filter(n=>!!HERO_BY_NAME[n]).length; }
/* ---- 军功来源记账 ----
   bonusMerit 有三个来源（旧将重逢 / 集齐奖励 / 升级补偿），
   以前全显示成「旧将重逢」，家长看不出异常是哪来的。现在分开记。 */
function addMerit(st, n, src, eventId, detail){
  st = st || ST;
  n=moneyNumber(n);
  if(!Number.isFinite(n) || n<=0 || !["dup","collect","migrate"].includes(src)) throw new Error("拒绝异常军功入账");
  if(!Array.isArray(st.meritEvents)) st.meritEvents=[];
  if(eventId && st.meritEvents.some(e=>e.id===eventId)) return money(st.bonusMerit);
  st.bonusMerit = round1(money(st.bonusMerit) + n);
  if(!st.meritSrc || typeof st.meritSrc!=="object") st.meritSrc={ dup:0, collect:0, migrate:0 };
  st.meritSrc[src] = round1(money(st.meritSrc[src]) + n);
  st.meritEvents.push({id:eventId||uid(),date:TODAY(),at:Date.now(),src,amount:n,detail:detail||MERIT_SRC_NAME[src]});
  return st.bonusMerit;
}
const MERIT_SRC_NAME = { dup:"旧将重逢", collect:"集齐奖励", migrate:"升级补偿" };
function meritSrcLine(){
  const s=ST.meritSrc;
  if(!s || typeof s!=="object") return (ST.bonusMerit?(" · 其他 "+round1(ST.bonusMerit)):"");
  const parts=[];
  for(const k of ["dup","collect","migrate"]){
    const v=money(s[k]);
    if(v>0) parts.push(MERIT_SRC_NAME[k]+" "+round1(v));
  }
  // 老数据没有分项记录时，把总额兜进去，别让数字凭空消失
  const sum=round1(money(s.dup)+money(s.collect)+money(s.migrate));
  const rest=round1((ST.bonusMerit||0)-sum);
  if(rest>0.05) parts.push("其他 "+rest);
  return parts.length ? (" · "+parts.join(" · ")) : "";
}
function openMeritBook(){
  const earned=earnedMerit(), bonus=money(ST.bonusMerit), spent=spentMerit();
  let h='<h3>星星明细</h3><div class="quote">点卯 '+earned+' + 额外奖励 '+bonus+' - 已用 '+spent+' = 可用 '+availMerit()+'</div>';
  h+='<p style="font-size:12px;line-height:1.8">武将卡上的星级代表相遇次数，不是可花费的军功。锦囊上的数值是开启门槛，抽到锦囊不会增加星星。</p>';

  }
  for(const d of liveWindowDates()) if(dayMerit(d)>0) rows.push({date:d,label:"点卯（可补录）",n:dayMerit(d)});
  const events=(ST.meritEvents||[]);
  for(const e of events) rows.push({date:e.date,label:e.detail||MERIT_SRC_NAME[e.src]||"额外奖励",n:money(e.amount)});

  for(const v of ST.vault.filter(v=>v.redeemed)) rows.push({date:v.redeemedAt||v.gotAt||"",label:"开启锦囊："+v.name,n:-money(v.paidMerit==null?v.merit:v.paidMerit)});
  rows.sort((a,b)=>b.date.localeCompare(a.date));

  h+='<p style="font-size:12px">显示最近80条；完整记录包含在导出备份中。</p><button class="btn ghost" onclick="closeSheet()">收起</button>';
  openSheet(h);
}
function heroTierOf(name){ const h=HERO_BY_NAME[name]; return h ? h.tier : "common"; }
// 未识得的卡不给空白：把它那句话前半句当谜面，去掉名字，留一个能猜的钩子
function riddleOf(x){
  let t=String((x&&x.d)||"").split("·")[0].trim();
  if(x&&x.n) t=t.split(x.n).join("");
  t=t.replace(/[，,、。；;\s]+$/,"").trim();
  if(!t) t="榜上无名";
  return t.length>13 ? t.slice(0,13)+"…" : t;
}

/* ---- 集齐奖励 ----
   集换式收集最基本的约定：集齐有奖。160 张的图鉴如果永远只有一根进度条，
   孩子看不到终点。集满一个阵营给一次大庆功，集齐全套给称号。 */
const FACTION_DONE_MERIT = 200;   // 集满一个阵营
const ALL_DONE_MERIT = 1000;      // 集齐全套 160 位
const ALL_DONE_TITLE = "天下归心";
function factionOwned(f){ return (HEROES_BY_FACTION[f]||[]).filter(x=>heroOwned(x.n)).length; }
function factionTotal(f){ return (HEROES_BY_FACTION[f]||[]).length; }
function checkCollection(st){
  st = st || ST;
  const owned = Object.keys(st.heroes||{}).filter(n=>!!HERO_BY_NAME[n]).length;
  const out=[];
  if(!st.factionDone || typeof st.factionDone!=="object") st.factionDone={};
  for(const f of FACTION_ORDER){
    const tot=factionTotal(f);
    if(!tot) continue;
    const got=(HEROES_BY_FACTION[f]||[]).filter(x=>!!st.heroes[x.n]).length;
    if(got>=tot && !st.factionDone[f]){
      st.factionDone[f]=TODAY();
      addMerit(st, FACTION_DONE_MERIT, "collect", "collect:"+f, f+"阵营集齐");
      out.push({type:"faction", f, tot, merit:FACTION_DONE_MERIT});
    }
  }
  if(HEROES_ALL.length>0 && owned>=HEROES_ALL.length && !st.allDone){
    st.allDone=TODAY();
    addMerit(st, ALL_DONE_MERIT, "collect", "collect:all160", "160位全图鉴集齐");
    out.push({type:"all", merit:ALL_DONE_MERIT});
  }
  return out;
}
// 抽一位武将：未获得的加权，让集齐变得可能
function pickHero(){
  const pool=[];
  for(const t of HERO_ORDER) for(const h of HEROES[t]){
    let w=HERO_W[t];
    if(!heroOwned(h.n)) w*=HERO_NEW_BOOST;
    for(let i=0;i<Math.max(1,Math.round(w*10));i++) pool.push(h);
  }
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
// 抽一个锦囊
function pickPrize(){
  // 旧模板若有非法门槛或权重，先排除，不让坏模板生成无法开启的锦囊。
  const pool=ST.prizes.filter(p=>validPrizeCost(p.merit) && Number.isFinite(Number(p.weight)) && Number(p.weight)>0);
  if(!pool.length) return null;
  const tierW={common:0,rare:0,legend:0};
  for(const p of pool) tierW[p.tier]=(tierW[p.tier]||0)+Number(p.weight);
  const avail=Object.keys(tierW).filter(t=>tierW[t]>0);
  if(!avail.length) return pool[Math.floor(Math.random()*pool.length)];
  const total=avail.reduce((a,b)=>a+tierW[b],0);
  let x=Math.random()*total, tier=avail[0];
  for(const t of avail){ x-=tierW[t]; if(x<=0){ tier=t; break; } }
  const cand=pool.filter(p=>p.tier===tier);
  return cand[Math.floor(Math.random()*cand.length)];
}
// 保底时优先从神将里挑，且优先挑未获得的
function pickLegend(){
  const pool=[];
  for(const h of HEROES.legend){
    let w = heroOwned(h.n) ? 3 : 10;
    for(let i=0;i<w;i++) pool.push(h);
  }
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
// 还差几次触发保底
function pityLeft(){ return Math.max(0, PITY - (ST.pity.sinceLegend||0)); }
// 当前状态下的实际出率（不含保底那一榜），直接把代码里的权重算给家长和孩子看
function drawOdds(){
  const w={legend:0,rare:0,common:0};
  for(const t of HERO_ORDER) for(const h of HEROES[t])
    w[t]+=HERO_W[t]*(heroOwned(h.n)?1:HERO_NEW_BOOST);
  const sum=w.legend+w.rare+w.common;
  const pct=n=>sum>0?Math.round(P_HERO*w[n]/sum*10)/10:0;
  return { legend:pct("legend"), rare:pct("rare"), common:pct("common"), prize:100-P_HERO };
}
// 正式抽卡入口：扣令、奖励、集齐和存档必须一并成功，动画只展示结果。
function drawOnce(){
  if(ticketsAvail()<1){ toast("招贤令不够了"); return null; }
  return commitEconomy(()=>{
    ST.draws++;
    const res=rollDraw();
    res.collection=checkCollection();
    return res;
  });
}
// 随机结果计算器，正式入口只能通过 drawOnce 调用
function rollDraw(){
  const force = pityLeft() <= 0;
  const bump = () => { ST.pity.sinceLegend = (Number(ST.pity.sinceLegend)||0)+1; };
  if(!force && Math.random()*100 >= P_HERO){
    const p=pickPrize();
    if(p){
      bump();
      ST.vault.push({ uid:uid(), name:p.name, emoji:p.emoji||"🎁", tier:p.tier, merit:moneyNumber(p.merit), redeemed:false, gotAt:TODAY(), from:"draw" });
      return { kind:"prize", prize:p };
    }
    // 所有锦囊被删除/禁用时，改发武将也必须真正入图鉴或按重复计奖。
  }
  const h=force?pickLegend():pickHero();
  if(!h) throw new Error("招贤榜暂无可用奖励，本次不扣令");
  if(h.tier==="legend") ST.pity.sinceLegend=0; else bump();
  if(heroOwned(h.n)){
    const m=DUP_MERIT[h.tier]||6;
    ST.heroCount[h.n]=Math.max(1,Math.floor(Number(ST.heroCount[h.n])||1))+1;
    addMerit(ST, m, "dup", "dup:"+h.n+":"+ST.heroCount[h.n], h.n+"第"+ST.heroCount[h.n]+"次相遇");
    return {kind:"dup",hero:h,merit:m,forced:force};
  }
  ST.heroes[h.n]=TODAY();
  return {kind:"hero",hero:h,forced:force};
}

/* ---- 毕业：连续若干完整周 100% 达成 → 视为已养成 ---- */
// 某项军令在某个完整周内的达成率；本周未结束返回 null
function taskWeekPct(task, weekMonday){
  const days=weekDates(weekMonday);
  const last=days[6];
  if(last >= TODAY()) return null;          // 只有整周过去的才算
  if(task.type==="flex"){
    const target=Math.max(1,task.weekTarget||1);
    let dn=0;
    for(const d of days){ const r=rec(d,task.id); if(r&&r.level>=0.5) dn++; }
    return Math.min(1, dn/target);
  }
  let tot=0, dn=0;
  for(const d of days){
    const appear = task.type==="daily" || (task.weekdays||[]).includes(parseD(d).getDay());
    if(!appear) continue;
    tot++; if((rec(d,task.id)||{level:0}).level>=0.5) dn++;
  }
  return tot ? dn/tot : null;
}
// 找出连续 GRADUATE_WEEKS 个完整周都 100% 达成的军令
function checkGraduation(){
  const out=[];
  const thisMon=weekStart(TODAY());
  for(const t of ST.tasks){
    if(t.archived) continue;
    if(t.type==="flex" && Math.max(1,t.weekTarget||1) < 2) continue;  // 周目标只有 1 次的不算习惯
    let ok=true;
    for(let i=1;i<=GRADUATE_WEEKS;i++){
      const mon=addD(thisMon,-7*i);
      const p=taskWeekPct(t,mon);
      if(p===null || p<1){ ok=false; break; }
    }
    if(ok) out.push(t);
  }
  return out;
}
// 执行毕业：移出日常清单，进荣誉墙
function graduateTask(t){
  ST.graduated[t.id]={ name:t.name, emoji:t.emoji||"", subject:t.subject, at:TODAY(), weeks:GRADUATE_WEEKS };
  t.archived=true;
}
function ungraduate(taskId){
  const g=ST.graduated[taskId]; if(!g) return;
  const t=ST.tasks.find(x=>x.id===taskId);
  if(t) t.archived=false;
  delete ST.graduated[taskId];
}

/* ---- 成就 ---- */
function calcAchievements(){
  const got={};
  if(earnedMerit()>0) got.first_win=1;
  if(Object.keys(ST.bossDefeats).length>=1) got.first_boss=1;
  if(Object.keys(ST.bossDefeats).length>=10) got.boss_hunter=1;
  if(totalMerit()>=500) got.merit500=1;
  let half=0, cnCnt=0;
  for(const k in ST.records){
    const d=ST.records[k];
    for(const id in d){
      if(d[id].type==="half"||d[id].type==="poor") half++;
      if(d[id].level>=0.5){
        const t=ST.tasks.find(x=>x.id===id);
        if(t && t.subject==="cn") cnCnt++;
      }
    }
  }
  if(half>=20) got.half_hero=1;
  if(cnCnt>=50) got.cn50=1;
  const all=allDatesWithRecords();
  let best=0,cur=0;
  for(let i=0;i<all.length;i++){
    const d=all[i];
    const has=ST.records[d]&&Object.keys(ST.records[d]).length;
    if(has){
      if(i>0 && addD(all[i-1],1)===d) cur++; else cur=1;
      if(cur>best) best=cur;
    } else cur=0;
  }
  // 连击徽章也认「军令齐备」的连击
  const cs=currentStreak();
  if(cs>best) best=cs;
  if(best>=3) got.streak3=1;
  if(best>=7) got.streak7=1;
  // 完美一周 / 满分一天：历史走账本，未结算的实时算
  const weeks=new Set(allDatesWithRecords().map(weekStart));
  for(const w of weeks){
    let tot=0,done=0,any=false;
    for(const d of weekDates(w)){
      if(d>TODAY()) continue;
      const L=ST.ledger[d];
      if(isFrozen(d) && L && L.settled){ tot+=L.total; done+=L.done; any=any||L.total>0; continue; }
      const list=dayExpected(d);
      tot+=list.length; any=any||list.length>0;
      done+=list.filter(t=>{ const r=rec(d,t.id); return r&&r.level>=0.5; }).length;
    }
    if(any&&tot>0&&done>=tot){ got.perfect_week=1; break; }
  }
  for(const d of allDatesWithRecords()){
    const list=dayExpected(d);
    if(!list.length) continue;
    if(list.every(t=>{ const r=rec(d,t.id); return r&&r.type==="full"; })){ got.full_day=1; break; }
  }
  let changed=false;
  const today=TODAY();
  for(const k in got){ if(!ST.achievements[k]){ ST.achievements[k]=today; changed=true; } }
  return changed;
}
function rankOf(merit){
  let r=RANKS[0],next=null;
  for(let i=0;i<RANKS.length;i++) if(merit>=RANKS[i].s){ r=RANKS[i]; next=RANKS[i+1]||null; }
  return {cur:r,next:next};
}
// 当前官职（用历史最高军功，只升不降）
function myRank(){ return rankOf(rankMerit()); }

    text: "有 "+co+" 张兑现券还没兑现",
    sub: "今日已定 · 提醒大人开兑现台看看",

function taskCardHTML(t,d){

  const done = r && r.level>=0.5;

  if(t.boss) cls.push("boss");
  let meta='<span>⏱ 计划 '+t.planMin+' 分钟</span>';
  if(t.type==="flex"){
    const target=Math.max(1,t.weekTarget||1);
    const doneW=weekDone(t.id,d);
    const left=Math.max(0,target-doneW);
    meta+='<span>本周 '+doneW+'/'+target+'</span>';
    if(!done && left>0) meta+='<span class="rem">尚需 '+left+' 次</span>';
  }
  if(r && r.minutes) meta+='<span>实际 '+r.minutes+' 分钟</span>';
  let badge;
  if(!r) badge='<span class="dot-empty"></span>';
  else if(r.type==="full") badge='<span class="star-badge">⭐ 完胜</span>';
  else if(r.type==="half") badge='<span class="star-badge half">◑ 苦战</span>';
  else if(r.type==="poor") badge='<span class="star-badge poor">◑ 惨胜</span>';
  else if(r.type==="skip") badge='<span class="star-badge zero">⏭ 免战</span>';
  else badge='<span class="star-badge zero">✖ 未战</span>';

function openCheck(taskId,dateStr){
  const t=ST.tasks.find(x=>x.id===taskId); if(!t) return;
  const S=SUBJECTS[t.subject]||SUBJECTS.other;
  const r=rec(dateStr,taskId)||{};
  const isFlex = t.type==="flex";
  // 已经结算入账的历史日子只读；最近 BACKFILL_DAYS 天还开着，忘了点可以补
  const L=ST.ledger[dateStr];
  const locked = isFrozen(dateStr) && L && L.settled;
  const TYPE_NAME={full:"完胜",half:"苦战",poor:"惨胜",miss:"未战",skip:"免战"};
  if(locked){
    let h='<h3>'+esc(t.name)+'</h3><div class="sh-sub">'+S.icon+' '+S.place+' · '+fmtMD(dateStr)+'（'+WD[parseD(dateStr).getDay()]+'）</div>';
    h+='<div class="result-box '+(r.type==="full"?"t-legend":(r.type==="half"||r.type==="poor")?"t-rare":"t-normal")+'">'
      + '<div class="re">'+(r.type==="full"?"⭐":(r.type==="half"||r.type==="poor")?"◑":"✖")+'</div>'
      + '<div class="rn">'+(TYPE_NAME[r.type]||"未记录")+'</div>'
      + '<div class="rt">'+(r.minutes?("实际用时 "+r.minutes+" 分钟"):"未填实际用时")+'</div></div>';
    h+='<div class="quote" style="margin-top:13px;">这一天的账已经结算入账了，不能再改动 —— 「不追究前日之失」，也不能回头改写前日之功。<br>（只能是最近 '+BACKFILL_DAYS+' 天内补录）</div>';
    h+='<button class="btn ghost" style="width:100%;margin-top:13px;" onclick="closeSheet()">知道了</button>';
    openSheet(h);
    return;
  }
  const opts=[
    { k:"full", e:"⭐", tt:"完胜", dd:"完整高质量完成 · 得 1 军功", st:"1.0" },
    { k:"half", e:"◑",  tt:"苦战", dd:"拼尽了力但没做完 · 得 0.5 军功", st:"0.5" },
    { k:"poor", e:"◐",  tt:"惨胜", dd:"做完了，但质量打了折扣 · 得 0.5 军功", st:"0.5" },
    { k:"miss", e:"✕",  tt:"未战", dd:"今天确实没动手 · 不计军功", st:"—" }
  ];
  let h='<h3>'+esc(t.name)+'</h3><div class="sh-sub">'+S.icon+' '+S.place+' · '+fmtMD(dateStr)+'（'+WD[parseD(dateStr).getDay()]+'）</div>';
  for(const o of opts){
    const sel = (r.type===o.k) ? " sel" : "";
    h+='<button class="opt'+sel+'" data-k="'+o.k+'"><span class="oe">'+o.e+'</span>'
      + '<span class="ob"><span class="ot">'+o.tt+'</span><span class="od">'+o.dd+'</span></span>'
      + '<span class="os">'+(o.st==="—"?"—":"⭐ "+o.st)+'</span></button>';
  }
  if(isFlex){
    h+='<button class="opt'+(r.type==="skip"?" sel":"")+'" data-k="skip"><span class="oe">🏳️</span>'
      + '<span class="ob"><span class="ot">高挂免战牌</span>'
      + '<span class="od">今日不与，顺延到本周之后，不记作欠债</span></span></button>';
  }
  h+='<div class="divider"></div>'
   + '<div class="field"><label>实际用时（分钟，可留空）</label>'
   + '<input type="number" id="actMin" min="0" max="600" placeholder="计划 '+t.planMin+' 分钟" value="'+(r.minutes||"")+'"></div>'
   + '<div class="grid2"><button class="btn ghost" onclick="closeSheet()">取消</button>'
   + (r.type&&r.type!=="skip" ? '<button class="btn danger" onclick="clearRec(\''+taskId+'\',\''+dateStr+'\')">撤销点卯</button>' : '<button class="btn" id="okBtn">确定</button>')
   + '</div>';
  if(r.type&&r.type!=="skip") h+='<button class="btn" id="okBtn" style="margin-top:9px;width:100%">更新点卯</button>';
  // 孩子的口子：觉得这项太难，可以直接说出来
  h+='<button class="addrow" style="margin-top:9px;" onclick="markTooHard(\''+taskId+'\')">🤔 这项对我来说太难了</button>';

  openSheet(h,(sheet)=>{
    let picked = r.type||null;
    $$(".opt",sheet).forEach(b=>b.onclick=()=>{
      picked=b.dataset.k;
      $$(".opt",sheet).forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
    });
    const ok=$("#okBtn",sheet);
    const commit=()=>{
      if(!picked){ toast("先选一下今日战况"); return; }
      const mins=parseInt(($("#actMin",sheet)||{}).value||"0",10)||0;
      const before=dayIsComplete(dateStr);
      const storyBefore=storyChapterRaw();
      const meritBefore=totalMerit();
      const level = picked==="full"?1 : (picked==="half"||picked==="poor")?0.5 : 0;
      if(!commitEconomy(()=>{ setRec(dateStr,taskId,level,picked,mins); return {ok:true}; })) return;
      const after=dayIsComplete(dateStr);
      const storyAfter=storyChapterRaw();
      const beatenBefore=bossBeaten(dateStr);
      // 飘字：从被点的那个选项位置飞出来，让反馈有实体
      const anchor=$$(".opt",sheet).filter(b=>b.classList.contains("sel"))[0]||sheet;
      const meritDelta=round1(totalMerit()-meritBefore);
      if(meritDelta!==0) floatFromEl(anchor,"军功 "+(meritDelta>0?"+":"")+meritDelta,true);
      else if(picked==="skip") floatFromEl(anchor,"🏳️",false);
      else floatFromEl(anchor,"已记录 · 军功未变",false);
      calcAchievements(); save(); closeSheet(); refreshTop(); render();
      if(picked==="half") toast("苦战也算数，这份力没有白费 ◑");
      else if(picked==="poor") toast("惨胜也是胜，先把旗子插上 ◐");
      else if(picked==="full") toast("好，完胜一场 ⭐");
      else if(picked==="skip") toast("免战牌已挂，顺延到本周之后 🏳️");
      if(!before && after && !beatenBefore){
        confetti(60);
        const csNow=currentStreak();
        toast(csNow>=3
          ? ("🎉 军令齐备，招贤令 +1！连战 "+csNow+" 天 · "+streakName(csNow)+" ×"+streakMult(csNow))
          : "🎉 军令齐备，招贤令 +1！",2800);
      }
      // 攒够全勤天数，主线往前推一回 —— 晚一点弹，别把上一条盖掉
      if(storyAfter>storyBefore){
        const chaps=ST.story.chapters||[];
        const idx=Math.min(storyAfter, chaps.length)-1;
        if(idx>=0) setTimeout(()=>{
          confetti(90);
          toast("📜 主线推进 · 第 "+cnNum(idx+1)+" 回\n「"+(chaps[idx]||"")+"」",3600);
        }, before&&after ? 600 : 2900);
      }
    };
    if(ok) ok.onclick=commit;
  });
}
function clearRec(taskId,dateStr){
  const L=ST.ledger[dateStr];
  if(isFrozen(dateStr) && L && L.settled){
    closeSheet(); toast("这一天的账已结算入账，不能再改动（只能补录最近 "+BACKFILL_DAYS+" 天）");
    return;
  }
  if(!commitEconomy(()=>{ setRec(dateStr,taskId,null,null); return {ok:true}; })) return;
  closeSheet(); refreshTop(); render(); toast("已撤销这天的点卯");
}

  for(const [n,l] of [[3,"3 天"],[7,"1 周"],[14,"2 周"],[30,"1 个月"],[60,"暑假 2 个月"]])
    h+='<button data-v="'+n+'">'+l+'</button>';
  h+='</div></div>';
  h+='<div class="grid2">';
  if(!isNew) h+='<button class="btn danger" onclick="delBreak(\''+b.id+'\')">删除</button>';
  h+='<button class="btn" id="bOk">'+(isNew?"开始休整":"保存")+'</button></div>';
  openSheet(h,(sheet)=>{
    $$("#bReason button",sheet).forEach(x=>x.onclick=()=>{ $$("#bReason button",sheet).forEach(y=>y.classList.remove("on")); x.classList.add("on"); });
    $$("#bLen button",sheet).forEach(x=>x.onclick=()=>{
      const n=parseInt(x.dataset.v,10);
      $("#bFrom",sheet).value=TODAY();
      $("#bTo",sheet).value=addD(TODAY(),n-1);
      $$("#bLen button",sheet).forEach(y=>y.classList.remove("on")); x.classList.add("on");
    });
    $("#bOk",sheet).onclick=()=>{
      const from=$("#bFrom",sheet).value.trim(), to=$("#bTo",sheet).value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)){ toast("日期格式要对，例 2026-10-12"); return; }
      if(to < from){ toast("结束日不能早于开始日"); return; }
      const reason=$("#bReason button.on",sheet).dataset.v;
      settleLedger();
      if(isNew) ST.breaks.push({ id:uid(), from, to, reason });
      else Object.assign(ST.breaks.find(x=>x.id===id), { from, to, reason });
      save(); closeSheet(); refreshTop(); render();
      toast(isNew ? ("已进入休整 · 到 "+fmtMD(to)) : "已保存");
    };
  });
}
function delBreak(id){
  const b=(ST.breaks||[]).find(x=>x.id===id); if(!b) return;
  if(!confirm("删除这段休整期（"+b.from+" ~ "+b.to+"）？")) return;
  ST.breaks=ST.breaks.filter(x=>x.id!==id);
  for(const d in ST.ledger){ if(ST.ledger[d].rest) delete ST.ledger[d]; }   // 让这段重新结算
  settleLedger();
  save(); closeSheet(); refreshTop(); render();
  toast("已删除");
}
