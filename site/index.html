/* ---- 集齐奖励 ----
   集换式收集最基本的约定：集齐有奖。160 张的图鉴如果永远只有一根进度条，
   孩子看不到终点。集满一个阵营给一次大庆功，集齐全套给称号。 */
const FACTION_DONE_MERIT = 0;     // 集满一个阵营：只给称号（v2.3.0 起不给星）
const ALL_DONE_MERIT = 0;         // 集齐全套：只给称号
const ALL_DONE_TITLE = "天下归心";
function factionOwned(f){ return (HEROES_BY_FACTION[f]||[]).filter(x=>heroOwned(x.n)).length; }
function factionTotal(f){ return (HEROES_BY_FACTION[f]||[]).length; }
function checkCollection(st){
  st = st || ST;
  const owned = Object.keys(st.heroes||{}).filter(n=>!!HERO_BY_NAME[n]).length;
  const out=[];
  if(!st.factionDone || typeof st.factionDone!=="object") st.factionDone={};
  for(const f of FACTION_ORDER){
    const tot=factionTotal(f);
    if(!tot) continue;
    const got=(HEROES_BY_FACTION[f]||[]).filter(x=>!!st.heroes[x.n]).length;
    if(got>=tot && !st.factionDone[f]){
      st.factionDone[f]=TODAY();
      out.push({type:"faction", f, tot, merit:FACTION_DONE_MERIT});
    }
  }
  if(HEROES_ALL.length>0 && owned>=HEROES_ALL.length && !st.allDone){
    st.allDone=TODAY();
    out.push({type:"all", merit:ALL_DONE_MERIT});
  }
  return out;
}
// 抽一位武将：未获得的加权，让集齐变得可能
function pickHero(){
  const pool=[];
  for(const t of HERO_ORDER) for(const h of HEROES[t]){
    let w=HERO_W[t];
    if(!heroOwned(h.n)) w*=HERO_NEW_BOOST;
    for(let i=0;i<Math.max(1,Math.round(w*10));i++) pool.push(h);
  }
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
// 抽一个锦囊
function pickPrize(){
  // 旧模板若有非法门槛或权重，先排除，不让坏模板生成无法开启的锦囊。
  const pool=ST.prizes.filter(p=>validPrizeCost(p.merit) && Number.isFinite(Number(p.weight)) && Number(p.weight)>0);
  if(!pool.length) return null;
  const tierW={common:0,rare:0,legend:0};
  for(const p of pool) tierW[p.tier]=(tierW[p.tier]||0)+Number(p.weight);
  const avail=Object.keys(tierW).filter(t=>tierW[t]>0);
  if(!avail.length) return pool[Math.floor(Math.random()*pool.length)];
  const total=avail.reduce((a,b)=>a+tierW[b],0);
  let x=Math.random()*total, tier=avail[0];
  for(const t of avail){ x-=tierW[t]; if(x<=0){ tier=t; break; } }
  const cand=pool.filter(p=>p.tier===tier);
  return cand[Math.floor(Math.random()*cand.length)];
}
// 保底时优先从神将里挑，且优先挑未获得的
function pickLegend(){
  const pool=[];
  for(const h of HEROES.legend){
    let w = heroOwned(h.n) ? 3 : 10;
    for(let i=0;i<w;i++) pool.push(h);
  }
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
// 还差几次触发保底
function pityLeft(){ return Math.max(0, PITY - (ST.pity.sinceLegend||0)); }
// 当前状态下的实际出率（不含保底那一榜），直接把代码里的权重算给家长和孩子看
function drawOdds(){
  const w={legend:0,rare:0,common:0};
  for(const t of HERO_ORDER) for(const h of HEROES[t])
    w[t]+=HERO_W[t]*(heroOwned(h.n)?1:HERO_NEW_BOOST);
  const sum=w.legend+w.rare+w.common;
  const pct=n=>sum>0?Math.round(P_HERO*w[n]/sum*10)/10:0;
  return { legend:pct("legend"), rare:pct("rare"), common:pct("common"), prize:100-P_HERO };
}
// 正式抽卡入口：扣令、奖励、集齐和存档必须一并成功，动画只展示结果。
function drawOnce(){
  if(ticketsAvail()<1){ toast("招贤令不够了"); return null; }
  return commitEconomy(()=>{
    ST.draws++;
    const res=rollDraw();
    res.collection=checkCollection();
    return res;
  });
}
// 随机结果计算器，正式入口只能通过 drawOnce 调用
function rollDraw(){
  const force = pityLeft() <= 0;
  const bump = () => { ST.pity.sinceLegend = (Number(ST.pity.sinceLegend)||0)+1; };
  if(!force && Math.random()*100 >= P_HERO){
    const p=pickPrize();
    if(p){
      bump();
      ST.vault.push({ uid:uid(), name:p.name, emoji:p.emoji||"🎁", tier:p.tier, merit:moneyNumber(p.merit), redeemed:false, gotAt:TODAY(), from:"draw" });
      return { kind:"prize", prize:p };
    }
    // 所有锦囊被删除/禁用时，改发武将也必须真正入图鉴或按重复计奖。
  }
  const h=force?pickLegend():pickHero();
  if(!h) throw new Error("招贤榜暂无可用奖励，本次不扣令");
  if(h.tier==="legend") ST.pity.sinceLegend=0; else bump();
  if(heroOwned(h.n)){
    // 军功只凭学习：旧将重逢只加星级，不折算军功
    ST.heroCount[h.n]=Math.max(1,Math.floor(Number(ST.heroCount[h.n])||1))+1;
    return {kind:"dup",hero:h,merit:0,forced:force};
  }
  ST.heroes[h.n]=TODAY();
  return {kind:"hero",hero:h,forced:force};
}

/* ---- 毕业：连续若干完整周 100% 达成 → 视为已养成 ---- */
// 某项军令在某个完整周内的达成率；本周未结束返回 null
function taskWeekPct(task, weekMonday){
  const days=weekDates(weekMonday);
  const last=days[6];
  if(last >= TODAY()) return null;          // 只有整周过去的才算
  if(task.type==="flex"){
    const target=Math.max(1,task.weekTarget||1);
    let dn=0;
    for(const d of days){ const r=rec(d,task.id); if(r&&r.level>=0.5) dn++; }
    return Math.min(1, dn/target);
  }
  let tot=0, dn=0;
  for(const d of days){
    const appear = task.type==="daily" || (task.weekdays||[]).includes(parseD(d).getDay());
    if(!appear) continue;
    tot++; if((rec(d,task.id)||{level:0}).level>=0.5) dn++;
  }
  return tot ? dn/tot : null;
}
// 找出连续 GRADUATE_WEEKS 个完整周都 100% 达成的军令
function checkGraduation(){
  const out=[];
  const thisMon=weekStart(TODAY());
  for(const t of ST.tasks){
    if(t.archived||t.pending) continue;
    if(t.type==="flex" && Math.max(1,t.weekTarget||1) < 2) continue;  // 周目标只有 1 次的不算习惯
    let ok=true;
    for(let i=1;i<=GRADUATE_WEEKS;i++){
      const mon=addD(thisMon,-7*i);
      const p=taskWeekPct(t,mon);
      if(p===null || p<1){ ok=false; break; }
    }
    if(ok) out.push(t);
  }
  return out;
}
// 执行毕业：移出日常清单，进荣誉墙
function graduateTask(t){
  changeTaskRules(()=>{
    ST.graduated[t.id]={ name:t.name, emoji:t.emoji||"", subject:t.subject, at:TODAY(), weeks:GRADUATE_WEEKS };
    t.archived=true;
  });
}
function ungraduate(taskId){
  const g=ST.graduated[taskId]; if(!g) return;
  changeTaskRules(()=>{
    const t=ST.tasks.find(x=>x.id===taskId);
    if(t){ t.archived=false; t.approvedAt=addD(TODAY(),1); }
    delete ST.graduated[taskId];
  });
}

/* ---- 成就 ---- */
function calcAchievements(){
  const got={};
  if(earnedMerit()>0) got.first_win=1;
  if(Object.keys(ST.bossDefeats).length>=1) got.first_boss=1;
  if(Object.keys(ST.bossDefeats).length>=10) got.boss_hunter=1;
  if(totalMerit()>=500) got.merit500=1;
  let half=0, cnCnt=0;
  for(const k in ST.records){
    const d=ST.records[k];
    for(const id in d){
      if(d[id].type==="half"||d[id].type==="poor") half++;
      if(d[id].level>=0.5){
        const t=ST.tasks.find(x=>x.id===id);
        if(t && t.subject==="cn") cnCnt++;
      }
    }
  }
  if(half>=20) got.half_hero=1;
  if(cnCnt>=50) got.cn50=1;
  const all=allDatesWithRecords();
  let best=0,cur=0;
  for(let i=0;i<all.length;i++){
    const d=all[i];
    const has=ST.records[d]&&Object.keys(ST.records[d]).length;
    if(has){
      if(i>0 && addD(all[i-1],1)===d) cur++; else cur=1;
      if(cur>best) best=cur;
    } else cur=0;
  }
  // 连击徽章也认「军令齐备」的连击
  const cs=currentStreak();
  if(cs>best) best=cs;
  if(best>=3) got.streak3=1;
  if(best>=7) got.streak7=1;
  // 完美一周 / 满分一天：历史走账本，未结算的实时算
  const weeks=new Set(allDatesWithRecords().map(weekStart));
  for(const w of weeks){
    let tot=0,done=0,any=false;
    for(const d of weekDates(w)){
      if(d>TODAY()) continue;
      const L=ST.ledger[d];
      if(isFrozen(d) && L && L.settled){ tot+=L.total; done+=L.done; any=any||L.total>0; continue; }
      const list=dayExpected(d);
      tot+=list.length; any=any||list.length>0;
      done+=list.filter(t=>{ const r=rec(d,t.id); return r&&r.level>=0.5; }).length;
    }
    if(any&&tot>0&&done>=tot){ got.perfect_week=1; break; }
  }
  for(const d of allDatesWithRecords()){
    const list=dayExpected(d);
    if(!list.length) continue;
    if(list.every(t=>{ const r=rec(d,t.id); return r&&r.type==="full"; })){ got.full_day=1; break; }
  }
  let changed=false;
  const today=TODAY();
  for(const k in got){ if(!ST.achievements[k]){ ST.achievements[k]=today; changed=true; } }
  return changed;
}
function rankOf(merit){
  let r=RANKS[0],next=null;
  for(let i=0;i<RANKS.length;i++) if(merit>=RANKS[i].s){ r=RANKS[i]; next=RANKS[i+1]||null; }
  return {cur:r,next:next};
}
// 当前官职（用历史最高军功，只升不降）
function myRank(){ return rankOf(rankMerit()); }

    // 孩子的口子：自己想加就加，不用等批
    if(isToday){
      html+='<button class="addrow" onclick="openKidAdd()">'
          + '<span style="font-size:17px;">➕</span> 再给我加一项</button>';
      html+=pendingTasksHTML();
    }
  }
  const hol=holidayTasks(d);
  if(hol.length){
    html+='<div class="divider"></div>';
    for(const t of hol) html+='<div class="holiday-row">✓ '+esc(t.name)+' 本周军令已达成，余日休整</div>';
  }
  html+='</div>';

  // ===== 破敌 =====
  const B=BOSSES[wd];
  const ratio=dayRatio(d);
  const hp=Math.round((1-ratio)*100);
  const beaten=bossBeaten(d);
  const canHit = dayIsComplete(d);
  const total=list.length;
  // 休整日不出现劲敌，也不谈结算
  if(!isRestDay(d)){
  html+='<div class="boss-card'+(beaten?" beaten":"")+'">'
      + '<div class="boss-top">'
      + '<div class="boss-face'+(beaten?" dead":"")+'">'+(beaten?"🏳️":B.emoji)+'</div>'
      + '<div class="boss-info"><div class="boss-name">'+esc(B.name)+(beaten?" · 已破":"")+'</div>'
      + '<div class="boss-place">📍 '+esc(B.place)+(beaten?"":" · "+WD[wd])+'</div>'
      + '<div class="boss-sub">'+(beaten?"今日劲敌已破，战利品入库。":(total?("尚余 "+(total-doneN)+" 项军令未了。 "+esc(B.desc)):"今日无军令，劲敌不至。"))+'</div></div>'
      + '</div>';
  if(!beaten && total){
    html+='<div class="hp-wrap"><i style="width:'+hp+'%"></i><b>气势 '+hp+'%</b></div>'
        + '<div class="boss-foot">'
        + '<button class="btn '+(canHit?"gold":"ghost")+'" '+(canHit?"":"disabled")+' onclick="attackBoss()">'+(canHit?"⚔️ 出战":"军令未了，不可出战")+'</button>'
        + '<span style="font-size:11.5px;opacity:.78;font-weight:600;">胜可得 🎟️×2 + 战利品</span>'
        + '</div>';
  }
  html+='</div>';
  }   // 休整日结束：破敌区块不显示

  // ===== 今日结算 =====
  const cs = (d===TODAY()) ? currentStreak() : 0;
  if(isRestDay(d)){
    html+='<div class="card" style="text-align:center;">'
        + '<div style="font-size:13px;font-weight:700;margin-bottom:5px;">🍵 今日休整</div>'
        + '<div style="font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.75;">'
        + '休整期间不结算完成度，连战天数也冻结着。<br>'
        + (cs>0 ? ('已连战 '+cs+' 天，等你回来接着数。') : '等你回来再接着数。')+'</div>'
        + '</div>';
    return html;
  }
  const complete=dayIsComplete(d);
  const mult = complete ? streakMult(cs) : 1;
  html+='<div class="card"><div class="card-head"><h3>今日结算</h3>'
      + '<span class="hint">'+(complete?"军令齐备，已得招贤令 🎟️":"军令齐备可得招贤令 🎟️")+'</span></div>'
      + '<div class="prog"><i style="width:'+Math.round(ratio*100)+'%"></i></div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)">'
      + '<span>完成度 '+Math.round(ratio*100)+'%</span><span>今日军功 ⭐'+dayMerit(d)+'</span></div>'
      + (mult>1 ? '<div style="font-size:12px;font-weight:700;color:var(--zhu);margin-top:6px;">🔥 连战 '+cs+' 天 · 今日军功 ×'+mult+'（'+streakName(cs)+'）</div>' : '')
      + (cs>0 && cs<3 && d===TODAY() ? '<div style="font-size:12px;font-weight:600;color:var(--ink-3);margin-top:6px;">连战 '+cs+' 天 · 再连 '+(3-cs)+' 天起享军功加成</div>' : '')
      + '</div>';
  if(isToday){
    const recDays=Object.keys(ST.records||{}).length;
    const backupDays=ST.lastBackup?Math.round((parseD(TODAY())-parseD(ST.lastBackup))/86400000):null;
    if(recDays>=3 && (backupDays===null || backupDays>=14)){
      html+='<div class="backup-nudge" id="backupNudge">'
          + '<span>📦 '+(backupDays===null?'还没有导出过备份':'距上次导出备份已 '+backupDays+' 天')+' · 记录都在本机，定期存一份更稳妥</span>'
          + '<button class="btn ghost sm" onclick="exportData();render();">导出备份</button></div>';
    }
  }

  return html;
}

function taskCardHTML(t,d){
  const r=rec(d,t.id);
  const S=SUBJECTS[t.subject]||SUBJECTS.other;
  const done = r && r.level>=0.5;
  const cls=["task-card","s-"+t.subject];
  if(done) cls.push("done");
  if(t.boss) cls.push("boss");
  let meta='<span>⏱ 计划 '+t.planMin+' 分钟</span>';
  if(t.type==="flex"){
    const target=Math.max(1,t.weekTarget||1);
    const doneW=weekDone(t.id,d);
    const left=Math.max(0,target-doneW);
    meta+='<span>本周 '+doneW+'/'+target+'</span>';
    if(!done && left>0) meta+='<span class="rem">尚需 '+left+' 次</span>';
  }
  if(r && r.minutes) meta+='<span>实际 '+r.minutes+' 分钟</span>';
  let badge;
  if(!r) badge='<span class="dot-empty"></span>';
  else if(r.type==="full") badge='<span class="star-badge">⭐ 完胜</span>';
  else if(r.type==="half") badge='<span class="star-badge half">◑ 苦战</span>';
  else if(r.type==="poor") badge='<span class="star-badge poor">◑ 惨胜</span>';
  else if(r.type==="skip") badge='<span class="star-badge zero">⏭ 免战</span>';
  else badge='<span class="star-badge zero">✖ 未战</span>';
  return '<div class="'+cls.join(" ")+'" onclick="openCheck(\''+t.id+'\',\''+d+'\')">'
    + '<div class="tc-emoji">'+(t.emoji||S.icon)+'</div>'
    + '<div class="tc-body"><div class="tc-title">'+esc(t.name)
    + '<span class="tag">'+S.place+'</span>'
    + (t.boss?'<span class="tag boss">⚔ 硬仗</span>':'')
    + '</div><div class="tc-meta">'+meta+'</div></div>'
    + '<div class="tc-right">'+badge+'</div>'
    + '</div>';
}

   点卯弹窗
   ===================================================================== */
function openCheck(taskId,dateStr){
  const t=taskRulesForDate(dateStr).find(x=>x.id===taskId); if(!t) return;
  const S=SUBJECTS[t.subject]||SUBJECTS.other;
  const r=rec(dateStr,taskId)||{};
  const isFlex = t.type==="flex";
  // 已经结算入账的历史日子只读；最近 BACKFILL_DAYS 天还开着，忘了点可以补
  const L=ST.ledger[dateStr];
  const locked = isFrozen(dateStr) && L && L.settled;
  const TYPE_NAME={full:"完胜",half:"苦战",poor:"惨胜",miss:"未战",skip:"免战"};
  if(locked){
    let h='<h3>'+esc(t.name)+'</h3><div class="sh-sub">'+S.icon+' '+S.place+' · '+fmtMD(dateStr)+'（'+WD[parseD(dateStr).getDay()]+'）</div>';
    h+='<div class="result-box '+(r.type==="full"?"t-legend":(r.type==="half"||r.type==="poor")?"t-rare":"t-normal")+'">'
      + '<div class="re">'+(r.type==="full"?"⭐":(r.type==="half"||r.type==="poor")?"◑":"✖")+'</div>'
      + '<div class="rn">'+(TYPE_NAME[r.type]||"未记录")+'</div>'
      + '<div class="rt">'+(r.minutes?("实际用时 "+r.minutes+" 分钟"):"未填实际用时")+'</div></div>';
    h+='<div class="quote" style="margin-top:13px;">这一天的账已经结算入账了，不能再改动 —— 「不追究前日之失」，也不能回头改写前日之功。<br>（只能是最近 '+BACKFILL_DAYS+' 天内补录）</div>';
    h+='<button class="btn ghost" style="width:100%;margin-top:13px;" onclick="closeSheet()">知道了</button>';
    openSheet(h);
    return;
  }
  const opts=[
    { k:"full", e:"⭐", tt:"完胜", dd:"完整高质量完成 · 得 "+starRate(dateStr)+" 军功", st:String(starRate(dateStr)) },
    { k:"half", e:"◑",  tt:"苦战", dd:"拼尽了力但没做完 · 得 "+starRate(dateStr)/2+" 军功", st:String(starRate(dateStr)/2) },
    { k:"poor", e:"◐",  tt:"惨胜", dd:"做完了，但质量打了折扣 · 得 "+starRate(dateStr)/2+" 军功", st:String(starRate(dateStr)/2) },
    { k:"miss", e:"✕",  tt:"未战", dd:"今天确实没动手 · 不计军功", st:"—" }
  ];
  let h='<h3>'+esc(t.name)+'</h3><div class="sh-sub">'+S.icon+' '+S.place+' · '+fmtMD(dateStr)+'（'+WD[parseD(dateStr).getDay()]+'）</div>';
  for(const o of opts){
    const sel = (r.type===o.k) ? " sel" : "";
    h+='<button class="opt'+sel+'" data-k="'+o.k+'"><span class="oe">'+o.e+'</span>'
      + '<span class="ob"><span class="ot">'+o.tt+'</span><span class="od">'+o.dd+'</span></span>'
      + '<span class="os">'+(o.st==="—"?"—":"⭐ "+o.st)+'</span></button>';
  }
  if(isFlex){
    h+='<button class="opt'+(r.type==="skip"?" sel":"")+'" data-k="skip"><span class="oe">🏳️</span>'
      + '<span class="ob"><span class="ot">高挂免战牌</span>'
      + '<span class="od">今日不与，顺延到本周之后，不记作欠债</span></span></button>';
  }
  h+='<div class="divider"></div>'
   + '<div class="field"><label>实际用时（分钟，可留空）</label>'
   + '<input type="number" id="actMin" min="0" max="600" placeholder="计划 '+t.planMin+' 分钟" value="'+(r.minutes||"")+'"></div>'
   + '<div class="grid2"><button class="btn ghost" onclick="closeSheet()">取消</button>'
   + (r.type&&r.type!=="skip" ? '<button class="btn danger" onclick="clearRec(\''+taskId+'\',\''+dateStr+'\')">撤销点卯</button>' : '<button class="btn" id="okBtn">确定</button>')
   + '</div>';
  if(r.type&&r.type!=="skip") h+='<button class="btn" id="okBtn" style="margin-top:9px;width:100%">更新点卯</button>';
  // 孩子的口子：觉得这项太难，可以直接说出来
  h+='<button class="addrow" style="margin-top:9px;" onclick="markTooHard(\''+taskId+'\')">🤔 这项对我来说太难了</button>';

  openSheet(h,(sheet)=>{
    let picked = r.type||null;
    $$(".opt",sheet).forEach(b=>b.onclick=()=>{
      picked=b.dataset.k;
      $$(".opt",sheet).forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
    });
    const ok=$("#okBtn",sheet);
    const commit=()=>{
      if(!picked){ toast("先选一下今日战况"); return; }
      const mins=parseInt(($("#actMin",sheet)||{}).value||"0",10)||0;
      const before=dayIsComplete(dateStr);
      const storyBefore=storyChapterRaw();
      const meritBefore=totalMerit();
      const level = picked==="full"?1 : (picked==="half"||picked==="poor")?0.5 : 0;
      if(!commitEconomy(()=>{ setRec(dateStr,taskId,level,picked,mins); return {ok:true}; })) return;
      const after=dayIsComplete(dateStr);
      const storyAfter=storyChapterRaw();
      const beatenBefore=bossBeaten(dateStr);
      // 飘字：从被点的那个选项位置飞出来，让反馈有实体
      const anchor=$$(".opt",sheet).filter(b=>b.classList.contains("sel"))[0]||sheet;
      const meritDelta=round1(totalMerit()-meritBefore);
      if(meritDelta!==0) floatFromEl(anchor,"军功 "+(meritDelta>0?"+":"")+meritDelta,true);
      else if(picked==="skip") floatFromEl(anchor,"🏳️",false);
      else floatFromEl(anchor,"已记录 · 军功未变",false);
      calcAchievements(); if(!save()) return; closeSheet(); refreshTop(); render();
      if(picked==="half") toast("苦战也算数，这份力没有白费 ◑");
      else if(picked==="poor") toast("惨胜也是胜，先把旗子插上 ◐");
      else if(picked==="full") toast("好，完胜一场 ⭐");
      else if(picked==="skip") toast("免战牌已挂，顺延到本周之后 🏳️");
      if(!before && after && !beatenBefore){
        confetti(60);
        const csNow=currentStreak();
        toast(csNow>=3
          ? ("🎉 军令齐备，招贤令 +1！连战 "+csNow+" 天 · "+streakName(csNow)+" ×"+streakMult(csNow))
          : "🎉 军令齐备，招贤令 +1！",2800);
      }
      // 攒够全勤天数，主线往前推一回 —— 晚一点弹，别把上一条盖掉
      if(storyAfter>storyBefore){
        const chaps=ST.story.chapters||[];
        const idx=Math.min(storyAfter, chaps.length)-1;
        if(idx>=0) setTimeout(()=>{
          confetti(90);
          toast("📜 主线推进 · 第 "+cnNum(idx+1)+" 回\n「"+(chaps[idx]||"")+"」",3600);
        }, before&&after ? 600 : 2900);
      }
      // 日记本：每天第一次点卯后顺手问一句，排在所有提示之后，不点也不催
      if(dateStr===TODAY() && diaryNudgeDue()){
        const wait = storyAfter>storyBefore ? 7000 : (!before && after) ? 3200 : 2300;
        setTimeout(diaryNudge, wait);
      }
    };
    if(ok) ok.onclick=commit;
  });
}
function clearRec(taskId,dateStr){
  const L=ST.ledger[dateStr];
  if(isFrozen(dateStr) && L && L.settled){
    closeSheet(); toast("这一天的账已结算入账，不能再改动（只能补录最近 "+BACKFILL_DAYS+" 天）");
    return;
  }
  if(!commitEconomy(()=>{ setRec(dateStr,taskId,null,null); return {ok:true}; })) return;
  closeSheet(); refreshTop(); render(); toast("已撤销这天的点卯");
}

  h+='<div class="field"><label>常用长度</label><div class="chipsel" id="bLen">';
  for(const [n,l] of [[3,"3 天"],[7,"1 周"],[14,"2 周"],[30,"1 个月"],[60,"暑假 2 个月"]])
    h+='<button data-v="'+n+'">'+l+'</button>';
  h+='</div></div>';
  h+='<div class="grid2">';
  if(!isNew) h+='<button class="btn danger" onclick="delBreak(\''+b.id+'\')">删除</button>';
  h+='<button class="btn" id="bOk">'+(isNew?"开始休整":"保存")+'</button></div>';
  openSheet(h,(sheet)=>{
    $$("#bReason button",sheet).forEach(x=>x.onclick=()=>{ $$("#bReason button",sheet).forEach(y=>y.classList.remove("on")); x.classList.add("on"); });
    $$("#bLen button",sheet).forEach(x=>x.onclick=()=>{
      const n=parseInt(x.dataset.v,10);
      $("#bFrom",sheet).value=TODAY();
      $("#bTo",sheet).value=addD(TODAY(),n-1);
      $$("#bLen button",sheet).forEach(y=>y.classList.remove("on")); x.classList.add("on");
    });
    $("#bOk",sheet).onclick=()=>{
      const from=$("#bFrom",sheet).value.trim(), to=$("#bTo",sheet).value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)){ toast("日期格式要对，例 2026-10-12"); return; }
      if(to < from){ toast("结束日不能早于开始日"); return; }
      const reason=$("#bReason button.on",sheet).dataset.v;
      settleLedger();
      if(isNew) ST.breaks.push({ id:uid(), from, to, reason });
      else Object.assign(ST.breaks.find(x=>x.id===id), { from, to, reason });
      if(!save()) return; closeSheet(); refreshTop(); render();
      toast(isNew ? ("已进入休整 · 到 "+fmtMD(to)) : "已保存");
    };
  });
}
function delBreak(id){
  if(!needParent(()=>delBreak(id))) return;
  const b=(ST.breaks||[]).find(x=>x.id===id); if(!b) return;
  if(!confirm("删除这段休整期（"+b.from+" ~ "+b.to+"）？")) return;
  ST.breaks=ST.breaks.filter(x=>x.id!==id);
  for(const d in ST.ledger){ if(ST.ledger[d].rest) delete ST.ledger[d]; }   // 让这段重新结算
  settleLedger();
  if(!save()) return; closeSheet(); refreshTop(); render();
  toast("已删除");
}

function attackBoss(){
  const d=TODAY();
  if(!dayIsComplete(d)){ toast("军令未了，不可出战！"); return; }
  if(bossBeaten(d)){ toast("今日劲敌已破"); return; }
  const result=commitEconomy(()=>{
    ST.bossDefeats[d]=true;
    const p=pickPrize();

  calcAchievements(); save(); refreshTop();

    + '<h3 style="text-align:center;margin-top:8px;">破了 '+esc(B.name)+'！</h3>'
    + '<div class="sh-sub" style="text-align:center;">'+esc(B.place)+' 一战，' + esc(B.name) + ' 已退</div>';
  h+='<div class="result-box t-legend"><div class="re">🎟️🎟️</div><div class="rn">招贤令 ×2'+(bossMeritOn(d)?' · 军功 +'+bossMeritOn(d):'')+'</div><div class="rt">战利品已入锦囊匣</div>'

}

function openDraw(){
  if(ticketsAvail()<1){ toast("还没有招贤令——今日军令齐备就能得一枚 🎟️"); return; }
  const owned=heroOwnedCount(), tot=heroTotal();
  const left=pityLeft();
  let h='<h3>招贤榜</h3><div class="sh-sub">耗 🎟️ × 1 · 榜上名将 ' + owned + ' / ' + tot + ' 已入麾下<br>有缘者得名将卡，余者得锦囊</div>';
  h+='<div class="pity" style="margin-bottom:12px;">'
   + '<div class="pt"><span class="pl">'+(left<=0?"🎉 这一榜必出神将！":"再揭 "+left+" 次必出神将")+'</span>'
   + '<span style="color:var(--ink-3)">'+(PITY-left)+' / '+PITY+'</span></div>'
   + '<div class="prog mini"><i style="width:'+Math.round((PITY-left)/PITY*100)+'%"></i></div></div>';
  const o=drawOdds();
  h+='<div class="quote" style="margin-bottom:10px;font-size:11.5px;">本次出率：神将 '+o.legend+'% · 名将 '+o.rare+'% · 良将 '+o.common+'% · 锦囊 '+o.prize+'%<br>'
   + '（按你当前图鉴算的，还没抽出过的会更常见；保底那一榜不计在内）</div>';
  h+='<div class="draw-stage" id="ds"><div class="draw-roll" id="dr">📜</div></div>'
      + '<button class="btn gold" style="width:100%;margin-top:6px;" id="drawBtn">✨ 揭榜</button>'
      + '<div id="drawResult"></div>';
  openSheet(h,(sheet)=>{
    let opened=false;
    $("#drawBtn",sheet).onclick=()=>{
      if(opened) return;
      const res=drawOnce();
      if(!res) return;
      opened=true;
      const dr=$("#dr",sheet);
      dr.classList.add("opened");
      const db=$("#drawBtn",sheet);
      db.disabled=true; db.textContent="揭榜中…";
      setTimeout(()=>{
        calcAchievements(); save(); refreshTop();
        let box='', extra='';
        if(res.kind==="hero"){
          const hh=res.hero, T=HERO_TIER_NAME[hh.tier];
          const cls = HERO_TIER_BOX[hh.tier];
          confetti(hh.tier==="legend"?150:hh.tier==="rare"?100:60);
          box='<div class="result-box '+cls+'">'
            + '<div class="re"><span class="hero-badge '+(HERO_FACTION_CLS[hh.f]||'b-han')+'" style="width:56px;height:56px;font-size:28px;border-radius:14px;">'+esc(hh.s)+'</span></div>'
            + '<div class="rn">'+esc(hh.n)+'</div>'
            + '<div class="rt">'+hh.f+' · '+T+' · 等级 '+hh.g+'</div>'
            + '<div class="rc">已录入武将图鉴</div></div>';
          extra='<div class="quote" style="margin-top:12px;">'+esc(hh.d)+'</div>';
          if(res.forced) extra+='<div class="quote" style="margin-top:9px;">🎯 保底触发！连揭 '+PITY+' 榜未遇神将，此番必得。</div>';
        }else if(res.kind==="dup"){
          confetti(res.forced?150:40);
          const isL = res.hero.tier==="legend";
          const seen = ST.heroCount[res.hero.n]||2;
          const starTxt = '★'.repeat(Math.min(seen,5)) + (seen>5?' ×'+seen:'');
          box='<div class="result-box '+(isL?"t-legend":"t-normal")+'">'
            + '<div class="re"><span class="hero-badge '+(HERO_FACTION_CLS[res.hero.f]||'b-han')+'" style="width:56px;height:56px;font-size:28px;border-radius:14px;">'+esc(res.hero.s)+'</span></div>'
            + '<div class="rn">'+esc(res.hero.n)+'</div>'
            + '<div class="rt">'+res.hero.f+' · 等级 '+res.hero.g+' · 已在麾下</div>'
            + (seen>=2?('<div class="rc" style="color:#B8860B;font-weight:800;letter-spacing:2px;">'+starTxt+'</div>'):'')
            + '<div class="rc">相遇 '+seen+' 次</div></div>';
          extra = seen>=5
            ? '<div class="quote" style="margin-top:12px;">满星了 —— '+esc(res.hero.n)+' 与你格外有缘。</div>'
            : '<div class="quote" style="margin-top:12px;">旧将重逢，也是缘分 —— '+esc(res.hero.n)+' 升至 '+starTxt+'。</div>';
          if(res.forced) extra = '<div class="quote" style="margin-top:12px;">🎯 保底触发！神将重逢，再添一颗星。</div>' + extra;
        }else{
          const p=res.prize;
          const T=TIERS[p.tier]||TIERS.common;
          confetti(p&&p.tier==="legend"?130:70);
          box='<div class="result-box '+T.cls+'">'
            + '<div class="re">'+(p?p.emoji:"🎁")+'</div>'
            + '<div class="rn">'+(p?esc(p.name):"空榜")+'</div>'
            + '<div class="rt">'+(p?T.name:"再来一次吧")+'</div>'
            + (p?'<div class="rc">存入锦囊匣 · 攒够 ⭐'+p.merit+' 军功可开</div>':'')+'</div>';
        }
        $("#drawResult",sheet).innerHTML = box + extra
          + '<div class="grid2" style="margin-top:12px;">'
          + '<button class="btn ghost" onclick="closeSheet();">收好</button>'
          + '<button class="btn" onclick="closeSheet();openDraw();">再揭一次 🎟️'+(ticketsAvail())+'</button>'
          + '</div>';
        // 集齐奖励：攒满一个阵营 / 集齐全套，当场给反馈
        const done=res.collection||[];
        if(done.length){
          save();
          done.forEach((d,i)=>{
            setTimeout(()=>{
              confetti(d.type==="all"?220:150);
              if(d.type==="faction"){
                toast("🏁 「"+d.f+"」名将 "+d.tot+" 位尽入麾下！", 4200);
              }else{
                toast("👑 160 位名将尽入麾下 · 获称号「"+ALL_DONE_TITLE+"」！", 5200);
              }
            }, 3600 + i*1200);
          });
        }
        db.style.display="none";
        $("#ds",sheet).style.display="none";
        render();
      },800);
    };
  });
}

/* =====================================================================
   视图：一周
   ===================================================================== */
function viewWeek(){
  const base=weekStart(VIEW_DATE);
  const days=weekDates(base);
  let h='<div class="card">';
  h+='<div class="card-head"><h3>一周军令</h3><span class="hint">'+fmtMD(days[0])+' — '+fmtMD(days[6])+'</span></div>';
  h+='<div class="weeknav">'
   + '<button class="btn ghost sm" onclick="shiftWeek(-1)">← 上一周</button>'
   + '<span class="wk">'+(base===weekStart(TODAY())?"本周":fmtMD(days[0])+" 那周")+'</span>'
   + '<button class="btn ghost sm" onclick="shiftWeek(1)">下一周 →</button>'
   + '</div>';
  h+='<div class="scroll-x"><div class="wgrid">';
  for(const d of days){
    const wd=parseD(d).getDay();
    const list=dayExpected(d);
    h+='<div class="wcol'+(d===TODAY()?" today":"")+'">'
     + '<div class="wh">'+WDX[wd]+'<br><span style="font-size:10px;color:var(--ink-3);font-weight:600">'+parseD(d).getDate()+'</span></div>';
    if(!list.length){
      h+='<div class="wrest">🍵 休整</div>';
    }else{
      for(const t of list){
        const r=rec(d,t.id);
        const S=SUBJECTS[t.subject]||SUBJECTS.other;
        const done=r&&r.level>=0.5;
        const lc = !r?"·":(r.type==="full"?"⭐":(r.type==="skip"?"🏳️":"◑"));
        h+='<div class="wchip'+(done?" done":"")+'" style="border-left-color:'+S.color+'" onclick="openCheck(\''+t.id+'\',\''+d+'\')" title="'+esc(t.name)+'">'
         + esc(t.name.slice(0,4))+'<span class="lc"> '+lc+'</span></div>';
      }
      for(const t of holidayTasks(d)) h+='<div class="wchip done" style="border-left-color:#B7D8C4;opacity:.75;">'+esc(t.name.slice(0,4))+'<span class="lc"> ✓</span></div>';
    }
    h+='</div>';
  }
  h+='</div></div>';
  let tot=0,done=0;
  for(const d of days){
    if(d>TODAY()) continue;
    const list=dayExpected(d); tot+=list.length;
    done+=list.filter(t=>{const r=rec(d,t.id);return r&&r.level>=0.5;}).length;
  }
  const pct=tot?Math.round(done/tot*100):0;
  h+='<div class="divider"></div>'
   + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px;">'
   + '<span>本周军令达成</span><span>'+pct+'%</span></div>'
   + '<div class="prog"><i style="width:'+pct+'%"></i></div>'
   + '<button class="btn jade" style="width:100%;margin-top:14px;" onclick="goReport()">去看本周军报 →</button>';
  h+='</div>';
  return h;
}
function shiftWeek(n){ VIEW_DATE=addD(weekStart(VIEW_DATE),n*7); render(); }
function goReport(){ VIEW="report"; VIEW_DATE=TODAY(); render(); }

       + '<span class="ce">'+c.emoji+'</span>'
       + '<span class="cb"><span class="ct">'+esc(c.name)+'</span>'

       + '<span style="font-size:15px;color:var(--ok);font-weight:700;">✓</span>'

   + '<span class="hint">已招募 '+heroOwnedCount()+' / '+heroTotal()+(ST.allDone?(' · '+ALL_DONE_TITLE):'')+'</span></div>';
  for(const fac of FACTION_ORDER){

       + '</div>';

    h+='</div>';

function saveVaultItem(uidv,name,emoji,merit){
  const v=ST.vault.find(x=>x.uid===uidv); if(!v) return false;
  if(v.redeemed){ toast("已经开启的锦囊不能改"); return false; }
  const cost=moneyNumber(merit);
  if(!name){ toast("先给它起个名字"); return false; }
  if(!validPrizeCost(cost)){ toast("开启门槛必须是大于0的有效军功数"); return false; }
  const df=diffText(v,{name,merit:cost},[["name","名称"],["merit","门槛"]]);
  v.name=name; v.emoji=emoji||"🎁"; v.merit=cost; delete v.meritInvalid;
  if(df) logChange("锦囊匣里的「"+name+"」："+df);
  return !!save();
}
function deleteVaultItem(uidv){
  const v=ST.vault.find(x=>x.uid===uidv); if(!v) return false;
  if(v.redeemed){ toast("已经开启的锦囊不能删，账目已经结过"); return false; }
  ST.vault=ST.vault.filter(x=>x.uid!==uidv);
  logChange("从锦囊匣删掉「"+v.name+"」");
  return !!save();
}

function redeem(u){
  const v=ST.vault.find(x=>x.uid===u); if(!v) return;
  // 纵深防御：界面已经把「已开启」分到另一区了，这里再挡一道。
  // 否则万一有别的路径调到这里，会重复扣军功、重复发兑现券。
  if(v.redeemed){ toast("这个锦囊已经开启了"); return; }
  if(!validPrizeCost(v.merit)){ toast("这个锦囊的军功门槛异常，未扣星星，请先核查奖励设置",4200); return; }
  const cost=moneyNumber(v.merit), av=availMerit();
  if(!Number.isFinite(av) || av<cost){ toast("还差 "+round1(cost-av)+" 军功"); return; }
  const c=commitEconomy(()=>{
    v.redeemed=true; v.redeemedAt=TODAY();
    v.paidMerit=cost;                 // 记录当时实付，模板改价不能追溯改写支出
    return couponFor(v);
  });
  if(!c) return;
  refreshTop(); render(); confetti(90);
  openSheet(
    '<div class="ceremony-hero"><span class="ce">'+c.emoji+'</span>'
    + '<div class="cn">'+esc(c.name)+'</div></div>'
    + '<div class="sh-sub" style="text-align:center;margin-top:8px;">锦囊已开 · 兑现券 No.'+String(c.id).slice(-4).toUpperCase()+'</div>'
    + '<div class="quote" style="margin-top:12px;text-align:center;">这张券还在等兑现。<br>找大人约个时间，兑现之后由大人点「已兑现」。</div>'
    + '<button class="btn" style="width:100%;margin-top:14px;" onclick="closeSheet();">知道了</button>'
  );
}
function openSwap(){
  const un=ST.vault.filter(v=>!v.redeemed);
  const costs=[...new Set(un.map(v=>v.merit))];
  if(costs.length<2){ toast("目前锦囊都在同一档，无需互换"); return; }
  let h='<h3>🔁 互换锦囊</h3><div class="sh-sub">只有相同军功门槛的锦囊之间可以互换</div>';
  const groups={};
  for(const v of un){ (groups[v.merit]=groups[v.merit]||[]).push(v); }
  h+='<div class="field"><label>要换出去的</label><select id="swFrom">';
  for(const c of costs) for(const v of groups[c]) h+='<option value="'+v.uid+'">'+v.emoji+' '+esc(v.name)+'（⭐'+c+'）</option>';
  h+='</select></div>';
  h+='<div class="field"><label>换成（同门槛）</label><select id="swTo"></select></div>';
  h+='<div class="grid2"><button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" id="swOk">确认互换</button></div>';
  openSheet(h,(sheet)=>{
    const from=$("#swFrom",sheet), to=$("#swTo",sheet);
    const sync=()=>{
      const v=ST.vault.find(x=>x.uid===from.value);
      to.innerHTML = groups[v.merit].filter(x=>x.uid!==from.value)
        .map(x=>'<option value="'+x.uid+'">'+x.emoji+' '+esc(x.name)+'</option>').join("") || '<option value="">（同门槛没有别的锦囊了）</option>';
    };
    from.onchange=sync; sync();
    $("#swOk",sheet).onclick=()=>{
      const a=ST.vault.find(x=>x.uid===from.value);
      const b=ST.vault.find(x=>x.uid===to.value);
      if(!a||!b){ toast("同门槛没有可换的锦囊"); return; }
      const tmp={name:a.name,emoji:a.emoji,tier:a.tier,merit:a.merit,from:a.from};
      a.name=b.name; a.emoji=b.emoji; a.tier=b.tier; a.merit=b.merit; a.from=b.from;
      b.name=tmp.name; b.emoji=tmp.emoji; b.tier=tmp.tier; b.merit=tmp.merit; b.from=tmp.from;
      if(!save()) return; closeSheet(); render(); toast("已互换 ✓");
    };
  });
}

      const r=rec(d,t.id);
      if(r&&r.level>=0.5) done++;

        if(r.type==="full") full++;
        else if(r.type==="half") half++;
        else if(r.type==="poor") poor++;
        else if(r.type==="miss") miss++;

      const pp=perTask[t.id]=perTask[t.id]||{name:t.name,plan:0,act:0};

function viewReportChanges(){
  return '<div class="card"><div class="card-head"><h3>📜 改动记录</h3></div>'
    + '<div style="font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:8px;">谁动过军令、锦囊、兑现，都记在这里。⚠️ 表示当时还没设家长密码。</div>'
    + changeLogHTML(30) + '</div>';
}
function viewReport(){
  const base=weekStart(VIEW_DATE);
  const days=weekDates(base);
  let tot=0,done=0,full=0,half=0,poor=0,miss=0,minutes=0;
  let restDays=0;
  for(const d of days){
    if(d>TODAY()) continue;
    if(isRestDay(d)){ restDays++; continue; }      // 休整日不算进分母
    const list=dayExpected(d); tot+=list.length;
    for(const t of list){
      const r=rec(d,t.id);
      if(r&&r.level>=0.5) done++;
      if(r){
        if(r.type==="full") full++;
        else if(r.type==="half") half++;
        else if(r.type==="poor") poor++;
        else if(r.type==="miss") miss++;
        minutes+=r.minutes||0;
      }
    }
  }
  let ws=0; for(const d of days) ws+=dayMerit(d);
  const pct=tot?Math.round(done/tot*100):0;

  let h='<div class="card">';
  h+='<div class="card-head"><h3>本周军报</h3><span class="hint">'+(base===weekStart(TODAY())?"本周":fmtMD(days[0]))+'</span></div>';
  h+='<div class="weeknav">'
   + '<button class="btn ghost sm" onclick="shiftWeek(-1)">← 上一周</button>'
   + '<span class="wk">'+fmtMD(days[0])+' — '+fmtMD(days[6])+'</span>'
   + '<button class="btn ghost sm" onclick="shiftWeek(1)">下一周 →</button></div>';
  if(restDays) h+='<div class="holiday-row">🍵 本周有 '+restDays+' 天在休整，已从统计里剔除</div>';
  h+='<div class="report-stat">'
   + '<div class="rs-box"><div class="v">'+pct+'%</div><div class="l">军令达成</div></div>'
   + '<div class="rs-box"><div class="v">'+round1(ws)+'</div><div class="l">所得军功</div></div>'
   + '<div class="rs-box"><div class="v">'+full+'</div><div class="l">完胜</div></div>'
   + '<div class="rs-box"><div class="v">'+(half+poor)+'</div><div class="l">苦战/惨胜</div></div>'
   + '<div class="rs-box"><div class="v">'+minutes+'</div><div class="l">用功分钟</div></div>'
   + '<div class="rs-box"><div class="v">'+done+'/'+tot+'</div><div class="l">完成/总项</div></div>'
   + '</div>';

  // ===== 主动性：这套系统真正该看的数字 =====
  (function(){
    const sig=signalsBetween(days[0], days[6]);
    h+='<div class="divider"></div>';
    h+='<div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px;">'
     + '<span style="font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ok);line-height:1;">'+sig.length+'</span>'
     + '<span style="font-size:12.5px;font-weight:700;color:var(--ink-2);">本周孩子主动做的事</span></div>';
    if(!sig.length){
      h+='<div style="font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.75;">'
       + '这一周还没有。完成率可以靠推，主动推不出来 ——<br>'
       + '所以这个数字比上面那个百分比更值得留意。</div>';
    }else{
      h+='<div class="actlist">';
      for(const s of sig.slice(-12).reverse()){
        const icon = s.kind==="extra" ? "✋" : s.kind==="add_task" ? "➕" : s.kind==="too_hard" ? "🤔" : "❤️";
        h+='<div class="actrow"><span class="ae">'+icon+'</span>'
         + '<span class="an">'+esc(SIGNAL_NAME[s.kind]||"主动")+(s.detail?('：'+esc(s.detail)):'')+'</span>'
         + '<span class="ad">'+s.date.slice(5)+'</span></div>';
      }
      h+='</div>';
    }
  })();

  // ===== 调整建议：只有「推」没有「退」，孩子会一直在失败里泡着 =====
  if(base===weekStart(TODAY())){
    const hints=difficultyHints();
    if(hints.length){
      h+='<div class="divider"></div>';
      h+='<div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;">⚖️ 调整建议</div>';
      for(const x of hints){
        h+='<div class="hintcard '+x.tone+'">'
         + '<span class="hi">'+(x.tone==="warn"?"⚠️":"⏱")+'</span>'
         + '<span class="hb"><span class="ht">'+esc(x.title)+'</span>'
         + '<span class="hd">'+esc(x.body)+'</span>'
         + '<span class="ha"><button class="btn ghost sm" onclick="applyHint(\''+x.taskId+'\',\''+x.kind+'\')">'+esc(x.action)+'</button></span>'
         + '</span></div>';
      }
      h+='<div style="font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.7;margin-top:4px;">'
       + '任务做不完，多数时候是任务的问题，不是孩子的问题。</div>';
    }
  }

  const rows=[], reportTasks=new Map(), reportEnd=days[6]<TODAY()?days[6]:TODAY();
  for(const date of days){
    if(date>reportEnd || isRestDay(date)) continue;
    for(const t of taskRulesForDate(date)) if(!t.archived&&taskActiveOn(t,date)) reportTasks.set(t.id,t);
  }
  for(const t of reportTasks.values()){
    let target=0,dn=0;
    if(t.type==="flex"){ target=Math.max(1,t.weekTarget||1); dn=Math.min(weekDone(t.id,reportEnd),target); }
    else{
      for(const date of days){
        if(date>reportEnd || isRestDay(date)) continue;
        const rule=taskRulesForDate(date).find(x=>x.id===t.id);
        if(!rule || rule.archived || !taskActiveOn(rule,date)) continue;
        const appear=rule.type==="daily" || (rule.type==="fixed"&&(rule.weekdays||[]).includes(parseD(date).getDay()));
        if(!appear) continue;
        target++; if((rec(date,t.id)||{level:0}).level>=0.5) dn++;
      }
    }
    if(!target) continue;
    rows.push({name:t.name,emoji:t.emoji||SUBJECTS[t.subject].icon,target,dn,color:SUBJECTS[t.subject].color});
  }
  if(rows.length){
    h+='<div class="divider"></div><div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;">各项军令达成情况</div>';
    for(const r of rows){
      const p=Math.round(r.dn/r.target*100);
      const ok=p>=100;
      h+='<div style="margin-bottom:10px;">'
       + '<div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;">'
       + '<span>'+r.emoji+' '+esc(r.name)+'</span><span style="color:'+(ok?"var(--ok)":"var(--ink-3)")+'">'+r.dn+'/'+r.target+(ok?" ✓":"")+'</span></div>'
       + '<div class="prog mini"><i style="width:'+p+'%;background:'+r.color+'"></i></div></div>';
    }
  }

  const rep = ST.reports[base]||{good:"",improve:"",plan:""};
  h+='<div class="divider"></div>';
  h+='<div class="quote" style="margin-bottom:12px;">复盘之要，在少说教、多听孩子说。改进目标写一句他听得懂、够得着的短句就够了。</div>';
  h+='<div class="field"><label>🏅 这周做得好的地方</label><textarea id="rGood" placeholder="例：英语阅读提前两天完成，自己发现的">'+esc(rep.good)+'</textarea></div>';
  h+='<div class="field"><label>🔧 需要改进之处</label><textarea id="rImprove" placeholder="例：磨耳朵容易拖延">'+esc(rep.improve)+'</textarea></div>';
  h+='<div class="field"><label>🎯 下周方略</label><textarea id="rPlan" placeholder="例：磨耳朵的功夫用在平时">'+esc(rep.plan)+'</textarea></div>';
  h+='<button class="btn jade" style="width:100%;" onclick="saveReport(\''+base+'\')">存下这份军报</button>';
  h+='</div>';

  const keys=Object.keys(ST.reports).sort().reverse();
  if(keys.length){
    h+='<div class="card"><div class="card-head"><h3>往期军报</h3><span class="hint">'+keys.length+' 份</span></div>';
    for(const k of keys.slice(0,26)){
      const r=ST.reports[k];
      h+='<div class="hist-item"><div class="hh"><span>'+fmtMD(k)+' 那周</span><span style="color:var(--ink-3);font-weight:600;">'+((r.pct!=null)?r.pct+"%":"")+'</span></div>';
      if(r.good) h+='<div class="hl">🏅 '+esc(r.good)+'</div>';
      if(r.improve) h+='<div class="hl">🔧 '+esc(r.improve)+'</div>';
      if(r.plan) h+='<div class="hl">🎯 '+esc(r.plan)+'</div>';
      h+='</div>';
    }
    h+='</div>';
  }
  h+=viewReportChanges();
  return h;
}
function saveReport(base){
  const g=$("#rGood").value.trim(), i=$("#rImprove").value.trim(), p=$("#rPlan").value.trim();
  const days=weekDates(base);
  let tot=0,done=0;
  for(const d of days){
    if(d>TODAY()) continue;
    const list=dayExpected(d); tot+=list.length;
    done+=list.filter(t=>{const r=rec(d,t.id);return r&&r.level>=0.5;}).length;
  }
  ST.reports[base]={good:g,improve:i,plan:p,savedAt:TODAY(),pct:tot?Math.round(done/tot*100):0};
  calcAchievements(); if(!save()) return; render(); toast("军报已存 ✓");
}

function downloadBackup(json,fname){

    return true;
  }catch(e){ return false; }

function dyDefault(){ return {v:1, intro:false, lock:null, entries:{}, promptDay:{}, nudged:""}; }
function dyColor(c){ return typeof c==="string" && /^#[0-9A-Fa-f]{6}$/.test(c) ? c : null; }
function dyStr(s,max){ return typeof s==="string" ? s.slice(0,max) : ""; }
// 单条坏数据只丢那一条，不让整本日记打不开
// 旧版（2.4.0）的「提示题回答 + 悄悄话」→ 一段正文。只在没有 text 字段时用
function dyLegacyText(e){
  const parts=[];
  if(Array.isArray(e.answers)) for(const a of e.answers){
    if(!a || typeof a!=="object") continue;
    const P=DY_PROMPT_BY_ID[a.id];
    const ans=[dyStr(a.pick,100), dyStr(a.text,500)].filter(s=>s.trim()).join("，");
    if(!ans) continue;
    parts.push(P ? (P.q+"\n"+ans) : ans);
  }
  const note=dyStr(e.note,2000);
  if(note.trim()) parts.push(note);
  return parts.join("\n\n");
}
function dyCleanEntry(e){
  if(!e || typeof e!=="object" || Array.isArray(e)) return null;
  const text = typeof e.text==="string" ? e.text : dyLegacyText(e);
  const out={face:"", weather:"", colors:{}, text:text.slice(0,DY_TEXT_MAX), at:Number(e.at)||0, upd:Number(e.upd)||0};
  if(DY_FACES.some(f=>f.k===e.face)) out.face=e.face;
  if(DY_WEATHER.some(f=>f.k===e.weather)) out.weather=e.weather;
  if(e.colors && typeof e.colors==="object") for(const p of DY_PARTS){ const c=dyColor(e.colors[p.k]); if(c) out.colors[p.k]=c; }
  return out;
}
function dyClean(o){
  const d=dyDefault();
  if(!o || typeof o!=="object" || Array.isArray(o)) return d;
  d.intro=!!o.intro;
  if(o.lock && typeof o.lock.salt==="string" && typeof o.lock.h==="string") d.lock={salt:o.lock.salt, h:o.lock.h};
  if(o.entries && typeof o.entries==="object"){
    for(const k of Object.keys(o.entries)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      const e=dyCleanEntry(o.entries[k]);
      if(e && dyHasContent(e)) d.entries[k]=e;
    }
  }
  if(o.promptDay && typeof o.promptDay==="object"){
    for(const k of Object.keys(o.promptDay)){
      if(/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(o.promptDay[k])) d.promptDay[k]=o.promptDay[k].filter(id=>DY_STARTER_BY_ID[id]).slice(0,3);
    }
  }
  d.nudged=typeof o.nudged==="string" ? o.nudged : "";
  return d;
}
function dyHasContent(e){
  return !!(e && (e.face || e.weather || Object.keys(e.colors||{}).length || (e.text||"").trim()));
}
function dyWeather(k){ return DY_WEATHER.find(x=>x.k===k)||null; }
function dyFirstLine(e){

function diaryDrafts(){

        }

function diaryKeepDraft(r){

function diaryScrubSheet(sheet){
  sheet.querySelectorAll("input,textarea,.dy-page-t").forEach(el=>{
    el.oninput=null; el.onblur=null;
    if("value" in el) el.value="";
    el.textContent="";
    if(document.activeElement===el) el.blur();
  });
  sheet.textContent="";
}
function diaryRelock(){
  try{
    if(DY_HIDE) DY_HIDE();
  }finally{
    const sheet=$(".sheet");
    if(sheet && sheet.querySelector("#dyText, .dy-page, #dyL1")){
      diaryScrubSheet(sheet);
      const mask=sheet.closest(".mask"); if(mask) mask.remove();
      document.body.style.overflow="";
    }
    DY_OPEN=false;
  }
}
function diarySuspend(){
  DY_PRIVATE=true;
  diaryRelock();
  if(VIEW==="diary") render();
}
window.addEventListener("pagehide",diarySuspend);
window.addEventListener("beforeunload",e=>{
  if(DY_FLUSH && DY_FLUSH()===false){ e.preventDefault(); e.returnValue=""; }
});
function dyEntry(d){ diaryLoad(); return DY.entries[d]||null; }

// 每天 3 个「开头的话」：心情重的给两个「说出来」的；昨天出过的今天不再出
function dyHash(s){ let h=7; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function diaryStarters(dateStr, face){
  diaryLoad();
  const used=new Set(DY.promptDay[addD(dateStr,-1)]||[]);
  const out=[];
  const take=(c,salt)=>{
    const all=DY_STARTERS.filter(p=>p.c===c && !out.includes(p));
    const fresh=all.filter(p=>!used.has(p.id));
    const list=fresh.length?fresh:all;
    out.push(list[dyHash(dateStr+salt)%list.length]);
  };
  const main = DY_HEAVY.includes(face) ? "heavy" : "good";
  take(main,"a"); take(main,"b"); take("small","c");
  return out;
}

// 翻日记：上面切月份，下面「一篇篇」或「月历」
function diaryBrowseHTML(){
  const [Y,M]=DY_MONTH.split("-").map(Number);
  const days=new Date(Y,M,0).getDate();
  const T=TODAY();
  const prev=addD(DY_MONTH+"-01",-1).slice(0,7), next=addD(DY_MONTH+"-"+pad(days),1).slice(0,7);
  const keys=Object.keys(DY.entries).filter(k=>k.slice(0,7)===DY_MONTH).sort().reverse();
  let h='<div class="card"><div class="card-head"><h3>翻日记</h3><div class="chipsel" id="dyShow">'
    + '<button type="button" class="'+(DY_SHOW==="list"?"on":"")+'" onclick="diaryShow(\'list\')">一篇篇</button>'
    + '<button type="button" class="'+(DY_SHOW==="cal"?"on":"")+'" onclick="diaryShow(\'cal\')">月历</button></div></div>'
    + '<div class="weeknav"><button class="btn ghost sm" onclick="diaryMonth(\''+prev+'\')">‹</button>'
    + '<span class="wk">'+Y+' 年 '+M+' 月</span>'
    + '<button class="btn ghost sm" onclick="diaryMonth(\''+next+'\')"'+(next>T.slice(0,7)?" disabled":"")+'>›</button></div>';
  if(DY_SHOW==="cal"){
    const lead=(new Date(Y,M-1,1).getDay()+6)%7;
    let g='<div class="dy-grid">';
    for(const w of ["一","二","三","四","五","六","日"]) g+='<div class="dy-wd">'+w+'</div>';
    for(let i=0;i<lead;i++) g+='<div></div>';
    for(let d=1;d<=days;d++){
      const ds_=Y+"-"+pad(M)+"-"+pad(d);
      const e=dyEntry(ds_);
      if(e) g+='<button class="dy-day has" onclick="showDiaryEntry(\''+ds_+'\')">'+zhugeSVG(e,34)+'<span>'+d+'</span></button>';
      else g+='<div class="dy-day'+(ds_>T?" fut":"")+(ds_===T?" today":"")+'"><i></i><span>'+d+'</span></div>';
    }
    h+=g+'</div>';
  }else if(keys.length){
    h+='<div class="dy-list">';
    for(const k of keys){
      const e=DY.entries[k], first=dyFirstLine(e), w=dyWeather(e.weather);
      h+='<button class="dy-item" onclick="showDiaryEntry(\''+k+'\')">'+zhugeSVG(e,40)
        + '<div class="dy-item-b"><div class="dy-item-d">'+dyDateLine(k)+(w?(' · '+w.i+w.n):'')+(e.face?(' · '+dyFaceName(e.face)):'')+'</div>'
        + '<div class="dy-item-t">'+(first?esc(first):'<span style="color:var(--ink-3)">（只涂了军师）</span>')+'</div></div></button>';
    }
    h+='</div>';
  }
  h+='<p style="font-size:11.5px;color:var(--ink-3);margin:8px 0 0;text-align:center">'+(keys.length?('这个月写了 '+keys.length+' 篇'):'这个月还没有日记 · 空着的日子就空着，不用补')+'</p></div>';
  return h;
}
function diaryMonth(m){ if(m>TODAY().slice(0,7)) return; DY_MONTH=m; render(); }
function diaryIntroDone(wantLock){
  diaryLoad(); DY.intro=true; diarySave();
  render();
  if(wantLock) openDiaryLock();
}

/* ---- 写今天的：正文是主角，天气在上，表情和涂色放在后面（都可跳过） ---- */
function openDiaryWrite(){
  if(closeSheet()===false) return false;
  diaryLoad();
  try{ diaryAdopt(diaryReadLatest()); }catch(e){ DY_ERROR="本机日记暂时读不出来"; }
  if(DY_ERROR){ toast("日记文件需要检查，先不写入"); return false; }
  if(diaryLocked()){ VIEW="diary"; setTab(); render(); return false; }
  const pending=diaryDrafts();
  const recovered=DY_RESUME ? pending.find(r=>r.key===DY_RESUME) : pending.find(r=>r.date===TODAY());
  DY_RESUME="";
  const T=recovered ? recovered.date : TODAY();
  const old=dyEntry(T);
  const draft=recovered ? JSON.parse(JSON.stringify(recovered.draft)) : old ? JSON.parse(JSON.stringify(old)) : {face:"", weather:"", colors:{}, text:"", at:Date.now(), upd:0};
  const record=recovered || {key:DY_DRAFT_PREFIX+DY_DRAFT_OWNER+"_"+uid(),date:T,draft,base:JSON.stringify(old),lock:JSON.stringify(DY.lock)};
  record.draft=draft;
  // 恢复前已经按最新的锁验证身份，但同日正文基线不能随重开而重置。
  if(recovered) record.lock=JSON.stringify(DY.lock);
  let dirty=!!recovered, cur=DY_COLORS[0], timer=0;
  const startersHTML=()=>diaryStarters(T,draft.face).map(p=>'<button type="button" data-st="'+p.id+'">'+esc(p.s)+'…</button>').join("");
  const painted = draft.face || Object.keys(draft.colors).length;
  let h='<h3>'+dyDateLine(T)+'</h3><div class="sh-sub">想写多少写多少。写的时候会自动存下来。</div>';
  h+='<div class="field"><label>天气</label><div class="chipsel" id="dyWeather">'
    + DY_WEATHER.map(w=>'<button type="button" data-w="'+w.k+'" class="'+(draft.weather===w.k?"on":"")+'">'+w.i+' '+w.n+'</button>').join("")+'</div></div>';
  h+='<div class="field"><label>不知道写什么？点一句开头</label><div class="chipsel dy-st" id="dySt">'+startersHTML()+'</div></div>';
  h+='<div class="field"><textarea id="dyText" class="dy-paper" maxlength="'+DY_TEXT_MAX+'" placeholder="今天……">'+esc(draft.text)+'</textarea></div>';
  h+='<details class="dy-more"'+(painted?" open":"")+'><summary>🪶 给军师涂个心情（可以不涂）</summary>'
    + '<div class="field" style="margin-top:10px"><label>军师今天是什么脸？</label><div class="chipsel" id="dyFaces">'
    + DY_FACES.map(f=>'<button type="button" data-f="'+f.k+'" class="'+(draft.face===f.k?"on":"")+'">'+f.n+'</button>').join("")+'</div>'
    + '<div id="dySay" class="quote" style="margin-top:8px;'+(draft.face?"":"display:none")+'">🪶 '+esc(dyFaceSay(draft.face))+'</div></div>'
    + '<div class="field"><label>你今天的心是什么颜色？</label>'
    + '<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">'
    + '<div id="dyFig" style="background:#F6EFE2;border-radius:var(--r-md);padding:6px">'+zhugeSVG(draft,150,true)+'</div>'
    + '<div style="flex:1;min-width:130px"><div class="dy-pal" id="dyPal">'+DY_COLORS.map((c,i)=>'<button type="button" class="dy-sw'+(i?"":" sel")+'" data-c="'+c+'" style="background:'+c+'" aria-label="颜色"></button>').join("")+'</div>'
    + '<p style="font-size:11.5px;color:var(--ink-3);margin:6px 0">先点颜色，再点军师的纶巾、脸、鹤氅、内衫、羽扇、鞋。</p>'
    + '<button type="button" class="btn ghost sm" id="dyClassic">原来的样子</button> <button type="button" class="btn ghost sm" id="dyWipe">擦掉</button></div></div></div>'
    + '</details>';
  h+='<p id="dySaveStatus" role="status">'+(recovered?"已恢复本机草稿，尚未存入日记本。":"草稿仅在本机兜底，不是设备外备份。")+'</p>';
  h+='<button class="btn ghost" id="dyReload" hidden>重读最新日记后重试（保留草稿）</button>';
  h+='<button class="btn" style="width:100%;margin-top:12px" id="dyDone">写好了</button>';

  return openSheet(h,(sheet)=>{
    const ta=$("#dyText",sheet), status=$("#dySaveStatus",sheet), reload=$("#dyReload",sheet);
    const capture=()=>{
      dirty=true; draft.text=ta.value.slice(0,DY_TEXT_MAX); draft.upd=Date.now();
      return diaryKeepDraft(record);
    };
    const failed=msg=>{
      const local=diaryKeepDraft(record);
      status.textContent=msg+"；"+(local?"草稿已在本机兜底，仍未存入日记本。":"草稿只在当前页面内存，请勿关页。")+"不是设备外备份。";
      reload.hidden=false; return false;
    };
    const persist=()=>{
      clearTimeout(timer); timer=0;
      const current=dyCleanEntry(Object.assign({},draft,{text:ta.value.slice(0,DY_TEXT_MAX)}));
      const saved=dyEntry(T);
      if(!dirty && JSON.stringify(current)===JSON.stringify(saved || {face:"",weather:"",colors:{},text:"",at:draft.at,upd:draft.upd})) return true;
      capture();
      try{
        const latest=diaryReadLatest();
        if(JSON.stringify(latest.data.lock)!==record.lock) return failed("日记锁已变化，请离开后重新解锁再恢复草稿");
        if(JSON.stringify(latest.data.entries[T]||null)!==record.base) return failed("这一天已改动，不能用旧草稿覆盖；请保留草稿并核对最新记录");
        if(latest.raw!==DY_LAST_RAW) return failed("另一个窗口已更新日记，需要重读最新内容");
      }catch(e){ return failed("本机日记暂时读不出来"); }
      const clean=dyCleanEntry(draft);
      if(dyHasContent(clean)) DY.entries[T]=clean; else delete DY.entries[T];
      DY.promptDay[T]=diaryStarters(T,draft.face).map(p=>p.id);
      for(const k of Object.keys(DY.promptDay)) if(k<addD(T,-7)) delete DY.promptDay[k];
      if(!diarySave()) return failed(DY_SAVE_ERROR);
      dirty=false; record.base=JSON.stringify(dyEntry(T));
      diaryDropDraft(record); reload.hidden=true; status.textContent="已存入本机日记本。";
      return true;
    };
    reload.onclick=()=>{
      capture();
      try{
        const latest=diaryReadLatest();
        if(JSON.stringify(latest.data.lock)!==record.lock){ failed("日记锁已变化，请离开后重新解锁再恢复草稿"); return; }
        if(JSON.stringify(latest.data.entries[T]||null)!==record.base){

  if(!latest.lock && !Object.keys(latest.entries).length) return undefined;
  return latest;
}
// importData 契约：返回新增篇数（幂等为 0）；失败必须抛错，本函数不负责主存档回滚。
// 所有合并先在独立对象完成，CAS 写入成功后才接纳内存，失败不留下日记半事务。
function diaryMergeImport(inc){
  if(inc===undefined || inc===null) return 0;
  if(typeof inc!=="object" || Array.isArray(inc)) throw new Error("备份日记格式不对");
  const latest=diaryReadLatest(), next=latest.data, before=JSON.stringify(next), o=dyClean(inc);
  let added=0;
  for(const k of Object.keys(o.entries)) if(!next.entries[k]){ next.entries[k]=o.entries[k]; added++; }
  if(!next.lock && o.lock) next.lock=o.lock;
  if(o.intro) next.intro=true;
  const raw=JSON.stringify(next);
  if(localStorage.getItem(DIARY_KEY)!==latest.raw) throw new Error("另一个窗口已更新日记，导入未完成，请重试");
  if(raw!==before) localStorage.setItem(DIARY_KEY,raw);
  else { diaryAdopt(latest); return added; }
  diaryAdopt({raw,data:next});
  return added;
}

/* ============ 远程设置包（v2.6.0） ============
   家长在自己手机上改好军令/锦囊 → 生成一段文字 → 微信发到孩子的 iPad → 粘贴导入。
   只含军令和锦囊门槛；不含星星、兑现、日记。按名字匹配；不在包里的军令只归档、不删历史；
   军令新增/改动从明天起生效，不追溯。整包校验，有一处不对就整包拒绝。 */
const PACK_PREFIX = "SZPK1:";
function packSum(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }
function packSig(body){ const k=familyPin().h; return packSum(k+"|"+body+"|"+k); }
function packEnc(s){ return btoa(unescape(encodeURIComponent(s))); }
function packDec(s){ return decodeURIComponent(escape(atob(s))); }
function packBuild(forName){
  const tasks=ST.tasks.filter(t=>!t.archived&&!t.pending).map(t=>({n:t.name,e:t.emoji||"",s:t.subject,y:t.type,m:t.planMin,w:t.weekTarget,d:t.weekdays||[],o:t.timeSlot||"any",b:t.boss?1:0}));
  const prizes=ST.prizes.map(p=>({n:p.name,e:p.emoji||"",t:p.tier,c:p.merit,w:p.weight}));
  const body=JSON.stringify({at:Date.now(),for:String(forName==null?ST.childName:forName).trim().slice(0,20),tasks,prizes});
  return PACK_PREFIX+packEnc(body)+"."+packSig(body);
}
// 解析并校验；返回 {ok,err,data}
function packParse(text){
  try{
    text=String(text||"").replace(/\s+/g,"");
    const i=text.indexOf(PACK_PREFIX); if(i<0) return {ok:false,err:"这不是设置包（要以 SZPK1: 开头）"};
    text=text.slice(i+PACK_PREFIX.length);
    const dot=text.lastIndexOf("."); if(dot<0) return {ok:false,err:"设置包不完整，可能没复制全"};
    const body=packDec(text.slice(0,dot)), sig=text.slice(dot+1);
    if(packSig(body)!==sig) return {ok:false,err:"校验没通过：可能没复制全，或被改过"};
    const o=JSON.parse(body);
    if(!stateObject(o)||!Array.isArray(o.tasks)||!Array.isArray(o.prizes)||!Number.isSafeInteger(o.at)||o.at<=0||o.at>Date.now()+86400000) return {ok:false,err:"设置包格式或时间不对"};
    if(!o.tasks.length||o.tasks.length>30||o.prizes.length>60) return {ok:false,err:"军令要 1～30 条，锦囊最多 60 个"};
    const tasks=[], prizes=[], seen=new Set();
    for(const x of o.tasks){
      const n=String(x&&x.n||"").trim();
      if(!stateObject(x)||!n||n.length>20||seen.has(n)) return {ok:false,err:"军令名字有问题（空、过长或重复）"};
      seen.add(n);
      const wd=Array.isArray(x.d)?x.d.filter(v=>Number.isInteger(v)&&v>=0&&v<=6):[];
      const t={name:n,emoji:String(x.e||"").slice(0,8),subject:x.s,type:x.y,planMin:Number(x.m),weekTarget:Number(x.w),weekdays:wd,timeSlot:x.o,boss:!!x.b};
      if(!Object.hasOwn(SUBJECTS,t.subject)||!["daily","flex","fixed"].includes(t.type)||!["morning","noon","evening","any"].includes(t.timeSlot)) return {ok:false,err:"军令「"+n+"」的设置不对"};
      if(!Number.isInteger(t.planMin)||t.planMin<1||t.planMin>300||!Number.isInteger(t.weekTarget)||t.weekTarget<1||t.weekTarget>21) return {ok:false,err:"军令「"+n+"」的时间或次数不对"};
      if(t.type==="fixed"&&!wd.length) return {ok:false,err:"军令「"+n+"」没选星期"};
      tasks.push(t);
    }
    const pn=new Set();
    for(const x of o.prizes){
      const n=String(x&&x.n||"").trim();
      if(!stateObject(x)||!n||n.length>30||pn.has(n)) return {ok:false,err:"锦囊名字有问题（空、过长或重复）"};
      pn.add(n);
      const p={name:n,emoji:String(x.e||"🎁").slice(0,8),tier:x.t,merit:moneyNumber(x.c),weight:Number(x.w)};
      if(!Object.hasOwn(TIERS,p.tier)||!validPrizeCost(p.merit)||!Number.isInteger(p.weight)||p.weight<0||p.weight>999) return {ok:false,err:"锦囊「"+n+"」的档位、门槛或权重不对"};
      prizes.push(p);
    }
    return {ok:true,data:{at:Number(o.at),forName:String(o.for||"").trim().slice(0,20),tasks,prizes}};
  }catch(e){ return {ok:false,err:"设置包读不出来，可能没复制全"}; }
}
// 对比当前设置，列出会发生的变化
function packDiff(d){
  const TF=[["planMin","分钟"],["type","安排",x=>({daily:"每日",flex:"灵活",fixed:"固定"})[x]||x],["weekTarget","每周次数"],["weekdays","星期",x=>(x||[]).map(v=>WDX[v]).join("")],["boss","硬仗",x=>x?"是":"否"],["subject","营地",x=>(SUBJECTS[x]||{}).place||x],["timeSlot","时段"]];
  const PF=[["merit","门槛"],["tier","档位",x=>(TIERS[x]||{}).name||x],["weight","权重"]];
  const L={addT:[],chgT:[],offT:[],addP:[],chgP:[],delP:[]};
  const cur=ST.tasks.filter(t=>!t.pending);
  for(const t of d.tasks){
    const o=cur.find(x=>x.name===t.name);
    if(!o||o.archived) L.addT.push(t.name);
    else { const df=diffText(o,t,TF); if(df) L.chgT.push(t.name+"："+df); }
  }
  for(const o of cur) if(!o.archived && !d.tasks.some(t=>t.name===o.name)) L.offT.push(o.name);
  for(const p of d.prizes){
    const o=ST.prizes.find(x=>x.name===p.name);
    if(!o) L.addP.push(p.name+"（门槛 "+p.merit+"）");
    else { const df=diffText(o,p,PF); if(df) L.chgP.push(p.name+"："+df); }
  }
  for(const o of ST.prizes) if(!d.prizes.some(p=>p.name===o.name)) L.delP.push(o.name);
  return L;
}
function packContent(d){
  return JSON.stringify({forName:d.forName||"",tasks:d.tasks.map(t=>[t.name,t.emoji,t.subject,t.type,t.planMin,t.weekTarget,t.weekdays,t.timeSlot,t.boss]),prizes:d.prizes.map(p=>[p.name,p.emoji,p.tier,p.merit,p.weight])});
}
function packCheck(d){
  if(!stateObject(d)||!Number.isSafeInteger(d.at)||d.at<=0||d.at>Date.now()+86400000||!Array.isArray(d.tasks)||!Array.isArray(d.prizes)) throw new Error("设置包格式或时间不对");
  for(const [list,label] of [[ST.tasks,"本机军令"],[ST.prizes,"本机锦囊"],[d.tasks,"包内军令"],[d.prizes,"包内锦囊"]]){
    const seen=new Set();
    for(const x of list){ const name=String(x.name||"").trim(); if(!name||seen.has(name)) throw new Error(label+"存在重名，无法安全按名字匹配"); seen.add(name); }
  }
  for(const t of d.tasks){
    const old=ST.tasks.find(x=>x.name.trim()===t.name.trim());
    if(old&&(old.archived||old.pending)) throw new Error("军令「"+t.name+"」已归档或待批准，不能用设置包自动恢复，请改名后重发");
  }
  const content=packContent(d);
  if((ST.packHistory||[]).includes(content)) throw new Error("相同内容的设置已经导入过了");
  return content;
}
function packApply(d){
  return commitState(()=>{
    const content=packCheck(d), L=packDiff(d), mism=!!d.forName&&d.forName!==String(ST.childName||"").trim();
    changeTaskRules(()=>{
      for(const t of d.tasks){
        const o=ST.tasks.find(x=>x.name.trim()===t.name.trim()&&!x.pending&&!x.archived);
        if(o) Object.assign(o,t);
        else ST.tasks.push(Object.assign({id:uid(),archived:false,approvedAt:addD(TODAY(),1)},t));
      }
      for(const o of ST.tasks) if(!o.archived&&!o.pending&&!d.tasks.some(t=>t.name===o.name)) o.archived=true;
    });
    for(const p of d.prizes){
      const o=ST.prizes.find(x=>x.name.trim()===p.name.trim());
      if(o) Object.assign(o,p); else ST.prizes.push(Object.assign({id:uid()},p));
    }
    ST.prizes=ST.prizes.filter(o=>d.prizes.some(p=>p.name===o.name));
    ST.packAt=d.at;
    if(!ST.packHistory) ST.packHistory=[];
    ST.packHistory.push(content);
    logChange("导入家长发来的设置包"+(mism?"（包上写的是「"+d.forName+"」，与本机名字不符，家长仍确认应用）":"")+"：新增军令 "+L.addT.length+"、调整 "+L.chgT.length+"、停用 "+L.offT.length+"；锦囊新增 "+L.addP.length+"、调整 "+L.chgP.length+"、撤下 "+L.delP.length+"（军令明天生效）");
  });
}

  let h='<h3>📥 导入设置包</h3><div class="sh-sub">把爸爸妈妈发来的那段文字（SZPK1: 开头）粘贴到下面。导入前会先告诉你会改什么，星星和日记都不会动。</div>';

function openPackConfirm(d){
  try{ packCheck(d); }catch(e){ toast(e.message,4200); return false; }
  const L=packDiff(d);
  const sec=(t,a)=>a.length?'<div style="margin-top:8px;"><b>'+t+'</b><br>'+a.map(esc).join("<br>")+'</div>':"";
  const any=Object.values(L).some(a=>a.length);
  const mism = !!d.forName && d.forName!==String(ST.childName||"").trim();
  let h='<h3>要改这些，确认吗？</h3>';
  if(mism) h+='<div class="quote" style="border-color:#EFC8BC;background:#FCEBE6;font-weight:700;">⚠️ 这份设置是给「'+esc(d.forName)+'」的，这台设备是「'+esc(ST.childName)+'」。可能发错人了，请先确认。</div>';
  h+='<div style="font-size:13px;line-height:1.7;font-weight:600;max-height:50vh;overflow:auto;">';
  h+=any?(sec("新增军令",L.addT)+sec("调整军令",L.chgT)+sec("停用军令（历史记录保留）",L.offT)+sec("新增锦囊",L.addP)+sec("调整锦囊",L.chgP)+sec("撤下锦囊",L.delP)):"和现在的设置完全一样，没有要改的。";
  h+='<div style="margin-top:10px;color:var(--ink-3);">军令从明天起生效，今天及之前的规则、记录和星星都不变。</div></div>';
  h+='<div class="grid2" style="margin-top:12px;"><button class="btn ghost" onclick="closeSheet()">不改</button><button class="btn" id="pkGo">'+(mism?"仍然应用":"确认应用")+'</button></div>';
  openSheet(h,(sheet)=>{
    const submit=()=>{
      if(!needParent(submit)) return;
      if(!packApply(d)) return;
      closeSheet(); refreshTop(); render(); toast("设置已更新，军令明天生效");
    };
    $("#pkGo",sheet).onclick=submit;
  });
}

/* =====================================================================

function openSheet(html, after){
  if(closeSheet()===false) return false;
  const mask=document.createElement("div");
  mask.className="mask";
  mask.innerHTML='<div class="sheet">'+html+'</div>';
  mask.addEventListener("click",e=>{ if(e.target===mask) closeSheet(); });
  document.body.appendChild(mask);
  document.body.style.overflow="hidden";
  if(after) after($(".sheet",mask));
}
function closeSheet(){
  if(DY_FLUSH){
    try{ if(DY_FLUSH()===false) return false; }
    catch(e){ toast("日记尚未存好，草稿面板已保留，请重试",4200); return false; }
  }
  DY_FLUSH=null; DY_HIDE=null;
  const m=$(".mask");
  if(m){
    const sheet=$(".sheet",m);
    if(sheet && sheet.querySelector("#dyText, .dy-page, #dyL1")) diaryScrubSheet(sheet);
    m.remove();
  }
  document.body.style.overflow="";
  return true;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* ---- 点卯飘字：让反馈有实体感 ---- */
function floatUp(text, x, y, gold){
  try{
    const el=document.createElement("div");
    el.className="float-up"+(gold?" gold":"");
    el.textContent=text;
    el.style.left=(x||window.innerWidth/2)+"px";
    el.style.top=(y||window.innerHeight*0.4)+"px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1250);
  }catch(e){}
}
// 从被点击的卡片位置飘出来
function floatFromEl(el,text,gold){
  if(!el) return floatUp(text,null,null,gold);
  const r=el.getBoundingClientRect();
  floatUp(text, r.left+r.width/2, r.top+Math.min(40,r.height/2), gold);
}

let JIAYE_LOAD_TIMER=0;
function viewJiaye(){
  return '<section class="jiaye-panel"><header class="jiaye-toolbar"><button id="jiaye-header-return" class="btn ghost" onclick="returnFromJiaye()">返回军令台</button><div class="jiaye-title"><h2>我的家业</h2><span>自己的小铺 · 铜钱不兑换军功</span></div><div class="jiaye-buttons"><button class="btn ghost" onclick="openJiayeHelp()">说明 / 备份</button></div></header><div id="jiaye-host" class="jiaye-host"><div class="jiaye-wait" id="jiaye-wait" role="status">正在打开自己的小铺…</div></div></section>';
}
function openJiayeHelp(){
  openSheet('<h3>我的家业 · 随时可以停下</h3><div class="sh-sub">少年主公里的自主经营支线。没有顾客立绘，来客需求用文字呈现。</div><p style="font-size:14.5px;line-height:1.7">暂停、返回或切到后台，不扣钱、不坏货，也不自动进入下一天。只有确认收摊才按既定规则结算。</p><div class="quote">完整备份包含学习、日记与家业进度。全部保存在本机，没有云同步。请把导出的文件另存好；不要删除原主屏幕图标或清理网站数据。</div><div class="grid2" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">返回店铺</button><button class="btn" onclick="exportData()">导出完整备份</button></div>');
}
function openJiaye(){
  if(!gatePassed()||!ST){showGate();return;}
  closeSheet();VIEW="jiaye";render();
}
function returnFromJiaye(){
  const frame=$("#jiaye-frame");
  try{if(frame&&frame.contentWindow.speechSynthesis)frame.contentWindow.speechSynthesis.cancel();}catch(e){}
  clearTimeout(JIAYE_LOAD_TIMER);VIEW="today";VIEW_DATE=TODAY();render();
  const entry=document.querySelector('[data-view="jiaye"]');if(entry)entry.focus();
}
function mountJiaye(){
  if(VIEW!=="jiaye"||!gatePassed()||!ST)return;
  const host=$("#jiaye-host"),payload=$("#jiaye-payload");
  if(!host||host.querySelector("iframe"))return;
  try{
    if(!payload||!payload.content)throw new Error("小游戏内容未完整保存");
    const encoded=payload.content.textContent.trim();
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const source=new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    if(!/^<!doctype html>/i.test(source)||!source.includes("shaozhu_jiaye_child_v7"))throw new Error("小游戏校验未通过");
    const frame=document.createElement("iframe");frame.id="jiaye-frame";frame.title="我的家业：五日杂货店经营";
    frame.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms");frame.setAttribute("referrerpolicy","no-referrer");
    frame.style.display="none";host.appendChild(frame);
    let blobURL="";
    if(location.protocol==="file:"){frame.srcdoc=source;}
    else{blobURL=URL.createObjectURL(new Blob([source],{type:"text/html;charset=utf-8"}));frame.dataset.blobURL=blobURL;frame.src=blobURL;}
    JIAYE_LOAD_TIMER=setTimeout(()=>{if(!frame.isConnected||frame.dataset.ready)return;if(blobURL)URL.revokeObjectURL(blobURL);frame.remove();const wait=$("#jiaye-wait");if(wait)wait.innerHTML='<p>小游戏未能完整打开，学习记录没有改变。</p><button class="btn" onclick="returnFromJiaye()">返回军令台</button>';},12000);
  }catch(e){const wait=$("#jiaye-wait");if(wait)wait.innerHTML='<p>小游戏暂时打不开，学习记录没有改变。</p><button class="btn" onclick="returnFromJiaye()">返回军令台</button>';}
}
window.addEventListener("message",event=>{
  const frame=$("#jiaye-frame");if(!frame||event.source!==frame.contentWindow)return;
  const sameOrigin=location.protocol==="file:"?(event.origin==="null"||event.origin==="file://"):event.origin===location.origin;
  if(!sameOrigin||!event.data||event.data.module!=="shaozhu-jiaye-v1")return;
  if(event.data.type==="ready"){clearTimeout(JIAYE_LOAD_TIMER);frame.dataset.ready="true";frame.style.display="block";const wait=$("#jiaye-wait");if(wait)wait.remove();}
  else if(event.data.type==="return")returnFromJiaye();
});
function setTab(){
  $$("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.view===VIEW));
}
function render(){
  const appRoot=document.querySelector(".app");if(appRoot)appRoot.classList.toggle("jiaye-active",VIEW==="jiaye");
  clearTimeout(JIAYE_LOAD_TIMER);
  const previousFrame=$("#jiaye-frame");
  try{if(previousFrame&&previousFrame.contentWindow.speechSynthesis)previousFrame.contentWindow.speechSynthesis.cancel();}catch(e){}
  if(previousFrame&&previousFrame.dataset.blobURL)URL.revokeObjectURL(previousFrame.dataset.blobURL);
  const m=$("#main");
  if(VIEW!=="diary") diaryRelock();   // 先隐藏正文和失败草稿面板，再渲染其他视图
  let html="";
  if(VIEW==="today")         html=viewToday();
  else if(VIEW==="week")     html=viewWeek();
  else if(VIEW==="heroes")   html=viewHeroes();
  else if(VIEW==="stats")    html=viewStats();
  else if(VIEW==="report")   html=viewReport();
  else if(VIEW==="settings") html=viewSettings();
  else if(VIEW==="diary")    html=viewDiary();
  else if(VIEW==="jiaye")    html=viewJiaye();
  m.innerHTML=html;
  if(VIEW==="jiaye") mountJiaye();
  setTab();
  refreshTop();
  window.scrollTo({top:0,behavior:"instant"});
}

  if(!gatePassed()){ showGate(); return; }

    // 旧存档异常时不能默默恢复出厂并覆盖；留下载原文件的恢复出口。
    $("#main").innerHTML='<div class="card"><h3>存档需要核查，已暂停写入</h3><p>'+esc(LOAD_ERROR)+'</p><p>原数据没有清空。请导出原始存档后再处理。</p><button class="btn" onclick="exportRawBackup()">导出原始存档</button></div>';
    return;
  }
  if(!ST){ ST=defaultState(); ST.parentPin=familyPin(); save(); }
  applySkin();
  // 存不住的话，先把话说清楚
  checkStorage();

  const settled=settleLedger();
  if(calcAchievements()||settled) save();
  VIEW_DATE=TODAY();
  $("#tabs").addEventListener("click",e=>{
    const b=e.target.closest("button[data-view]"); if(!b) return;
    VIEW=b.dataset.view;
    if(VIEW==="week"||VIEW==="report"||VIEW==="stats") VIEW_DATE=TODAY();
    render();
  });
  $("#btnDraw").addEventListener("click",openDraw);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ lockParent(); diarySuspend(); if(VIEW==="settings") render(); } });
  render();
  window.render=render; window.setTab=setTab; window.gotoDate=gotoDate;
  window.openJiaye=openJiaye; window.returnFromJiaye=returnFromJiaye;

  window.forgotPin=forgotPin; window.lockParent=lockParent; window.pickImport=pickImport;

  window.seedDemo=seedDemo; window.resetAll=resetAll;

  window.closeRitual=closeRitual; window.grantTickets=grantTickets;
  window.openRitual=openRitual; window.openGraduation=openGraduation;
  window.requestPersistentStorage=requestPersistentStorage; window.checkOfflineReady=checkOfflineReady; window.applyAppUpdate=applyAppUpdate; window.checkNewVersionCached=checkNewVersionCached;
  window.openExtraDay=openExtraDay; window.openKidAdd=openKidAdd;
  window.markTooHard=markTooHard; window.markWish=markWish;

  window.diaryMonth=diaryMonth; window.diaryShow=diaryShow; window.diaryIntroDone=diaryIntroDone; window.openDiaryLock=openDiaryLock;
  window.diaryUnlock=diaryUnlock; window.diaryRemoveLock=diaryRemoveLock; window.diaryForgot=diaryForgot;
  window.openCouponSettle=openCouponSettle; window.settleCoupon=settleCoupon;
  window.openBreakEdit=openBreakEdit; window.delBreak=delBreak;
  window.applyHint=applyHint;
  // 离线保护：保留完整入口参数，失败必须在设置里可见。
  startOfflineProtection();
  // 每日首次打开：先看有没有任务毕业，再给一张今日仪式卡

  setTimeout(()=>{

    if(!openGraduation()) openRitual();
  }, 260);
})();
